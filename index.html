        <div class="meta">${it.kind==="doel"?"Spaardoel":"Terugbetalen"} · prioriteit ${it.prio}${it.deadline?" · vóór "+dlang(it.deadline):it.vast>0?" · "+eur0(it.vast)+" per maand":" · zo snel mogelijk"} · betaaldag de ${betaaldag(it.src)}e${keywordsOf(it.src).length?"":" · geen zoekwoord"}</div>
        <div class="bar ${it.status==="laat"?"bad":""}"><i style="width:${pct.toFixed(1)}%"></i></div>
        <div class="g3"><span>${it.klaarDatum ? "Rond: "+MAANDEN_L[it.klaarDatum.getMonth()]+" "+it.klaarDatum.getFullYear() : "Niet binnen 3 jaar"} · nog ${eur0(it.restNu)}</span>${statusPill(it)}</div>
        ${it.status==="laat" ? `<div class="hint" style="color:var(--bad)">Haalt de datum niet.${A("pl.doelen")?" Tik om de datum later te zetten, het bedrag te verlagen of de prioriteit te verhogen.":""}</div>`:""}
      </button>${b0||b1 ? `<div class="bstrow">${bs("Deze maand", b0)}${bs("Volgende maand", b1)}</div>` : ""}</div>`;}).join("") || `<div class="empty">Nog geen spaardoelen of terugbetalingen.${A("pl.doelen")?" Voeg er een toe; het plan rekent dan uit wat jullie per maand opzij moeten zetten.":""}</div>`}</div>
  </section>` : ""}
  ${items.length && Z("pl.maandplan") ? accCard("pl:maandplan", "Maandplan", "Per loonperiode, 8 periodes vooruit", maandplan) : ""}
  ${Z("pl.meevallers") && (verwRows.length || A("pl.meevallers")) ? `<div data-perm="pl.meevallers">${accCard("pl:meev", "Verwacht", verwRows.length ? `+${eur0(verwacht)} in · −${eur0(geplTot)} uit` : "Nog niets: extra inkomsten of uitgaven", meev)}</div>` : ""}
  ${Z("pl.advies") ? adviesKaart() : ""}`;
}

// ---------- Tijdlijn (§3.7): één lijn, het saldo, met elke betaling op zijn dag ----------
const TL = {rows:[], vals:[], shown:null, anim:null, line:0};
const TL_KLEUR = {in:"var(--good)", mee:"var(--good)", vast:"var(--v1)", schuld:"var(--v1)", sparen:"var(--v3)", cc:"var(--v4)", gepl:"var(--v2)", doel:"var(--v3)", terug:"var(--v2)"};
function tdAttr(x){ return x.edit ? `data-edit="${esc(x.edit)}"` : x.go && x.go.startsWith("goaf:") ? `data-goaf="${x.go.slice(5)}"` : x.go && x.go.startsWith("lasten:") ? `data-tile="${x.go}"` : x.go ? `data-go="${x.go}"` : ""; }
function tlMeld(x){ const attr = x.html ? "" : tdAttr(x);
  return `<${attr?'button type="button"':"div"} class="tl-ml ${x.cls}${x.geel?" geel":""}" ${attr}${x.perm?` data-perm="${x.perm}"`:""}>${v3status(x.cls)}<div class="grow"><b>${esc(x.t)}</b><small>${x.s}</small>${x.html||""}</div></${attr?"button":"div"}>`; }
function renderTijdlijn(plan, cur){
  if(!S.posten.length && !S.inkomsten.length) return emptyAll();
  const t = plan.gl, zp = Z("tl.plan"), zm = Z("tl.meldingen");
  S.pbInfo = new Map();
  // markeringen: deadlines en "rond volgens plan" van terugbetalingen en spaardoelen
  const marks = new Map(), mk = (d, m) => { const k = iso(d); (marks.get(k)||marks.set(k,[]).get(k)).push(m); };
  if(zp) plan.items.forEach(it => {
    if(it.restNu<0.5) return;
    const soort = it.kind==="extra" ? "terug" : "doel", wat = it.kind==="extra" ? "terugbetaling" : "spaardoel", edit = (it.kind==="doel"?"doelen:":"extras:")+it.id;
    if(it.deadline && it.deadline>TODAY && it.deadline<=t.eind) mk(it.deadline, {naam:it.naam, soort, mark:true, item:it.naam, chip: it.status==="ok" ? ["good","Op schema"] : ["bad","Niet op tijd"], edit, perm:"pl.doelen",
      sub:`deadline ${wat} · nog ${eur0(it.restNu)} open${it.klaarDatum ? ` · volgens het plan rond in de periode t/m ${dkort(it.klaarDatum)} ${it.klaarDatum.getFullYear()}` : " · niet rond binnen 3 jaar"}`});
    if(it.done===0 || it.done===1){ const kd = plan.months[it.done].p.end; if(kd>=TODAY && kd<=t.eind) mk(kd, {naam:it.naam, soort, mark:true, item:it.naam, chip:["good","Rond"], edit, perm:"pl.doelen", sub:`${wat} volgens het plan rond in deze periode (${eur0(it.totaal)})`}); }
  });
  // meldingen uit Te doen op hun dag (betalingen staan al bij hun eigen regel)
  const meld = {nu:[], dag:new Map(), daarna:[]};
  if(zm) teDoen(plan, cur).forEach(m => {
    if(m.ev) return;                                   // staat al als geel blok bij de betaling zelf
    if(m.gevonden){ meld.nu.push(m); return; }         // gevonden op afschrift: bij Nu
    const d = m.d && m.d>TODAY ? m.d : null;
    if(!d) return meld.nu.push(m);
    if(d>t.eind) return meld.daarna.push(Object.assign({}, m, {s:`${dlang(d)}. `+m.s}));
    const opMk = m.item ? (marks.get(iso(d))||[]).find(x=>x.item===m.item) : null;
    if(opMk){ opMk.meld = m; return; }
    const kk = iso(d); (meld.dag.get(kk)||meld.dag.set(kk,[]).get(kk)).push(m);
  });
  const evVals = [];
  const evHtml = (e, q) => {
    const isPlan = !!e.plan, anoniem = isPlan && !zp;
    const naam = anoniem ? (e.soort==="terug" ? "Terugbetaling" : "Naar de spaarrekening") : e.naam;
    const attr = e.saldo ? (A("ov.saldo") ? `data-saldo` : "") : (!anoniem && e.edit && Z(e.perm) ? `data-edit="${esc(e.edit)}" data-perm="${e.perm}"` : "");
    const tag = attr ? 'button type="button"' : "div", ctag = attr ? "button" : "div";
    let bedrag;
    if(e.mark) bedrag = e.bedrag ? `<span class="tl-a muted">${e.soort==="mee"?"+":"−"}${eur(e.bedrag)}</span>` : "";
    else if(e.lvl===0) bedrag = `<span class="tl-a in">+${eur(e.amt)}</span>`;
    else if(e.lvl===1) bedrag = `<span class="tl-a">−${eur(e.wens)}</span>`;
    else bedrag = `<span class="tl-a ${e.status!=="ok"?"kort":""}">−${eur(e.x)}${e.status!=="ok"?`<small>van ${eur0(e.wens)}</small>`:""}</span>`;
    const ring = e.mark ? " ring" : "";
    const sub = e.mark ? e.sub : e.lvl===2 ? `terugbetalen · betaaldag de ${betaaldag(e.plan.it.src)}e` : e.soort==="doel" ? `naar de spaarrekening · betaaldag de ${betaaldag(e.plan.it.src)}e` : e.sub;
    const pt = e.na!=null && !e.mark ? ` data-tlp="${evVals.push({s:e.na, q, naam})-1}"` : "";
    const blok = e.lvl>=2 && !e.mark ? (anoniem ? (e.status!=="ok" ? `<div class="geel">${v3status("warn")}<div><b>Een betaling uit het plan lukt ${e.status==="niet"?"niet":"maar deels"}</b><small>${eur(e.x)} van ${eur(e.wens)}.</small></div></div>` : "") : pbKnoppen(e, true)) : "";
    return `<div class="tl-evw"><${tag} class="tl-ev${e.risico?" risk":""}${e.mark?" mk":""}" ${attr}${pt}><i class="tl-dot${ring}" style="--c:${TL_KLEUR[e.soort]||"var(--muted)"}"></i><span class="tl-n">${esc(naam)}${e.chip?` ${v3chip(e.chip[0], e.chip[1])}`:""}<small>${esc(anoniem ? "uit het plan" : (sub||""))}${e.risico?`<em> · in gevaar: ${eur0(e.risico)} tekort</em>`:""}</small>${e.meld && zm ? `<small class="tl-sub-ml ${e.meld.cls}">${esc(e.meld.t)}</small>` : ""}</span>${bedrag}</${ctag}>${blok}</div>`;
  };
  const vrijTxt = x => x.vrijW<0.005 ? "" : x.vrijX >= x.vrijW-0.005 ? `vrij besteden −${eur(x.vrijX)}` : x.vrijX>0.005 ? `vrij besteden −${eur(x.vrijX)} (van ${eur(x.vrijW)})` : `vrij besteden: geen ruimte`;
  const balHtml = (x, leeg) => `<div class="tl-bal">${leeg?"":`<span class="tl-bl">eind van de dag</span>`}<b class="${x.s<-0.5?"neg":""}">${eur(x.s)}</b></div>`;
  let vorigeMaand = TODAY.getMonth();
  const rows = t.days.map((x,i) => {
    const dm = zm ? (meld.dag.get(iso(x.d))||[]) : [];
    const items = x.ev.map(e=>evHtml(e, x.vrijVanaf)).join("") + (marks.get(iso(x.d))||[]).map(e=>evHtml(e, x.vrijVanaf)).join("");
    const extra = [];
    if(i>0 && t.laag.i===i && t.laag.v < t.start-0.5) extra.push(`<span class="tl-flag ${t.laag.v<-0.5?"bad":""}">laagste punt</span>`);
    if(t.onder && t.onder.i===i) extra.push(`<span class="tl-flag bad">rekening in de min</span>`);
    const leeg = !items && !dm.length && !extra.length;
    const maandKop = x.d.getMonth()!==vorigeMaand ? (vorigeMaand = x.d.getMonth(), true) : false;
    const div = x.loondag ? `<div class="tl-div"><span>Loondag · ${dkort(t.p1.start)} – ${dkort(t.p1.end)}</span></div>` : "";
    const vt = vrijTxt(x), vtCls = x.vrijW>0.005 && x.vrijX < x.vrijW-0.005 ? " kort" : "";
    return `${div}<div class="tl-day${leeg?" leeg":""}${i===0?" today":""}${x.loondag?" ld":""}" data-tli="${i}">
      <div class="tl-date"><b>${x.d.getDate()}</b><span>${i===0?"vandaag":DAGEN[x.d.getDay()]+(maandKop?" "+MAANDEN[x.d.getMonth()]:"")}</span></div>
      <div class="tl-body">${extra.length?`<div class="tl-flags">${extra.join("")}</div>`:""}${items}${dm.map(tlMeld).join("")}${leeg ? `<div class="tl-leegr"><span class="tl-quiet${vtCls}">${vt || "geen boekingen"}</span>${balHtml(x, true)}</div>` : `${vt?`<span class="tl-quiet${vtCls}">${vt}</span>`:""}${balHtml(x, false)}`}</div></div>`;
  }).join("");
  TL.vals = t.days.map(x=>({d:x.d, s:x.s, q:Math.max(0, x.vrijVanaf - x.vrijX), qb:x.vrijVanaf, p:x.p})); TL.evVals = evVals;
  TL.nu = {s:t.start, q:t.days[0] ? t.days[0].vrijVanaf : 0};
  // grafiek van het saldo over de hele tijdlijn
  const all = [t.start, ...t.days.map(x=>x.s)];
  const mn = Math.min(0, ...all), mx = Math.max(1, ...all), W = 300, H = 56, n = t.days.length;
  const X = i => (i/(Math.max(1,n-1)))*W, Y = v => H-3 - (v-mn)/(mx-mn||1)*(H-6);
  const path = t.days.map((x,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(x.s).toFixed(1)}`).join("");
  const ldX = X(t.days.findIndex(x=>x.loondag));
  TL.X = X; TL.n = n;
  const spark = `<svg class="tl-spark" id="tlSpark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Verloop van het saldo van ${eur0(t.start)} nu tot ${eur0(t.days[n-1].s)} op ${dkort(t.eind)}">
    ${mn<0 ? `<line x1="0" x2="${W}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" class="z"/>` : ""}
    ${ldX>0 ? `<line x1="${ldX.toFixed(1)}" x2="${ldX.toFixed(1)}" y1="0" y2="${H}" class="ld"/>` : ""}
    <path d="${path}" class="s"/>
    <line id="tlCur" x1="0" x2="0" y1="0" y2="${H}" class="cur"/></svg>`;
  const head = `<section class="tl-head" id="tlHead" aria-live="off" aria-label="Stand op de rekening">
    <div class="tlh-top"><span id="tlD">Nu · ${dkort(TODAY)}</span><span class="tlh-tag" id="tlTag" data-nu="${t.schatting ? "schatting" : t.sd.dagen ? "doorgerekend" : "saldo van vandaag"}">${t.schatting ? "schatting" : t.sd.dagen ? "doorgerekend" : "saldo van vandaag"}</span></div>
    <div class="tlh-big${t.start<-0.5?" neg":""}" id="tlS">${eur(t.start)}</div>
    <div class="tlh-sub">vrij te besteden <b id="tlQ">${eur(TL.nu.q)}</b></div>
    ${spark}
  </section>`;
  // Nu
  const r = (l, v, cls) => `<div class="wf"><span>${l}</span><b class="${cls||""}">${v}</b></div>`;
  const st = t.sd, stTijd = st && st.tijd ? new Date(st.tijd) : null;
  const hhmm = stTijd && !isNaN(stTijd) ? " om "+String(stTijd.getHours()).padStart(2,"0")+":"+String(stTijd.getMinutes()).padStart(2,"0") : "";
  const pm = x => (x<-0.005 ? "− " : "+ ")+eur(Math.abs(x));
  const sinds = !st || !st.dagen ? "" : (st.af.n ? r(`Sindsdien op het afschrift (${st.af.n} boeking${st.af.n===1?"":"en"})`, pm(st.af.in-st.af.uit)) : "")
    + (st.geschat ? r(`Sindsdien verwacht, nog zonder afschrift (${st.vw.dagen} dag${st.vw.dagen===1?"":"en"})`, pm(st.verwacht)) : "")
    + `<div class="wf tot"><span>Saldo nu, doorgerekend</span><b class="${st.saldo<-0.5?"neg":""}">${eur(st.saldo)}</b></div>`;
  const v = t.per[0].vrij;
  const startBlok = st ? `<div class="wfall">${(st.dagen ? r(`Saldo ingevuld op ${dkort(st.D)}${st.door?" door "+esc(st.door):""}`, eur(st.saldo0), st.saldo0<0?"neg":"") + sinds : r(`Saldo${st.door?" (ingevuld door "+esc(st.door)+hhmm+")":""}`, eur(st.saldo), st.saldo<0?"neg":""))}${st.ccNu ? r("Creditcard, gaat nu af", "− "+eur(st.cc)) : ""}<div class="wf tot"><span>Start van de tijdlijn</span><b class="${t.start<-0.5?"neg":""}">${eur(t.start)}</b></div>${r(`Vrij te besteden tot ${dkort(t.p0.end)}`, `${eur0(v.x)}${v.x<v.budget-0.5?` van ${eur0(v.budget)}`:""}`, v.x<v.budget-0.5?"neg":"")}</div>`
    : `<div class="vd3 warn">${v3status("warn")}<div><b>Nog geen saldo ingevuld</b><small>De tijdlijn start met een schatting uit wat er deze periode binnenkwam en uitging: ${eur(t.start)}. Vul één keer het echte saldo in; daarna rekent de tool het elke dag zelf door.</small></div></div>${A("ov.saldo") ? `<button type="button" class="btn primary wide" data-saldo>Saldo invullen</button>` : ""}`;
  const nuMk = t.nuMk.map(e=>evHtml(e, TL.nu.q)).join("");
  const nuMeldL = zm ? (hasMore("tlnu") ? meld.nu : meld.nu.slice(0,3)) : [];
  const nuMeld = nuMeldL.map(tlMeld).join("") + (zm ? moreBtn("tlnu", meld.nu.length, 3) : "");
  const nuCard = `<section class="card c3 tl-nu" data-tli="-1"><div class="h3row"><h2>Nu</h2><span class="sub3">${dlang(TODAY)}</span></div>${startBlok}${nuMk?`<div class="tl-evs">${nuMk}</div>`:""}${nuMeld?`<div class="tl-mls">${nuMeld}</div>`:""}</section>`;
  const naL = (t.ccNa ? [{cls:"info", t:`Creditcard ${eur(t.ccNa.cc)} op ${dkort(t.ccNa.d)}`, s:"Gaat pas na het einde van de tijdlijn af en staat er dus niet op."}] : []).concat(zm ? meld.daarna : []);
  const daarna = naL.length ? `<section class="card c3"><div class="h3row"><h2>Daarna</h2><span class="sub3">na ${dkort(t.eind)}</span></div><div class="tl-mls">${naL.map(tlMeld).join("")}</div></section>` : "";
  const uitleg = `<details class="det" data-det="tl:uitleg" ${isOpen("tl:uitleg")?"open":""}><summary><div class="grow"><div class="name">Hoe rekent de tijdlijn?</div><div class="meta">Stand aan het eind van elke dag</div></div><span class="chev">${ICO3.down}</span></summary><div class="tl-help">
    <p>De lijn is wat er op de rekening staat: ${t.schatting ? "de schatting van nu" : t.sd.dagen ? `het saldo dat op ${dkort(t.sd.D)} is ingevuld, doorgerekend tot vandaag (met het afschrift, en voor dagen zonder afschrift met wat er verwacht werd)` : "het ingevulde saldo van vandaag"}, plus inkomsten, min alles wat afgaat: rekeningen, de creditcard, terugbetalingen, sparen, geplande aankopen en het vrije besteden (gelijk verdeeld over de dagen).</p>
    <p>Als het krap wordt, gaat het in deze volgorde: <b>1 rekeningen</b>, <b>2 terugbetalingen</b>, <b>3 vrij besteden</b>, <b>4 sparen</b>. Een betaling gaat alleen af als alles met meer voorrang, ook later tot ${dkort(t.eind)}, nog betaald kan worden. Lukt dat niet, dan staat er een geel blok met wat er wel kan (soms €0).</p>
    <p>Is de betaaldag voorbij, dan vraagt de tool "overgemaakt?". Zolang jullie dat niet invullen, houdt hij het geld apart.</p>
    <p>Tik op een regel om de vaste last, het inkomen, het doel of de geplande uitgave te openen. Tik op de grafiek om naar een dag te springen.</p></div></details>`;
  return `${head}${nuCard}<section class="tl-list" aria-label="Tijdlijn per dag">${rows}</section><div class="tl-end" id="tlEnd"></div>${daarna}${uitleg}`;
}

function emptyAll(){
  const b = [A("vl.uitgaven")?`<button class="btn primary" data-new="posten">Vaste last toevoegen</button>`:"", A("vl.inkomsten")?`<button class="btn" data-new="inkomsten">Inkomen toevoegen</button>`:""].join("");
  return `<section class="card"><h2>Nog geen gegevens</h2><p class="muted">Hier komen jullie vaste lasten, inkomsten, doelen en afschriften.${b?" Begin met een vaste last of inkomen.":""}</p>
  ${b?`<div class="btnrow">${b}</div>`:""}</section>`;
}

function renderLasten(plan, cur){
  const per = it => it.freq==="week" ? num(it.bedrag)*52/12 : num(it.bedrag);
  const groups = {};
  S.posten.forEach(p => { (groups[p.categorie||"Overig"] ||= []).push(p); });
  const totM = S.posten.reduce((s,p)=>s+per(p),0);
  const totI = S.inkomsten.reduce((s,p)=>s+num(p.bedrag),0);
  const schulden = schuldInfo();
  const restTot = schulden.reduce((s,x)=>s+(x.rest||0),0);
  const descDag = it => it.freq==="week" ? "elke "+DAGEN_L[it.weekdag==null?4:+it.weekdag] : "op de "+it.dag+"e";
  const segZ = {uit:Z("vl.uitgaven"), in:Z("vl.inkomsten"), schuld:Z("vl.schulden")};
  const segs = Object.keys(segZ).filter(k=>segZ[k]);
  const seg = segs.includes(S.segL||"uit") ? (S.segL||"uit") : segs[0];
  const cats = Object.entries(groups).map(([c,l])=>({c, l, v:l.reduce((s,p)=>s+per(p),0)})).sort((a,b)=>b.v-a.v);
  const maxV = cats.length ? cats[0].v : 1;
  const terug = S.extras.filter(x=>x.richting!=="in" && x.status!=="betaald");
  const segBtn = (k,l,n) => `<button type="button" data-segl="${k}" aria-pressed="${seg===k}">${l}<span class="cnt">${n}</span></button>`;
  let body = "";
  if(seg==="in") body = `<section class="card tight" data-perm="vl.inkomsten"><div class="sec-h"><h2>Inkomsten</h2>${A("vl.inkomsten")?`<button class="btn sm" data-new="inkomsten">+ Inkomen</button>`:""}</div>
    <div class="list">${S.inkomsten.slice().sort((a,b)=>a.dag-b.dag).map(i=>`<button class="item" data-edit="inkomsten:${esc(i.id)}"><div class="date"><b>${esc(i.dag)}</b><span>dag</span></div><div class="grow"><div class="name">${esc(i.naam)}</div>${i.zoekwoorden?`<div class="meta">herkend aan: ${esc(i.zoekwoorden)}</div>`:""}</div><div class="amt in">${eur(num(i.bedrag))}</div></button>`).join("") || `<div class="empty">Nog geen inkomsten.</div>`}</div>
    </section>`;
  else if(seg==="schuld") body = `<section class="card tight" data-perm="vl.schulden"><div class="sec-h"><h2>Afbetalingen &amp; schulden</h2></div>
    <div class="list">${schulden.map(x=>`<button class="item" data-edit="posten:${esc(x.p.id)}"><div class="grow"><div class="name">${esc(x.p.naam)}</div><div class="meta">${x.e ? "t/m "+dkort(x.e)+" "+x.e.getFullYear()+" · nog "+x.n+" termijnen" : "geen einddatum bekend"}</div>
      ${x.e && num(x.p.totaal)>0 ? `<div class="bar thin"><i style="width:${Math.max(0,Math.min(100,(1-(x.rest/num(x.p.totaal)))*100)).toFixed(1)}%"></i></div>`:""}</div>
      <div style="text-align:right"><div class="amt">${eur(num(x.p.bedrag))}</div><div class="meta">${x.rest!=null?"rest "+eur0(x.rest):""}</div></div></button>`).join("") || `<div class="empty">Geen afbetalingen.</div>`}</div>
    ${terug.length && Z("pl.doelen") ? `<button type="button" class="linkbtn" data-go="plan">${terug.length} terugbetaling${terug.length===1?"":"en"} (${eur0(terug.reduce((s,x)=>s+num(x.bedrag)-num(x.betaald),0))}) staan bij Plan &amp; doelen ›</button>`:""}</section>`;
  else body = `<section class="card tight" data-perm="vl.uitgaven"><div class="sec-h"><h2>Per categorie</h2>${A("vl.uitgaven")?`<button class="btn sm" data-new="posten">+ Vaste last</button>`:""}</div>
    <div class="detlist">${cats.map(x=>{ const k="cat:"+x.c; return `<details class="det cat" data-det="${esc(k)}" ${isOpen(k)?"open":""}><summary><div class="grow"><div class="kv"><span class="catname">${esc(x.c)} <span class="catmeta">${x.l.length} · ${Math.round(x.v/Math.max(1,totM)*100)}%</span></span><b>${eur0(x.v)}</b></div><div class="bar thin"><i style="width:${(x.v/maxV*100).toFixed(1)}%"></i></div></div><span class="chev">${ICO.down}</span></summary>
      <div class="sublist">${x.l.slice().sort((a,b)=>(a.dag||0)-(b.dag||0)).map(p=>`<button class="item" data-edit="posten:${esc(p.id)}"><div class="grow"><div class="name">${esc(p.naam)}</div><div class="meta">${descDag(p)}${p.einddatum?" · t/m "+dkort(parseIso(p.einddatum))+" "+parseIso(p.einddatum).getFullYear():""}${keywordsOf(p).length?"":" · geen zoekwoord"}</div></div><div class="amt">${eur(num(p.bedrag))}${p.freq==="week"?"<span class='meta'> /wk</span>":""}</div></button>`).join("")}</div></details>`; }).join("") || `<div class="empty">Nog geen vaste lasten.</div>`}</div>
    <p class="hint">Tik op een categorie voor de posten en op een post om hem ${A("vl.uitgaven")?"aan te passen":"te bekijken"}.</p></section>`;
  const schuldPerMaand = schulden.reduce((s,x)=>s+per(x.p),0);
  const sum = seg==="in" ? {l:"Inkomsten per maand", r:S.inkomsten.length+" inkomsten", big:eur0(totI), eq:"Wat er elke maand binnenkomt, met de dag van binnenkomst"}
    : seg==="schuld" ? {l:"Nog af te lossen", r:schulden.length+" afbetalingen", big:eur0(restTot), eq:`<b>${eur0(schuldPerMaand)}</b> per maand aan afbetalingen`}
    : {l:"Vaste lasten per maand", r:S.posten.length+" posten", big:eur0(totM), eq:`In ${cats.length} categorieën · weekposten omgerekend naar een maand`};
  return `
  ${segs.length>1 ? `<div class="segbar"><div class="seg big" role="group" aria-label="Onderdeel">${segZ.uit?segBtn("uit","Uitgaven",S.posten.length):""}${segZ.in?segBtn("in","Inkomsten",S.inkomsten.length):""}${segZ.schuld?segBtn("schuld","Schulden",schulden.length):""}</div></div>` : ""}
  <section class="sum" aria-label="${sum.l}">
    <div class="lbl"><span>${sum.l}</span><span>${sum.r}</span></div>
    <div class="big">${sum.big}</div>
    <div class="eq">${sum.eq}</div>
  </section>
  ${body}`;
}

// ---------- adviesmotor: signalen zoeken, rangschikken op euro's en urgentie, doorrekenen met de planner ----------
// Geen AI: elk advies komt uit jullie eigen cijfers. Waar een advies iets verandert (een datum, een maandbedrag, het vrije
// budget), rekent de motor met buildPlan uit wat dat oplevert voor de doelen en terugbetalingen, net als "Kan dit?".
const ADV = {acties:new Map(), n:0};
const maandJaar = d => MAANDEN_L[d.getMonth()]+" "+d.getFullYear();
const rond10 = x => Math.ceil(x/10)*10;
// basistoestand: hetzelfde plan + dezelfde geldlijn als op het scherm (bereken)
function advBasis(plan){
  const p0 = periodN(0), cur = periodCalc(p0);
  plan = plan || bereken();
  return {p0, cur, plan, gl:plan.gl, sp:plan.sp, dagen: Math.max(1, daysBetween(TODAY, p0.end)+1), loondag: addDays(p0.end,1)};
}
// rekent plan en geldlijn opnieuw door met een aanpassing en zet daarna alles terug
function advSim(B, mod){
  const cfg = S.config, doelen = S.doelen, extras = S.extras, pbi = S.pbInfo;
  try{
    if(mod.vrijMinder) S.config = Object.assign({}, cfg, {vrijBudget: Math.max(0, num(cfg.vrijBudget) - mod.vrijMinder)});
    if(mod.item){ const m = mod.item, lijst = m.kind==="doel" ? "doelen" : "extras";
      S[lijst] = S[lijst].map(x => x.id===m.id ? Object.assign({}, x, m.velden) : x); }
    if(mod.nieuwDoel) S.doelen = S.doelen.concat([mod.nieuwDoel]);
    return bereken();
  } finally { S.config = cfg; S.doelen = doelen; S.extras = extras; S.pbInfo = pbi; }
}
// wat verandert er voor de doelen en terugbetalingen?
function advEffect(basis, nieuw, alleen){
  const uit = [];
  nieuw.items.forEach(n => {
    if(alleen && !alleen.includes(n.id)) return;
    const o = basis.items.find(x=>x.id===n.id); if(!o) return;
    const a = o.klaarDatum, b = n.klaarDatum;
    if(o.status!=="ok" && n.status==="ok") uit.push({goed:true, t:`${n.naam} haalt ${n.deadline ? "de datum ("+dlang(n.deadline)+")" : "het doel"}${b?", rond in "+maandJaar(b):""}`});
    else if(o.status==="ok" && n.status!=="ok") uit.push({goed:false, t:`${n.naam} haalt ${n.deadline ? "de datum" : "het doel"} dan niet meer`});
    else if(a && b && b<a) uit.push({goed:true, t:`${n.naam} rond in ${maandJaar(b)} (nu ${maandJaar(a)})`});
    else if(a && b && b>a) uit.push({goed:false, t:`${n.naam} rond in ${maandJaar(b)} (nu ${maandJaar(a)})`});
    else if(!a && b) uit.push({goed:true, t:`${n.naam} rond in ${maandJaar(b)} (nu niet binnen 3 jaar)`});
  });
  return uit;
}
function advActie(label, perm, run, stijl){
  const k = "a"+(++ADV.n); ADV.acties.set(k, {run, perm});
  return `<button type="button" class="btn sm ${stijl||""}" data-advact="${k}">${esc(label)}</button>`;
}
function bewaarDoc(coll, src, velden){ return db.doc(coll+"/"+src.id).set(Object.assign({}, src, velden, {id:src.id, bijgewerkt:new Date().toISOString()})); }
function itemColl(it){ return it.kind==="doel" ? "doelen" : "extras"; }
function datumVeld(it){ return it.kind==="doel" ? "datum" : "deadline"; }
// laatste dag van de loonperiode waarin d valt, als ISO-datum
function periodeEindIso(d){ const s = periodStartFor(d); return iso(addDays(new Date(s.getFullYear(), s.getMonth()+1, s.getDate()), -1)); }

// ---- alle signalen, met score (hoe hoger, hoe belangrijker) ----
function adviezen(B, scope){
  const L = [], plan = B.plan;
  const spaar = num(S.config.spaarsaldo), buf = num(S.config.buffer||1000), vrijCfg = num(S.config.vrijBudget);
  const tekortItem = plan.items.find(i=>i.status==="laat") || plan.items.find(i=>i.status==="nooit");
  const naam1 = tekortItem ? tekortItem.naam : null;
  const voeg = a => L.push(a);

  if(scope!=="afschrift"){
    const gl = B.gl;
    // rekeningen komen tekort (één potje: de geldlijn)
    if(gl.tekortRek>0.5){ const lr = gl.laagRek, som = gl.tekortRek;
      voeg({td:true, score:5000, lvl:"bad", titel:`Er is ${eur0(som)} extra nodig voor de rekeningen`,
        waarom:`${gl.start<-0.5 ? "De rekening staat nu al rood. " : ""}Op ${dkort(lr.d)} staat hij op het laagst: ${eur(lr.v)}. Tot dan gaat er niets naar terugbetalingen, vrij besteden of sparen.`,
        doen: spaar>=som ? `Zet ${eur0(som)} over van de spaarrekening (nu ${eur0(spaar)}), vóór ${dkort(lr.d)}.` : `De spaarrekening (${eur0(spaar)}) is niet genoeg: stel uitgaven uit of vraag uitstel bij een rekening die voor ${dkort(lr.d)} afgaat.`}); }
    // vrij budget op
    if(gl.U > gl.vrijCfg+0.5){
      const mis = gl.per[0].problemen.concat(gl.per[1].problemen).filter(e=>e.plan).slice(0,3);
      voeg({td:true, score:900 + (gl.U-gl.vrijCfg)/10, lvl:"warn", titel:`Geen losse uitgaven meer tot ${dkort(B.loondag)}`,
        waarom:`${eur0(gl.U)} uitgegeven van een budget van ${eur0(gl.vrijCfg)}. Wat er nu nog uitgaat, gaat af van ${gl.tekortRek>0.5 ? "het geld voor de rekeningen" : "sparen en daarna terugbetalingen"}.`,
        doen:`Houd tot loondag alleen boodschappen en rekeningen aan.`,
        effect: mis.map(e=>({goed:false, t:`${e.naam}: ${eur0(e.x)} van ${eur0(e.wens)} op ${dkort(e.d)}`}))});
    } else {
      const v = gl.per[0].vrij;
      if(v.x>0.5) voeg({score:8, lvl:"good", titel:`Nog ${eur0(v.x)} vrij tot ${dkort(B.loondag)}`,
        waarom:`Dat is ${eur(v.x/B.dagen)} per dag.`, doen:`Binnen dit bedrag blijven houdt het plan op schema.`});
    }
    // doelen en terugbetalingen die hun datum niet halen
    plan.items.filter(i=>i.status==="laat" && i.deadline).forEach(it => {
      const rest0 = Math.max(0, it.totaal - num(it.kind==="doel" ? it.src.gespaard : it.src.betaald));
      let left = 0; for(let k=0;k<plan.months.length;k++){ left++; if(plan.months[k].p.end >= it.deadline) break; }
      const nodig = it.deadline < B.p0.start ? rest0 : rest0/Math.max(1,left);
      const krijgt = it.alloc.slice(0,left).reduce((s,x)=>s+x,0)/Math.max(1,left);
      const opties = [], acties = [];
      // 1) minder vrij budget per maand
      let stap = null;
      const lost = x => { const s = advSim(B, {vrijMinder:x}); const n = s.items.find(y=>y.id===it.id); return n && n.status==="ok" ? s : null; };
      const maxStap = Math.floor(vrijCfg/25);
      if(maxStap>0){ const sMax = lost(maxStap*25);
        if(sMax){ let lo = 0, hi = maxStap, best = sMax;   // kleinste stap van €25 die het oplost
          while(hi-lo>1){ const mid = (lo+hi)>>1, sm = lost(mid*25); if(sm){ hi = mid; best = sm; } else lo = mid; }
          stap = {x:hi*25, s:best}; } }
      if(stap){ const bij = advEffect(plan, stap.s).filter(e=>!e.t.startsWith(it.naam));
        opties.push(`<b>Vrij budget ${eur0(stap.x)} lager</b> (${eur0(vrijCfg-stap.x)} per maand): dan haalt ${esc(it.naam)} de datum.${bij.length?" "+bij.map(e=>esc(e.t)).join("; ")+".":""}`);
        if(A("in.vrijBudget")) acties.push(advActie(`Vrij budget op ${eur0(vrijCfg-stap.x)}`, "in.vrijBudget", () => db.doc("config/main").set(Object.assign({}, S.config, {vrijBudget: vrijCfg-stap.x}))));
      }
      // 2) hogere prioriteit
      if(it.prio>1){ const s = advSim(B, {item:{id:it.id, kind:it.kind, velden:{prio:1}}}); const n = s.items.find(y=>y.id===it.id);
        if(n && n.status==="ok"){ const later = advEffect(plan, s).filter(e=>!e.goed);
          opties.push(`<b>Prioriteit 1</b>: dan haalt ${esc(it.naam)} de datum${later.length?", maar "+later.map(e=>esc(e.t)).join("; "):""}.`);
          if(A("pl.doelen")) acties.push(advActie("Prioriteit 1", "pl.doelen", () => bewaarDoc(itemColl(it), it.src, {prio:1}))); } }
      // 3) realistische datum
      if(it.klaarDatum){ const nieuweDatum = periodeEindIso(it.klaarDatum);
        opties.push(`<b>Datum naar ${maandJaar(it.klaarDatum)}</b>: zo ver komt het plan nu.`);
        if(A("pl.doelen")) acties.push(advActie(`Datum op ${dkort(parseIso(nieuweDatum))} ${parseIso(nieuweDatum).getFullYear()}`, "pl.doelen", () => bewaarDoc(itemColl(it), it.src, {[datumVeld(it)]: nieuweDatum}))); }
      const dagenTot = daysBetween(TODAY, it.deadline);
      voeg({score: 700 + (nodig-krijgt)*2 + Math.max(0, 365-dagenTot)/2, lvl:"bad", titel:`${it.naam} haalt ${dlang(it.deadline)} niet`,
        waarom:`Nodig is ${eur0(nodig)} per maand; het plan heeft er gemiddeld ${eur0(krijgt)} voor. ${it.klaarDatum ? "Nu rond in "+maandJaar(it.klaarDatum)+"." : "Binnen drie jaar komt het niet rond."}`,
        opties, acties});
    });
    // doelen zonder ruimte
    plan.items.filter(i=>i.status==="nooit").forEach(it => {
      const rest0 = Math.max(0, it.totaal - num(it.kind==="doel" ? it.src.gespaard : it.src.betaald));
      const mb = rond10(rest0/24), s = advSim(B, {item:{id:it.id, kind:it.kind, velden:{maandbedrag:mb}}});
      const n = s.items.find(y=>y.id===it.id), later = advEffect(plan, s).filter(e=>!e.goed);
      const acties = A("pl.doelen") ? [advActie(`${eur0(mb)} per maand`, "pl.doelen", () => bewaarDoc(itemColl(it), it.src, {maandbedrag:mb}))] : [];
      voeg({score:300 + rest0/100, lvl:"warn", titel:`${it.naam} komt niet rond binnen drie jaar`,
        waarom:`Na de andere doelen blijft er niets voor over (nog ${eur0(rest0)} nodig).`,
        doen:`Geef het een vast bedrag van ${eur0(mb)} per maand${n && n.klaarDatum ? `: dan rond in ${maandJaar(n.klaarDatum)}` : ""}.`,
        effect: later.slice(0,3), acties});
    });
    // buffer
    if(spaar < buf){
      const bufDoel = plan.items.find(i=>i.kind==="doel" && /buffer|nood/i.test(i.naam));
      if(bufDoel){
        voeg({score:120, lvl:"warn", titel:`Buffer ${eur0(spaar)} van ${eur0(buf)}`,
          waarom:`Een onverwachte rekening kan nu nog niet uit eigen geld.`,
          doen: bufDoel.klaarDatum ? `${bufDoel.naam} is volgens plan rond in ${maandJaar(bufDoel.klaarDatum)}. Houd dat doel aan en geef het voorrang als er iets overblijft.` : `${bufDoel.naam} komt met het huidige plan niet rond: geef het een vast maandbedrag.`});
      } else {
        const mb = rond10((buf-spaar)/12), nieuw = {id:"__buffer", naam:"Buffer", bedrag:buf-spaar, gespaard:0, maandbedrag:mb, soort:"noodzakelijk", prio:2};
        const s = advSim(B, {nieuwDoel:nieuw}), nb = s.items.find(y=>y.id==="__buffer");
        const acties = A("pl.doelen") ? [advActie(`Doel Buffer (${eur0(mb)}/maand)`, "pl.doelen", () => { const id = uid(); return db.doc("doelen/"+id).set(Object.assign({}, nieuw, {id, bijgewerkt:new Date().toISOString()})); })] : [];
        voeg({score:150, lvl:"warn", titel:`Buffer ${eur0(spaar)} van ${eur0(buf)}`,
          waarom:`Een onverwachte rekening kan nu nog niet uit eigen geld.`,
          doen:`Maak een spaardoel Buffer van ${eur0(buf-spaar)} met ${eur0(mb)} per maand${nb && nb.klaarDatum ? `; rond in ${maandJaar(nb.klaarDatum)}` : ""}.`,
          effect: advEffect(plan, s).filter(e=>!e.goed).slice(0,2), acties});
      }
    }
    // afbetalingen die binnen een half jaar stoppen
    const stopt = S.posten.filter(p=>p.einddatum).map(p=>({p, e:parseIso(p.einddatum)})).filter(x=>x.e && daysBetween(TODAY,x.e)>=0 && daysBetween(TODAY,x.e)<=183).sort((a,b)=>a.e-b.e);
    if(stopt.length){ const som = stopt.reduce((s,x)=>s+num(x.p.bedrag),0);
      voeg({score:20, lvl:"good", titel:`Vanaf ${maandJaar(addDays(stopt[stopt.length-1].e,1))} ${eur0(som)} per maand meer ruimte`,
        waarom:`Dan stoppen ${stopt.map(x=>`${x.p.naam} (${dkort(x.e)})`).join(", ")}.`,
        doen: naam1 ? `Het plan rekent hier al mee: dat geld gaat vanzelf naar ${naam1} en de andere doelen. Laat het daar ook echt heen gaan.` : `Het plan rekent hier al mee; laat het geld naar de doelen gaan in plaats van naar losse uitgaven.`});
    }
  }

  // ---- afschrift: waar het geld heen ging ----
  const af = scope==="afschrift" ? selectedAfschrift() : B.sp.af;
  if(af){
    const an = analyseAfschrift(af), dagen = Math.max(1, daysBetween(an.van, an.tot)+1), pm = v => v*(365/12)/dagen;
    const prevAf = S.afschriften.filter(a=>a.id!==af.id && a.tot && a.tot < af.van).sort((a,b)=>a.tot<b.tot?1:-1)[0];
    const prev = prevAf ? analyseAfschrift(prevAf) : null, pdagen = prev ? Math.max(1, daysBetween(prev.van, prev.tot)+1) : 1;
    const perCat = {}; an.varRows.forEach(r=>{ const c = classify(r).cat; if(c==="Nog in te delen") return; perCat[c] = (perCat[c]||0) - r[2]; });
    const prevCat = {}; if(prev) prev.varRows.forEach(r=>{ const c = classify(r).cat; prevCat[c] = (prevCat[c]||0) - r[2]; });
    const cats = Object.entries(perCat).map(([c,v])=>({c, pm:pm(v), was: prev ? (prevCat[c]||0)*(365/12)/pdagen : null})).sort((a,b)=>(b.pm-(b.was||0))-(a.pm-(a.was||0)));
    const ontw = cats.find(x=>x.was!=null && x.pm - x.was >= 40);
    if(ontw){ const d = ontw.pm - ontw.was, s = advSim(B, {vrijMinder:d});
      voeg({score:200 + d/5, lvl:"warn", titel:`${ontw.c}: ${eur0(d)} per maand meer dan vorige maand`,
        waarom:`Omgerekend naar een hele maand ${eur0(ontw.pm)}, tegen ${eur0(ontw.was)} de maand ervoor.`,
        doen:`Terug naar het niveau van vorige maand scheelt ${eur0(d)} per maand.`, effect: advEffect(plan, s).filter(e=>e.goed).slice(0,2), goaf:"soort", focus:"ps:"+ontw.c});
    } else if(!prev){
      const LOS = ["Horeca & bezorging","Uitjes & vrije tijd","Winkels & online","Elektronica","Kleding & verzorging","Gaming","Cadeaus","Huis & tuin","Contant"];
      const som = {}; an.varRows.forEach(r=>{ const c = classify(r).cat; if(LOS.includes(c)) som[c] = (som[c]||0) - r[2]; });
      const groot = Object.entries(som).sort((a,b)=>b[1]-a[1])[0];
      if(groot && groot[1] > vrijCfg*0.25){ const helft = groot[1]/2, s = advSim(B, {vrijMinder:helft});
        voeg({score:100 + groot[1]/5, lvl:"info", titel:`${groot[0]}: ${eur0(groot[1])} in ${dagen} dagen`,
          waarom:`Dat is ${Math.round(groot[1]/Math.max(1,vrijCfg)*100)}% van het vrije budget voor een hele maand (${eur0(vrijCfg)}).`,
          doen:`Geven jullie hier voortaan de helft aan uit, dan houden jullie ongeveer ${eur0(helft)} per maand over voor het plan.`, effect: advEffect(plan, s).filter(e=>e.goed).slice(0,2), goaf:"soort", focus:"ps:"+groot[0]}); }
    }
    // terugkerende kleine uitgaven bij dezelfde partij
    const partij = new Map(); an.varRows.forEach(r=>{ const k = normKey(String(r[1]||"").split(/\s+/).slice(0,2).join(" ")) || "onbekend"; const e = partij.get(k) || {naam:String(r[1]||"Onbekend").split(/\s+/).slice(0,3).join(" "), n:0, som:0, cat:classify(r).cat}; e.n++; e.som -= r[2]; partij.set(k, e); });
    const vaak = [...partij.values()].filter(e=>e.n>=3 && e.som>=30).sort((a,b)=>b.som-a.som);
    if(vaak.length){ const t = vaak[0];
      voeg({score:80 + pm(t.som)/5, lvl:"info", titel:`${t.n}× ${t.naam}: ${eur0(t.som)} in ${dagen} dagen`,
        waarom:`Gemiddeld ${eur(t.som/t.n)} per keer${vaak.length>1 ? `; ook vaak: ${vaak.slice(1,3).map(x=>`${x.naam} (${x.n}×)`).join(", ")}` : ""}.`,
        doen:`Is dit vast terugkerend? Zet het dan als vaste last, zodat het plan ermee rekent. Anders: hier zit makkelijk te besparen.`, goaf:"soort", focus:"ps:"+t.cat}); }
    // vaste lasten die hoger uitkomen
    an.posten.forEach(e => { if(e.it.freq==="week") return; const per = e.som/Math.max(1,e.n), ing = num(e.it.bedrag); if(per - ing < 1) return;
      const acties = (A("vl.uitgaven") || A("af.vaste")) ? [advActie(`Vaste last op ${eur(per)}`, "vl.uitgaven", () => db.doc("posten/"+e.it.id).update({bedrag: Math.round(per*100)/100}))] : [];
      voeg({score:150 + (per-ing)*2, lvl:"warn", titel:`${e.it.naam} kost ${eur(per)} in plaats van ${eur(ing)}`,
        waarom:`Op het afschrift ${e.n}× afgeschreven. Het plan rekent nog met het oude bedrag: ${eur0(per-ing)} per maand te weinig.`,
        doen:`Is het blijvend? Zet de vaste last op het nieuwe bedrag.`, acties, goaf:"vaste", focus:"vl:"+e.it.id}); });
    if(an.inbox.length){ const som = an.inbox.reduce((s,r)=>s-r[2],0);
      voeg({score:60 + som/20, lvl:"info", titel:`${an.inbox.length} afschrijving${an.inbox.length>1?"en":""} nog niet ingedeeld (${eur0(som)})`,
        waarom:`Zolang die er staan, kloppen de cijfers per soort niet helemaal.`, doen:`Deel ze in; de app onthoudt het voor de volgende keer.`, goaf:"indelen"}); }
    if(an.gemist.length) voeg({score:30, lvl:"info", titel:`${an.gemist.length} vaste last${an.gemist.length>1?"en":""} niet gevonden`,
        waarom:`${an.gemist.slice(0,3).map(g=>g.it.naam).join(", ")}${an.gemist.length>3?" en meer":""} staan niet op dit afschrift.`,
        doen:`Lopen ze nog? Tik op de vaste last om aan te geven of hij nog komt, wegvalt of gestopt is.`, goaf:"vaste", focus:"vl:__gemist"});
  }
  return L.sort((a,b)=>b.score-a.score);
}

function advItemHtml(a){
  const eff = (a.effect||[]).length ? `<div class="eff">${a.effect.map(e=>`<span class="${e.goed?"pos":"neg"}">${e.goed?"↑":"↓"} ${esc(e.t)}</span>`).join("")}</div>` : "";
  const opties = (a.opties||[]).length ? `<ul class="opt">${a.opties.map(o=>`<li>${o}</li>`).join("")}</ul>` : "";
  const knoppen = (a.acties||[]).concat(a.goaf ? [`<button type="button" class="btn sm ghost" data-goaf="${a.goaf}"${a.focus?` data-focus="${esc(a.focus)}"`:""}>Bekijk ›</button>`] : []);

function advLijst(lijst, key, toon){
  if(!lijst.length) return `<div class="empty">Geen adviezen: alles loopt volgens plan.</div>`;
  const shown = hasMore(key) ? lijst : lijst.slice(0, toon);
  return `<div class="advl">${shown.map(advItemHtml).join("")}</div>${moreBtn(key, lijst.length, toon)}`;
}
// Overzicht: de drie adviezen die het meeste opleveren of het dringendst zijn
// De adviezen rekenen het plan vaak opnieuw door. Daarom: onthouden zolang de gegevens hetzelfde zijn, en pas ná het
// opbouwen van het scherm berekenen (het scherm staat er dan meteen; het advies verschijnt een moment later).
const ADVC = {key:null, val:null, bezig:false};
function advKey(){ return [S.posten,S.inkomsten,S.extras,S.doelen,S.config,S.afschriften,S.gepland,S.planbet,S.stand,S.herind,S.notities,S.uitgaven,S.regels,S.verwacht,S.afschriftSel,actief(),T.profielen,TODAY.getTime()]; }
function advGelijk(a, b){ return !!a && !!b && a.length===b.length && a.every((v,i)=>v===b[i]); }
function advBereken(){
  ADV.acties.clear();
  const B = advBasis(), uit = {};
  const alles = adviezen(B, "alles");
  uit.ov = alles.filter(a=>a.score>=50 && !a.td);   // tekort, rekening in gevaar en vrij budget staan al in Te doen
  uit.pl = alles;
  const af = selectedAfschrift();
  if(af){ const an = analyseAfschrift(af), gw = geplandVsWerkelijk(an);
    uit.af = adviezen(B, "afschrift");
    uit.afKop = {an, boven: gw.list.filter(x=>x.diff>10).sort((a,b)=>b.diff-a.diff).slice(0,3)}; }
  // de html vast maken, zodat de knoppen bij deze berekening horen
  uit.html = {ov: advLijst(uit.ov, "adv:ov", 3), pl: advLijst(uit.pl, "adv:pl", 6), af: uit.af ? advLijst(uit.af, "adv:af", 5) : ""};
  return uit;
}
function advKlaar(){
  const k = advKey();
  if(advGelijk(ADVC.key, k)) return ADVC.val;
  if(!ADVC.bezig){ ADVC.bezig = true;
    setTimeout(() => { try{ ADVC.val = advBereken(); ADVC.key = advKey(); } catch(e){ ADVC.val = {fout:String(e && e.message || e)}; ADVC.key = advKey(); } ADVC.bezig = false; render(); }, 30); }
  return null;
}
const advWacht = `<div class="empty">Advies wordt berekend…</div>`;
function advHtml(v, deel){ if(!v) return advWacht; if(v.fout) return `<div class="empty">Advies kon niet worden berekend.</div>`;
  // "Toon alle" is een knop van het scherm zelf: bij een andere stand opnieuw tekenen
  const lijst = v[deel] || []; return deel==="ov" ? advLijst(lijst, "adv:ov", 3) : deel==="pl" ? advLijst(lijst, "adv:pl", 6) : advLijst(lijst, "adv:af", 5); }
// Overzicht: de drie adviezen die het meeste opleveren of het dringendst zijn
function slimsteKaart(){
  const v = advKlaar(), n = v && v.ov ? v.ov.length : 0;
  return `<section class="card c3" data-perm="ov.advies"><div class="h3row"><h2>Slimste stap nu</h2>${n?`<span class="cnt">${n}</span>`:""}</div>
    ${advHtml(v, "ov")}</section>`;
}
// Plan & doelen: alle adviezen
function adviesKaart(){
  const v = advKlaar();
  return `<section class="card c3" data-perm="pl.advies"><div class="h3row"><h2>Advies</h2><span class="sub3">uit jullie cijfers</span></div>
    ${advHtml(v, "pl")}

}
// Afschrift: analyse van het gekozen afschrift
function analyseKaart(){

  return `<section class="card c3" data-perm="af.analyse"><div class="h3row"><h2>Analyse</h2><span class="sub3">dit afschrift</span></div>

// one list per soort: what went out, compared with the plan (vaste lasten, boodschappen) or the previous statement (losse uitgaven)
function soortLijst(sp){
  const dt = detailPerSoort(sp);
  if(!dt.list.length) return `<div class="empty">Geen afschrijvingen op dit afschrift.</div>`;
  // attention first: over plan, then soorten without a plan (losse uitgaven), then the rest; biggest first
  const rank = x => x.diff!=null && x.diff>10 ? 0 : x.diff==null ? 1 : 2;
  const sorted = dt.list.slice().sort((a,b)=> rank(a)-rank(b) || (rank(a)===0 ? b.diff-a.diff : b.som-a.som));
  const shown = hasMore("ps") ? sorted : sorted.slice(0,8);
  return `<div class="detlist">${shown.map(x=>{ const k="ps:"+x.c, cls = x.diff==null? "" : x.diff>10? "bad" : x.diff<-10? "good" : "";
    const dtxt = x.diff==null? "" : Math.abs(x.diff)<=10? "zoals "+x.refT : (x.diff>0?"+":"−")+eur0(Math.abs(x.diff))+" t.o.v. "+x.refT;
    const fl = [x.nHoger? x.nHoger+" hoger":"", x.nOnv? x.nOnv+" niet verwacht":""].filter(Boolean).join(" · ");
    return `<details class="det cat" data-det="${esc(k)}" ${isOpen(k)?"open":""}><summary><div class="grow"><div class="name">${esc(x.c)}</div><div class="meta">${x.rows.length} post${x.rows.length===1?"":"en"}${x.ref!=null?" · "+x.refT+" "+eur0(x.ref):""}${fl?` · <span class="flagtxt">${fl}</span>`:""}</div></div><div style="text-align:right"><div class="amt">${eur0(x.som)}</div>${dtxt?`<div class="dlt ${cls}">${dtxt}</div>`:""}</div></summary>
      ${x.rows.length? `<div class="detrows">${x.rows.slice(0,30).map(r=> r.r ? detRowBtn(r) : `<button type="button" class="drow" data-edit="uitgaven:${esc(r.uid)}"><span>${dkort(parseIso(r.d))} · ${esc(r.naam)} <span class="muted">zelf ingevoerd</span></span><b>${eur(r.b)}</b></button>`).join("")}${x.rows.length>30?`<div class="small muted">en nog ${x.rows.length-30} meer</div>`:""}</div>` : `<div class="small muted detrows">Nog niets afgeschreven in deze soort.</div>`}
    ${verwachtHtml(sp.an, x.c)}</details>`; }).join("")}</div>${moreBtn("ps", dt.list.length, 8)}
    <p class="hint">Vaste lasten en boodschappen vergeleken met het plan, losse uitgaven met ${dt.prev? "het vorige afschrift (omgerekend naar evenveel dagen)" : "het vorige afschrift zodra dat er is"}. Rood is meer, groen is minder. Tik op een afschrijving voor een notitie, om het bedrag van de vaste last te corrigeren of om hem anders in te delen.</p>`;
}

// ignored af- and bijschrijvingen; for own-account transfers each line says what it was paired with
function negeerCard(an){
  const af = an.negeer.filter(r=>r[2]<0), bij = an.negeer.filter(r=>r[2]>0);
  const meta = [af.length ? `${af.length} afschrijving${af.length===1?"":"en"} ${eur0(af.reduce((s,r)=>s-r[2],0))}` : "",
    bij.length ? `${bij.length} bijschrijving${bij.length===1?"":"en"} ${eur0(bij.reduce((s,r)=>s+r[2],0))}` : ""].filter(Boolean).join(" · ")+" · tellen niet mee";
  const st = eigenStatus();
  const rows = an.negeer.slice().sort((x,y)=> x[0]<y[0]?-1 : x[0]>y[0]?1 : Math.abs(y[2])-Math.abs(x[2])).map(r => {
    const e = st.get(rowSig(r)), c = r[2]<0 ? classify(r) : null, noot = esc(c && c.plan ? "uit het plan: "+c.plan.src.naam : eigenNoot(e));
    if(r[2]<0) return rowBtn(r, noot);
    return `<div class="drow" style="cursor:default"><span>${dkort(parseIso(r[0]))} · ${esc(r[1]||"Onbekend")}${noot?` <span class="muted">${noot}</span>`:""}</span><b class="amt in">+${eur(r[2])}</b></div>`;
  }).join("");
  const namen = splitCats(S.config.eigenRekeningen);
  const uitleg = namen.length ? `<p class="hint" style="margin:0 0 6px">Overboekingen van en naar ${esc(namen.join(" en "))} tellen niet mee als ze binnen ${EIGEN_DAGEN} dagen worden teruggestort. Wat na ${EIGEN_DAGEN} dagen niet terug is, telt wel mee. Namen aanpassen kan bij Instellingen.</p>` : "";
  const nPlan = af.filter(r=>{ const c = classify(r); return !!c.plan; }).length;
  const planUitleg = nPlan ? `<p class="hint" style="margin:0 0 6px">${nPlan===1?"Eén afschrijving is een betaling":nPlan+" afschrijvingen zijn betalingen"} uit het plan (terugbetaling of sparen). Die tellen bij het doel, niet als losse uitgave.</p>` : "";
  return accCard("af:__negeer", "Genegeerd", meta, `${uitleg}${planUitleg}<div class="detrows">${rows}</div>`);
}

function renderAfschrift(){
  const list = S.afschriften.slice().sort((a,b)=>a.tot<b.tot?1:-1);
  const sel = list.find(a=>a.id===S.afschriftSel) || list[0];
  if(!sel) return A("af.nieuw") ? `<section class="card"><div class="card-head"><h2>Afschrift uploaden</h2></div>${uploadBox()}</section>
    <div class="empty">Nog geen afschrift. Na het uploaden zie je hier waar het geld heen ging, welke vaste lasten zijn afgeschreven en hoe de boodschappen zich verhouden tot het budget.</div>`
    : `<div class="empty">Nog geen afschrift.</div>`;
  const an = analyseAfschrift(sel);
  const herkend = [...an.posten.values()];
  const gw = geplandVsWerkelijk(an); const d = gw.werkelijk-gw.gepland;
  const groups = inboxGroups(an);
  const inboxSom = an.inbox.reduce((s,r)=>s-r[2],0);
  const segZ = {indelen:Z("af.indelen"), soort:Z("af.soort"), vaste:Z("af.vaste")};
  const segs = Object.keys(segZ).filter(k=>segZ[k]);
  let seg = S.segA==="losse" ? "soort" : (S.segA || (groups.length && segZ.indelen ? "indelen" : "soort"));
  if(!segs.includes(seg)) seg = segs[0] || "";
  const segBtn = (k,l,n) => `<button type="button" data-sega="${k}" aria-pressed="${seg===k}">${l}${n?`<span class="cnt">${n}</span>`:""}</button>`;
  const dagen = daysBetween(an.van, an.tot)+1;
  const cur0 = currentAfschrift();
  const spSel = cur0 && cur0.id===sel.id ? spending(periodN(0)) : {af:sel, an, hand:[]};
  let body = "";
  if(seg==="indelen") body = groups.length ? `<section class="card tight" data-perm="af.indelen"><div class="sec-h"><h2>Nog in te delen</h2><span class="pill warn">${an.inbox.length} · ${eur0(inboxSom)}</span></div>
      <p class="hint">${A("af.indelen")?"":"Je mag hier alleen kijken. "}Tik om te kiezen: bestaande vaste last, nieuwe vaste last, soort losse uitgave of negeren (bijv. overboeking naar jullie spaarrekening). De keuze wordt onthouden.</p>
      <div class="list">${groups.slice(0,40).map((g,i)=>`<button class="item" data-indelen="${i}"><div class="grow"><div class="name">${esc(g.naam)}</div><div class="meta">${g.rows.length>1? g.rows.length+"× · lijkt terugkerend" : dkort(parseIso(g.rows[0][0]))}</div></div><div class="amt">${eur(g.som)}</div></button>`).join("")}</div></section>`
    : `<div class="alert good"><span class="dot"></span><div><b>Alles is ingedeeld</b><span class="small">Elke afschrijving op dit afschrift is gekoppeld aan een vaste last of soort.</span></div></div>`;
  else if(seg==="vaste") body = `<section class="card tight" data-perm="af.vaste"><div class="sec-h"><h2>Vaste lasten op dit afschrift</h2><span class="small muted">${herkend.length} herkend</span></div>
      ${(()=>{ const L = nietAfgeschreven(an, null); return L.length ? `<details class="det" data-det="vl:__gemist" ${isOpen("vl:__gemist")?"open":""}><summary><div class="grow"><div class="name">${L.length} verwacht, nog niet afgeschreven</div><div class="meta">${eur0(L.reduce((s,x)=>s+num(x.it.bedrag),0))} · tik om te zien en te duiden</div></div><span class="chev">${ICO.down}</span></summary>${verwachtHtml(an, null)}</details>` : ""; })()}
      <div class="detlist">${herkend.sort((a,b)=>b.som-a.som).map(e=>{
        const verwacht = occurrences(e.it, an.van, an.tot).length, plan = num(e.it.bedrag);
        const diff = e.som - plan*Math.max(verwacht,1);
        const bedragen = [...new Set(e.rows.map(r=>Math.round(-r[2]*100)/100))].filter(b=>Math.abs(b-plan)>=0.005);
        const k = "vl:"+e.it.id, afwijk = Math.abs(diff)>=0.005;
        return `<details class="det" data-det="${esc(k)}" ${isOpen(k)?"open":""}><summary><div class="grow"><div class="name">${esc(e.it.naam)}</div><div class="meta">vaste last ${eur(plan)} · ${e.n}× afgeschreven${verwacht!==e.n?`, ${verwacht}× verwacht`:""}</div></div><div style="text-align:right"><div class="amt">${eur(e.som)}</div><div class="dlt ${afwijk?(diff>0?"bad":"good"):""}">${afwijk? (diff>0?"+":"−")+eur(Math.abs(diff)) : "klopt"}</div></div></summary>
          <div class="detrows">${e.rows.map(r=>rowBtn(r,"")).join("")}
            ${e.n>verwacht && e.it.freq!=="week" ? `<div class="small" style="color:var(--warn)">Meer betalingen dan verwacht. Hoort er één bij iets anders? Tik erop om hem anders in te delen.</div>`:""}
            ${e.it.freq!=="week" && bedragen.length && A("af.vaste") ? `<div class="btnrow">${bedragen.map(b=>`<button class="btn sm" data-setamt="${esc(e.it.id)}:${b}">Vaste last op ${eur(b)} zetten</button>`).join("")}</div>`:""}</div></details>`;}).join("") || `<div class="empty">Geen vaste lasten herkend. Voeg zoekwoorden toe aan jullie vaste lasten.</div>`}</div></section>`;
  else if(seg==="soort") body = `<section class="card tight" data-perm="af.soort"><div class="sec-h"><h2>Per soort</h2><span class="small muted">meeste aandacht bovenaan</span></div>
      ${soortLijst(spSel)}</section>`;
  // Genegeerd hoort bij Per soort; staat Per soort uit, dan onder het onderdeel dat wel zichtbaar is
  if(an.negeer.length && Z("af.genegeerd") && (seg==="soort" || !segZ.soort)) body += `<div data-perm="af.genegeerd">${negeerCard(an)}</div>`;
  return `
  <section class="card tight upbar"><select id="afSel" aria-label="Kies afschrift">${list.map(a=>`<option value="${esc(a.id)}" ${a.id===sel.id?"selected":""}>${dkort(parseIso(a.van))} – ${dkort(parseIso(a.tot))} ${parseIso(a.tot).getFullYear()}</option>`).join("")}</select>${A("af.nieuw")?`<button type="button" class="btn primary sm" id="upOpen">+ Nieuw</button>`:""}</section>
  ${laatsteImportKaart()}
  ${Z("af.blok") ? `<section class="sum" aria-label="Afschrift">
    <div class="lbl"><span>Afgeschreven</span><span>${dagen} dagen · ${(sel.rows||[]).length} regels</span></div>
    <div class="big">${eur0(an.uitTot)}</div>
    <div class="eq">Bijgeschreven <b>${eur0(an.inTot)}</b> · <b>${d>0?"+":"−"}${eur0(Math.abs(d))}</b> ${d>0?"meer":"minder"} dan gepland</div>
  </section>` : ""}
  ${segs.length>1 ? `<div class="segbar" id="segA"><div class="seg big" role="group" aria-label="Onderdeel">${segZ.indelen?segBtn("indelen","In te delen",an.inbox.length):""}${segZ.soort?segBtn("soort","Per soort"):""}${segZ.vaste?segBtn("vaste","Vaste lasten",herkend.length):""}</div></div>` : ""}
  ${body}
  ${Z("af.analyse") ? analyseKaart() : ""}
  ${A("af.verwijderen") ? `<div class="btnrow"><button class="btn danger sm" data-delaf="${esc(sel.id)}">Dit afschrift verwijderen</button></div>` : ""}`;
}

  const sal0 = sdn ? sdn.saldo : null, cc0 = ccOpen ? sdn.cc : 0, ccD0 = ccOpen && sdn.ccD && sdn.ccD>TODAY ? iso(sdn.ccD) : "";
  openSheet(`<div class="sheet-h"><h2>Wat staat er op de rekening?</h2><button type="button" class="iconbtn" data-close aria-label="Sluiten">✕</button></div>
    <p class="hint">${sdn ? `Dit is het saldo dat op ${dkort(sdn.D)} is ingevuld, doorgerekend tot vandaag. Klopt het niet met de ING-app, vul dan in wat je daar ziet. Laat je het staan, dan blijft het zoals het is.` : "Kijk in de ING-app en vul in wat je ziet. Dit hoeft maar één keer: daarna rekent de tool het elke dag zelf door, met het afschrift en wat er verwacht wordt."} Ik reken het door tot loondag (${dkort(loondag)}).</p>
    <div class="field"><label for="sdSaldo">Saldo ING-rekening (€)</label><input id="sdSaldo" class="bigin" inputmode="decimal" placeholder="0,00" autocomplete="off" value="${sal0==null ? "" : esc(fmt(sal0))}"></div>
    <label class="sd-chk"><input type="checkbox" id="sdRood" ${sal0!=null && sal0<0 ? "checked" : ""}> De rekening staat rood (negatief saldo)</label>
    <div class="field"><label for="sdCC">Creditcard: nog van de rekening af te schrijven (€)</label><input id="sdCC" inputmode="decimal" placeholder="0" autocomplete="off" value="${cc0>0 ? esc(fmt(cc0)) : ""}"><span class="hint">Het bedrag dat nog van ING gaat. Blijft staan tot het is afgeschreven. Is het al afgeschreven, dan zit het al in je saldo: maak dit dan leeg.</span></div>
    <div class="field" id="sdDatumF"><label for="sdCCD">Wanneer wordt de creditcard afgeschreven? (optioneel)</label><input id="sdCCD" type="date" value="${esc(ccD0)}"><span class="hint">Leeg = het moet nu al van het saldo af. Met een datum telt het pas op die dag mee.</span></div>
    <div class="sd-live" id="sdLive" aria-live="polite"></div>
    <button type="button" class="btn primary wide" id="sdSave">Bewaar en reken door</button>`, d => {
      const iS=$("#sdSaldo"), iR=$("#sdRood"), iC=$("#sdCC"), iD=$("#sdCCD"), fD=$("#sdDatumF"), lv=$("#sdLive");
      const lees = () => { const sRaw = iS.value.trim(), cRaw = iC.value.trim(); const s = parseBedrag(sRaw); return {sRaw, s: isNaN(s) ? NaN : (iR.checked ? -s : s), c: cRaw==="" ? 0 : parseBedrag(cRaw)}; };
      const upd = () => {
        const {s, c} = lees(); fD.hidden = !(c>0);
        if(isNaN(s)){ lv.textContent = "Vul het saldo in om te zien wat er echt beschikbaar is."; return; }
        if(isNaN(c)){ lv.textContent = "Het creditcardbedrag klopt niet."; return; }
        const dd = parseIso(iD.value), nu = c>0 && (!dd || dd<=TODAY);
        lv.innerHTML = nu ? `Echt beschikbaar nu: <b>${eur(s-c)}</b> (saldo ${eur(s)} − creditcard ${eur(c)})` : c>0 ? `Echt beschikbaar nu: <b>${eur(s)}</b>. De creditcard (${eur(c)}) gaat af op ${dkort(dd)}.` : `Echt beschikbaar nu: <b>${eur(s)}</b>`;
      };
      iS.oninput = iC.oninput = iD.onchange = iR.onchange = upd; upd();
      $("#sdSave").onclick = async () => {
        const {sRaw, s, c} = lees();
        if(sRaw==="" || isNaN(s)) return toast("Vul het saldo in (bijv. 1234,56).");
        if(isNaN(c)) return toast("Het creditcardbedrag klopt niet.");
        const dd = parseIso(iD.value);
        if(c>0 && iD.value && !dd) return toast("De datum van de creditcard klopt niet.");
        if(c>0 && dd && dd<TODAY) return toast("Die datum is al geweest. Is de creditcard al afgeschreven, dan zit het in je saldo: laat het bedrag leeg.");
        if(!db) return toast("Opslaan kan niet: geen verbinding met de opslag.");
        const data = {saldo: Math.round(s*100)/100, creditcard: c>0 ? Math.round(c*100)/100 : 0, ccDatum: (c>0 && dd) ? iso(dd) : "", datum: iso(TODAY), tijd: new Date().toISOString(), door: PROFIELEN[WHO.profiel] || ""};
        try{ await db.doc("saldo/stand").set(data); S.stand = data; toast("Bewaard"); d.close(); render(); }
        catch(e){ toast(e.code==="not_granted" ? "Je hebt alleen leesrechten op deze tool." : "Bewaren lukte niet: "+(e.message||e.code)); }
      };
      setTimeout(()=>{ try{ iS.focus(); }catch(e){} }, 50);
    });
}

// ---------- advice ----------


function mdLite(t){
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split(/\n/);
  let html="", inList=false;
  for(const l of lines){
    const m = /^\s*[-•*]\s+(.*)/.exec(l);
    if(m){ if(!inList){html+="<ul>";inList=true;} html+="<li>"+m[1]+"</li>"; }
    else { if(inList){html+="</ul>";inList=false;} if(l.trim()) html+="<p>"+l.replace(/^#+\s*/,"")+"</p>"; }
  }
  if(inList) html+="</ul>"; return html;
}
// ---------- verwacht maar (nog) niet afgeschreven: tonen en duiden ----------
// Per vaste last en vervaldag kan worden vastgelegd wat er aan de hand is (collectie `verwacht`, id = <postId>_<JJJJ-MM-DD>):
// komt  = wordt later nog afgeschreven (blijft verwacht);
// vervalt = valt deze keer weg (meevaller): telt in alle berekeningen niet mee voor die dag;
// anders = is anders betaald (contant, andere rekening): telt wel mee, maar wordt niet als "niet gevonden" gemeld;
// gestopt = de vaste last is gestopt: einddatum wordt de dag ervoor.
var VERV = new Set();
S.verwacht = new Map();
const VERW_LABEL = {komt:"komt nog", vervalt:"valt weg", anders:"anders betaald", gestopt:"gestopt"};
function verwId(id, d){ return id+"_"+iso(d); }
function verwOf(id, d){ return S.verwacht.get(verwId(id, d)) || null; }
function occRaw(it, s, e){ const keep = [...VERV]; VERV.clear(); try{ return occurrences(it, s, e); } finally { keep.forEach(k=>VERV.add(k)); } }
// vaste lasten die in het afschrift verwacht werden maar (nog) niet zijn afgeschreven; cat = alleen deze categorie
function nietAfgeschreven(an, cat){
  if(!an || !an.van || !an.tot) return [];
  const uit = [];
  S.posten.forEach(it => {
    if(it.categorie==="Boodschappen") return;
    if(cat && (it.categorie||"Overig")!==cat) return;
    const occ = occRaw(it, an.van, an.tot).sort((a,b)=>a-b);
    const kregen = (an.posten.get(it.id)||{n:0}).n;
    occ.slice(Math.min(kregen, occ.length)).forEach(d => uit.push({it, d, v: verwOf(it.id, d), zw: !keywordsOf(it).length}));
  });
  return uit.sort((a,b)=>a.d-b.d);
}
function verwachtHtml(an, cat){
  const L = nietAfgeschreven(an, cat); if(!L.length) return "";
  return `<div class="detrows ghostlist"><div class="small muted" style="font-weight:600">Verwacht, nog niet afgeschreven</div>${L.map(x=>{
    const st = x.v ? VERW_LABEL[x.v.status]||x.v.status : x.zw ? "geen zoekwoord" : "nog niet afgeschreven";
    return `<button type="button" class="drow ghost${x.v&&x.v.status==="vervalt"?" weg":""}" data-verw="${esc(x.it.id)}|${iso(x.d)}"><span>${dkort(x.d)} · ${esc(x.it.naam)} <span class="tag ghosttag">${esc(st)}</span>${x.v&&x.v.notitie?`<span class="note">✎ ${esc(x.v.notitie)}</span>`:""}</span><b>${eur(num(x.it.bedrag))}</b></button>`; }).join("")}
    <p class="hint" style="margin:2px 0 0">Tik om aan te geven wat er aan de hand is: komt nog, valt deze keer weg, anders betaald of gestopt.</p></div>`;
}
function openNietAfgeschreven(id, isoD){
  const it = S.posten.find(p=>p.id===id), d = parseIso(isoD); if(!it || !d) return;
  const v = verwOf(id, d) || {}, mag = A("af.soort") || A("af.vaste");
  const opt = (k, t, s) => `<label class="chk"><input type="radio" name="vw" value="${k}" ${v.status===k?"checked":""} ${mag?"":"disabled"}><span><b style="display:inline">${t}</b><br><span class="small muted">${s}</span></span></label>`;
  openSheet(`<div class="sheet-h"><h2>${esc(it.naam)}</h2><button type="button" class="iconbtn" data-close aria-label="Sluiten">✕</button></div>
    <p class="small muted" style="margin:0">Verwacht op ${dlang(d)} · ${eur(num(it.bedrag))}${keywordsOf(it).length ? "" : " · deze vaste last heeft geen zoekwoord, dus de app kan hem niet op het afschrift herkennen"}</p>
    <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:10px"><legend class="small muted" style="font-weight:600;margin-bottom:6px">Wat is er aan de hand?</legend>
      ${opt("komt","Komt nog","Wordt later afgeschreven. Blijft meetellen.")}
      ${opt("vervalt","Valt deze keer weg","Een meevaller: telt deze maand nergens meer mee.")}
      ${opt("anders","Anders betaald","Contant of van een andere rekening. Telt mee, maar wordt niet meer als ontbrekend gemeld.")}
      ${opt("gestopt","Gestopt",`De vaste last stopt: einddatum wordt ${dlang(addDays(d,-1))}.`)}
    </fieldset>
    <div class="field"><label for="vw-note">Toelichting</label><textarea id="vw-note" rows="2" maxlength="300" ${mag?"":"disabled"} placeholder="Bijv. incasso schuift naar volgende week">${esc(v.notitie||"")}</textarea></div>

// ---------- de app leert van jullie indeling ----------
// Elke keer dat jullie één afschrijving zelf als losse uitgave indelen ("Anders indelen" → alleen deze afschrijving),
// onthoudt de app partij + bedrag + soort (+ de notitie als reden). Een nieuwe afschrijving bij dezelfde partij met een
// bedrag binnen 30% van zo'n voorbeeld krijgt dezelfde soort. Bij meerdere voorbeelden wint de soort met de dichtstbijzijnde
// bedragen. Dit gaat vóór de automatische herkenning op winkelnaam, maar ná zoekwoorden van vaste lasten en eigen regels.
function partijKey(naam){ return normKey(naam).split(" ").filter(w=>w.length>1).slice(0,2).join(" "); }
let LEER = {src:null, nsrc:null, m:new Map()};
function leerModel(){
  if(LEER.src===S.herind && LEER.nsrc===S.notities) return LEER.m;
  const m = new Map();
  for(const h of (S.herind ? S.herind.values() : [])){
    if(h.soort!=="var" || !h.categorie || !(num(h.bedrag)>0)) continue;
    const k = partijKey(h.naam); if(!k) continue;
    const note = ((S.notities.get(h.sig||h.id)||{}).tekst||"").trim();
    if(!m.has(k)) m.set(k, []);
    m.get(k).push({b:num(h.bedrag), cat:h.categorie, label:note, naam:String(h.naam||"").split(/\s+/).slice(0,3).join(" "), datum:h.datum||""});
  }
  LEER = {src:S.herind, nsrc:S.notities, m};
  return m;
}
function leerVoorspel(row){
  const ex = leerModel().get(partijKey(row[1])); if(!ex || !ex.length) return null;
  const b = -row[2]; if(!(b>0)) return null;
  const dicht = ex.map(e=>({e, d:Math.abs(Math.log(b/e.b))})).filter(x=>x.d<=Math.log(1.3));
  if(!dicht.length) return null;
  const stem = new Map(); dicht.forEach(x=>stem.set(x.e.cat, (stem.get(x.e.cat)||0) + 1/(1+x.d*10)));
  const cat = [...stem.entries()].sort((a,b)=>b[1]-a[1])[0][0];
  const zelfde = dicht.filter(x=>x.e.cat===cat).sort((a,b)=>a.d-b.d);
  const label = (zelfde.find(x=>x.e.label)||{e:{}}).e.label || "";
  return {cat, label, n:zelfde.length, partij:zelfde[0].e.naam};
}

function decodeBytes(bytes){
  let t = new TextDecoder("utf-8").decode(bytes);
  if(t.includes("\uFFFD")){ try{ t = new TextDecoder("windows-1252").decode(bytes); }catch(e){} }
  return t.replace(/^﻿/,"");
}
function readFileText(file){
  if(file.arrayBuffer) return file.arrayBuffer().then(b=>decodeBytes(new Uint8Array(b)));
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(decodeBytes(new Uint8Array(r.result))); r.onerror=()=>rej(new Error("Het bestand kon niet gelezen worden.")); r.readAsArrayBuffer(file); });
}
// ---------- afschriften samenvoegen: dubbele regels herkennen ----------
// ING-exports hebben geen uniek boekingsnummer. Een regel is dezelfde boeking als een bestaande regel als datum, bedrag, af/bij en
// naam + omschrijving gelijk zijn (rowSig). Twee echt identieke boekingen op één dag (2× parkeren van €2,50) blijven twee boekingen:
// per sleutel telt het hoogste aantal in één bestand, nooit de som over bestanden. Een nieuw bestand voegt dus alleen toe wat boven het
// al bekende aantal uitkomt. Afschriften worden per loonperiode bewaard (id = start_einde van de periode), zodat een bestand met alleen
// de nieuwste regels, of een bestand over meerdere periodes, altijd in het goede afschrift terechtkomt.
function periodStartL(d, L){ const y=d.getFullYear(), m=d.getMonth(); return d.getDate() >= L ? new Date(y,m,L) : new Date(y,m-1,L); }
function periodEndL(s){ return addDays(new Date(s.getFullYear(), s.getMonth()+1, s.getDate()), -1); }
function rijenSleutel(rows){ return (rows||[]).map(rowSig).sort().join("|"); }
function groepeer(rows){ const m=new Map(); rows.forEach(r=>{ const k=rowSig(r); const l=m.get(k); if(l) l.push(r); else m.set(k,[r]); }); return m; }
function samenvoegAfschriften(bestaand, nieuw, L){
  // wat er al is: per sleutel het hoogste aantal in één afschrift (oude afschriften kunnen elkaar overlappen)
  const pool = new Map();
  bestaand.forEach(a => groepeer(a.rows||[]).forEach((rs,k) => { const e=pool.get(k); if(!e || rs.length>e.length) pool.set(k, rs.slice()); }));
  // nieuw bestand: per sleutel alleen wat boven het bekende aantal uitkomt
  const toegevoegd = []; let bekend = 0;
  groepeer(nieuw).forEach((rs,k) => {
    const e = pool.get(k) || [], extra = rs.slice(e.length);
    bekend += rs.length - extra.length;
    if(extra.length){ pool.set(k, e.concat(extra)); toegevoegd.push(...extra); }
  });
  // alles opnieuw in loonperiodes
  const alle = []; pool.forEach(rs => rs.forEach(r => alle.push(r)));
  alle.sort((a,b)=> a[0]<b[0]?-1:a[0]>b[0]?1:0);
  const groepen = new Map(); let ongeldig = 0;
  alle.forEach(r => {
    const d = parseIso(r[0]); if(!d){ ongeldig++; return; }
    const s = periodStartL(d, L), id = iso(s).replace(/-/g,"")+"_"+iso(periodEndL(s)).replace(/-/g,"");
    const g = groepen.get(id) || groepen.set(id, {id, rows:[]}).get(id);
    g.rows.push(r);
  });
  const buckets = [...groepen.values()].map(g => Object.assign(g, {van:g.rows[0][0], tot:g.rows[g.rows.length-1][0]}));
  toegevoegd.sort((a,b)=> a[0]<b[0]?-1:a[0]>b[0]?1:0);
  return {buckets, toegevoegd, bekend, totaal:alle.length, ongeldig};
}
function afschriftenKlaar(){
  return !!(S.loaded.afschriften && S.loaded.afschriftdelen) && S.afMeta.every(m => { const a=S.afschriften.find(x=>x.id===m.id); return a && (m.n==null || (a.rows||[]).length===m.n); });
}
let IMPORT_BUSY = false;
const wacht = ms => new Promise(r=>setTimeout(r,ms));
async function saveStatement(text, naam){
  if(!db) throw new Error("Opslaan kan niet: geen verbinding met de opslag.");
  if(IMPORT_BUSY) throw new Error("Er loopt al een import. Wacht even tot die klaar is.");
  IMPORT_BUSY = true;
  try{
    const rows = parseBankCsv(text);
    // eerst zeker weten dat alle bestaande afschriften volledig geladen zijn: anders zou er iets kunnen verdwijnen of dubbel komen
    for(let i=0;i<25 && !afschriftenKlaar();i++) await wacht(200);
    if(!afschriftenKlaar()) throw new Error("De opgeslagen afschriften zijn nog niet helemaal geladen. Probeer het over een paar seconden opnieuw.");
    const L = Math.max(1, Math.min(28, Math.round(num(S.config.loondag)||25)));
    const bestaand = S.afschriften.slice();
    const res = samenvoegAfschriften(bestaand, rows, L);
    if(res.ongeldig || res.buckets.reduce((s,b)=>s+b.rows.length,0)!==res.totaal) throw new Error("Er zitten regels zonder geldige datum in de opgeslagen afschriften. Er is niets gewijzigd.");
    const CH = 300, nu = new Date().toISOString(), bestand = String(naam||"afschrift.csv").slice(0,80);
    const oudById = new Map(bestaand.map(a=>[a.id,a])), nieuwIds = new Set(res.buckets.map(b=>b.id));
    // 1. eerst schrijven wat nieuw of veranderd is (een afschrift dat al klopt blijft ongemoeid) ...
    for(const b of res.buckets){
      const oud = oudById.get(b.id);
      if(oud && rijenSleutel(oud.rows)===rijenSleutel(b.rows)) continue;
      const delen = Math.ceil(b.rows.length/CH);
      for(let i=0;i<delen;i++) await db.doc("afschriftdelen/"+b.id+"_"+i).set({afId:b.id, i, rows:b.rows.slice(i*CH,(i+1)*CH)});
      if(oud && (oud.delen||0)>delen) for(let i=delen;i<oud.delen;i++){ try{ await db.doc("afschriftdelen/"+b.id+"_"+i).delete(); }catch(e){} }
      await db.doc("afschriften/"+b.id).set({id:b.id, van:b.van, tot:b.tot, bestand, n:b.rows.length, delen, geupload:nu});
    }
    // 2. ... en pas daarna oude afschriften opruimen die nu in een periode zijn opgegaan (hun regels staan al in het nieuwe afschrift)
    for(const a of bestaand){
      if(nieuwIds.has(a.id)) continue;
      for(let i=0;i<(a.delen||0);i++){ try{ await db.doc("afschriftdelen/"+a.id+"_"+i).delete(); }catch(e){} }
      try{ await db.doc("afschriften/"+a.id).delete(); }catch(e){}
    }
    // de opslag even laten bijwerken, zodat een volgende import niet met oude gegevens rekent
    const klaar = () => res.buckets.every(b => { const a=S.afschriften.find(x=>x.id===b.id); return a && (a.rows||[]).length===b.rows.length; }) && bestaand.every(a => nieuwIds.has(a.id) || !S.afschriften.some(x=>x.id===a.id));
    for(let i=0;i<25 && !klaar();i++) await wacht(200);
    // het nieuwste afschrift dat door dit bestand is geraakt, wordt getoond
    const sleutelRij = (res.toegevoegd.length ? res.toegevoegd : rows).reduce((m,r)=>r[0]>m?r[0]:m, "");
    const doel = res.buckets.find(b => b.rows.some(r=>r[0]===sleutelRij)) || res.buckets[res.buckets.length-1];
    S.afschriftSel = doel ? doel.id : null; S.advies.afschrift = null;
    S.laatsteImport = {bestand, nieuw:res.toegevoegd, bekend:res.bekend, totaal:rows.length};
    const n = res.toegevoegd.length;
    toast(n ? n+" nieuwe regel"+(n===1?"":"s")+" toegevoegd"+(res.bekend?", "+res.bekend+" al bekend (overgeslagen)":"") : "Niets nieuws: alle "+rows.length+" regels stonden er al in");
    render();
  } finally { IMPORT_BUSY = false; }
}

// Google Drive route: the phone app cannot open a file picker inside the page, Drive can
function payloadOf(res){
  if(res && res.payload!==undefined) return res.payload;
  const t = res && res.content && res.content.find(c=>c.type==="text");
  try{ return t ? JSON.parse(t.text) : null; }catch(e){ return null; }
}
function driveError(e){
  const c = e && e.code;
  if(c==="popup_blocked") return "Je browser blokkeerde het venster van Google. Sta pop-ups toe voor deze site en tik opnieuw op Recent, Mijn Drive of Gedeeld.";
  if(c==="popup_closed") return "Het venster van Google is gesloten voordat je toestemming gaf. Tik op Recent, Mijn Drive of Gedeeld om het opnieuw te proberen.";
  if(c==="user_mismatch") return "Kies in het venster van Google hetzelfde account waarmee je in de tool bent ingelogd.";
  if(c==="consent_required" || c==="needs_reauth") return "De tool mag (nog) niet in je Google Drive kijken. Tik op Recent, Mijn Drive of Gedeeld en geef in het venster van Google toegang tot Drive.";
  if(c==="api_disabled") return "Google Drive staat nog niet aan voor deze app. Barry moet de Google Drive API aanzetten in het Firebase-project (zie WERKING.md).";
  if(c==="rate_limited") return "Even te veel verzoeken. Probeer het over een minuut opnieuw.";
  return "Google Drive gaf geen antwoord ("+(c||"onbekende fout")+"). Probeer het zo nog eens.";
}
const DRV = {view:"recent", q:"", path:[{id:"root", naam:"Mijn Drive"}], files:[], token:null, busy:false, msg:null, req:0};

    const q = DRV.q.trim().replace(/\\/g,"").replace(/'/g,"\\'");

    else if(DRV.view==="recent") res = await mcp.callTool("Google Drive","list_recent_files", Object.assign({orderBy:"recency"}, base));
    else if(DRV.view==="gedeeld") res = await mcp.callTool("Google Drive","search_files", Object.assign({query:"sharedWithMe = true"}, base));
    else res = await mcp.callTool("Google Drive","search_files", Object.assign({query:`parentId = '${DRV.path[DRV.path.length-1].id}'`}, base));
    if(my!==DRV.req) return;

}

// ---------- "Kan dit?" ----------
// Voorstellen voor "Kan dit?": test een geplande uitgave (van plan-geld) in het plan en kijk of alle doelen hun datum houden.
function voorstellenKanDit(bedrag, naam, cat, plan){
  const base = plan || bereken();
  const status0 = new Map(base.items.map(it=>[it.id, it]));
  const test = (n, k) => {
    const tmp = {id:"__test", naam, bedrag, categorie:cat, bron:"plan", delen:k, datum:iso(periodN(n).start)};
    const pl = buildPlan(Object.assign({}, base.opts||{}, {extraGepland:[tmp]}));
    const x = pl.gepl.find(g=>g.g.id==="__test");
    if(!x || x.tekort>0.5) return null;
    // an earlier planned expense must not lose its reservation because of this one
    const tekortVoor = new Map((base.gepl||[]).map(g=>[g.g.id, g.tekort]));
    if(pl.gepl.some(g=>g.g.id!=="__test" && g.tekort > (tekortVoor.get(g.g.id)||0)+0.5)) return null;
    const slechter = pl.items.filter(it=>{ const b=status0.get(it.id); return b && b.status==="ok" && it.status!=="ok"; });
    if(slechter.length) return null;
    const later = pl.items.filter(it=>{ const b=status0.get(it.id); return b && b.klaarDatum && it.klaarDatum && it.klaarDatum>b.klaarDatum; })
      .map(it=>it.naam+" rond in "+MAANDEN_L[it.klaarDatum.getMonth()]+" "+it.klaarDatum.getFullYear()+" (was "+MAANDEN_L[status0.get(it.id).klaarDatum.getMonth()]+")");
    return {n, k, later, tmp};
  };
  const dj = d => dkort(d)+(d.getFullYear()!==TODAY.getFullYear() ? " "+d.getFullYear() : "");
  const per = n => { const p=periodN(n); return dkort(p.start)+" – "+dj(p.end); };
  // deze en volgende periode beoordeelt de geldlijn (hierboven); voorstellen beginnen bij de periode daarna
  let a = null; for(let n=2;n<=13 && !a;n++) a = test(n,1);
  let b = null; for(let n=3;n<=13 && !b;n++){ if(a && n>=a.n) break; b = test(n, n-1); }   // opzij vanaf periode 2 t/m de aankoop
  const out = [];
  const gevolg = r => r.later.length ? " Wel later klaar: "+r.later.slice(0,2).join("; ")+"." : " De doelen schuiven niet op.";
  if(a) out.push({titel:"Vroegste periode: "+per(a.n), uitleg:`Het hele bedrag in die loonperiode, uit het geld voor plan & doelen. Alle doelen halen hun datum nog.`+gevolg(a), knop:"Plan in voor "+dj(periodN(a.n).start), tmp:a.tmp});
  if(!a){ const max = Math.max(0, ...base.months.slice(2,14).map(m=>m.sparenGeld));
    out.uitleg = `In één loonperiode past ${eur0(bedrag)} niet uit het plan-geld: daar komt de komende maanden hooguit ${eur0(max)} per periode voor vrij.`; }
  if(b) out.push({titel:`Ervoor sparen: ${b.k}× ${eur(bedrag/b.k)}`, uitleg:`Vanaf ${dj(periodN(2).start)} ${b.k} loonperiodes elk ${eur(bedrag/b.k)} opzij; uitgeven vanaf ${dj(periodN(b.n).start)}. Alle doelen halen hun datum nog.`+gevolg(b), knop:`Spaar ${b.k} maanden en plan in`, tmp:b.tmp});
  return out;
}

        const eigen = splitCats(S.config[key]).concat(naam);

        catch(err){ return toast(err.code==="not_granted"?"Je hebt alleen leesrechten.":"Categorie toevoegen lukte niet."); }

        sel.insertBefore(o, sel.querySelector('option[value="__new__"]'));
        bestaand = naam; toast("Categorie toegevoegd");
      }
      sel.value = bestaand; sel.dataset.prev = bestaand; row.hidden = true; inp.value = "";
    };

async function sha256(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(t||"").trim().toLowerCase())); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
// Firestore kent geen lijsten in lijsten (de regels van een afschrift zijn dat wel): die gaan als tekst de opslag in.
const ENC = "__json__:";
function encVal(v){
  if(v===undefined) return undefined;
  if(Array.isArray(v)) return v.some(x=>Array.isArray(x)) ? ENC+JSON.stringify(v) : v.map(encVal);
  if(v && typeof v==="object" && !(v instanceof Date)){ const o={}; for(const k of Object.keys(v)){ const x=encVal(v[k]); if(x!==undefined) o[k]=x; } return o; }
  return v;
}
function decVal(v){
  if(typeof v==="string" && v.startsWith(ENC)){ try{ return JSON.parse(v.slice(ENC.length)); }catch(e){ return []; } }
  if(Array.isArray(v)) return v.map(decVal);
  if(v && typeof v==="object" && typeof v.toDate!=="function"){ const o={}; for(const k of Object.keys(v)) o[k]=decVal(v[k]); return o; }
  return v;
}
function fsErr(e){
  const map = {"permission-denied":"not_granted", "unauthenticated":"not_granted", "resource-exhausted":"rate_limited"};
  const err = new Error((e && e.message) || String(e)); err.code = map[e && e.code] || (e && e.code) || "onbekend"; return err;
}
const wrapDoc = d => ({id:d.id, exists:d.exists, metadata:d.metadata, data:()=>decVal(d.data()||{})});
function maakDb(){
  return {
    doc(path){ const r = fs.doc(path); return {
      set: data => r.set(encVal(data)).catch(e=>{ throw fsErr(e); }),
      update: data => r.update(encVal(data)).catch(e=>{ throw fsErr(e); }),
      delete: () => r.delete().catch(e=>{ throw fsErr(e); }),
      get: () => r.get().then(wrapDoc).catch(e=>{ throw fsErr(e); }),
      onSnapshot: (next, err) => r.onSnapshot(s=>next(wrapDoc(s)), e=>{ if(err) err(fsErr(e)); })
    }; },
    collection(name){ const c = fs.collection(name); return {
      onSnapshot: (next, err) => c.onSnapshot(s=>next({docs:s.docs.map(wrapDoc), metadata:s.metadata}), e=>{ if(err) err(fsErr(e)); })
    }; }
  };
}

// Toegang (alleen lezen) wordt pas gevraagd als je op "Kies uit Google Drive" tikt, en geldt ongeveer een uur.
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.readonly";
const DRV_TOK = {t:null, tot:0};
function driveToken(){
  if(DRV_TOK.t && Date.now() < DRV_TOK.tot) return Promise.resolve(DRV_TOK.t);
  const u = fbAuth && fbAuth.currentUser; if(!u) return Promise.reject({code:"needs_reauth"});
  const prov = new firebase.auth.GoogleAuthProvider(); prov.addScope(DRIVE_SCOPE); prov.setCustomParameters({login_hint:u.email||""});
  return u.reauthenticateWithPopup(prov).then(res => {
    const t = res && res.credential && res.credential.accessToken; if(!t) throw {code:"consent_required"};
    DRV_TOK.t = t; DRV_TOK.tot = Date.now() + 50*60*1000; return t;
  }, e => {
    const c = e && e.code;
    if(c==="auth/popup-blocked") throw {code:"popup_blocked"};
    if(c==="auth/popup-closed-by-user" || c==="auth/cancelled-popup-request") throw {code:"popup_closed"};
    if(c==="auth/user-mismatch") throw {code:"user_mismatch"};
    throw {code:"consent_required", detail:e && e.message};
  });
}
async function gdrive(pad, params, ruw){
  const t = await driveToken();
  const u = new URL("https://www.googleapis.com/drive/v3/"+pad);
  Object.entries(params||{}).forEach(([k,v]) => { if(v!=null && v!=="") u.searchParams.set(k, v); });
  const r = await fetch(u, {headers:{Authorization:"Bearer "+t}});
  if(r.status===401){ DRV_TOK.t = null; throw {code:"needs_reauth"}; }
  if(!r.ok){
    const txt = await r.text().catch(()=> "");
    if(/accessNotConfigured|SERVICE_DISABLED|has not been used/i.test(txt)) throw {code:"api_disabled"};
    if(/insufficient/i.test(txt)){ DRV_TOK.t = null; throw {code:"consent_required"}; }
    if(r.status===429 || /rateLimit/i.test(txt)) throw {code:"rate_limited"};
    throw {code:"http_"+r.status};
  }
  return ruw ? r.arrayBuffer() : r.json();
}
function naarBase64(buf){ const b = new Uint8Array(buf); let s = ""; for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(s); }
function maakMcp(){
  const VELDEN = "nextPageToken,files(id,name,mimeType,modifiedTime,size,fileExtension)";
  const lijst = j => ({payload:{files:(j.files||[]).map(f=>({id:f.id, title:f.name, mimeType:f.mimeType, modifiedTime:f.modifiedTime, fileSize:f.size?+f.size:undefined, fileExtension:f.fileExtension})), nextPageToken:j.nextPageToken||null}});
  return {
    async callTool(server, tool, a){
      a = a || {};
      if(tool==="download_file_content"){
        const buf = a.exportMimeType ? await gdrive("files/"+encodeURIComponent(a.fileId)+"/export", {mimeType:a.exportMimeType}, true)
                                     : await gdrive("files/"+encodeURIComponent(a.fileId), {alt:"media"}, true);
        return {payload:{content:naarBase64(buf)}};
      }
      const p = {pageSize:a.pageSize||40, pageToken:a.pageToken, fields:VELDEN};
      if(tool==="list_recent_files"){ p.q = "trashed = false and mimeType != 'application/vnd.google-apps.folder'"; p.orderBy = "recency desc"; }
      else {
        const q = String(a.query||""); let m;
        if((m = /^title contains '(.*)'$/.exec(q))) p.q = "name contains '"+m[1]+"' and trashed = false";
        else if(/^sharedWithMe = true$/.test(q)){ p.q = "sharedWithMe and trashed = false"; p.orderBy = "recency desc"; }
        else if((m = /^parentId = '(.*)'$/.exec(q))) p.q = "'"+m[1]+"' in parents and trashed = false";
        else p.q = "trashed = false";
      }
      return lijst(await gdrive("files", p));
    }
  };
}
