/* alerts as one-line rows that open */
.al{border-top:1px solid var(--line)}
.alist>.al:first-child{border-top:0}
.al summary{display:flex;align-items:center;gap:10px;min-height:46px;padding:4px 0;list-style:none;cursor:pointer}
.al summary::-webkit-details-marker{display:none}
.al summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.al .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.al.bad .dot{background:var(--bad)} .al.warn .dot{background:var(--warn)} .al.good .dot{background:var(--good)}
.al .t{flex:1;min-width:0;font-weight:600;font-size:14.5px;line-height:1.3}
.al .chev,.acc .chev,.det .chev{color:var(--muted);display:grid;place-items:center;transition:transform .2s}
.al .chev svg,.acc .chev svg,.det .chev svg{width:18px;height:18px}
.al[open] .chev,.acc[open]>summary .chev{transform:rotate(180deg)}
.al p{margin:0 0 12px 19px;font-size:13.5px;color:var(--muted)}
/* in-page segments */
.segbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 75px);z-index:4;background:var(--bg);padding-block:4px;margin-block:-4px}
.seg.big button{padding:9px 6px;font-size:13.5px;min-height:40px;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg.big button .cnt{height:19px;min-width:19px;font-size:11px;background:var(--surface-2)}
.seg.big button[aria-pressed="true"] .cnt{background:var(--accent-soft);color:var(--accent)}
/* accordion cards */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.acc>summary{display:flex;align-items:center;gap:10px;padding:14px 16px;list-style:none;cursor:pointer;min-height:56px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--r)}
.acc>summary h2{font-size:17px}
.acc>summary .m{font-size:13px;color:var(--muted)}
.acc .acc-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.bar.thin{height:5px;margin-top:6px}
.cat summary{min-height:52px}
.cat .catname{font-weight:600}
.cat .catmeta{font-size:12px;color:var(--muted);font-weight:500}
.sublist{padding:0 0 8px 10px;border-left:2px solid var(--surface-2);margin-left:2px}
.sublist .item{padding:8px 0;min-height:44px}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.goal{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:var(--ink);cursor:pointer;font:inherit}
.rows>.goal:first-child{border-top:0;padding-top:4px}
.goal .g1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.goal .g1 b{font-weight:700;white-space:nowrap}
.goal .g3{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.upbar{flex-direction:row;align-items:center;gap:10px}
.upbar select{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}
/* bottom sheets (forms, Kan dit?, uploaden) */
#sheet .sheet-b{display:flex;flex-direction:column;gap:12px;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 0}
.bigin{font-family:var(--font-display);font-size:26px!important;font-weight:700;padding:10px 12px!important}
@media (max-width:600px){
  #dlg,#sheet{width:100%;max-width:100%;margin:auto 0 0;border-radius:20px 20px 0 0;max-height:90dvh}
  #dlg form{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:360px){.tile .v{font-size:20px}.sum .big{font-size:34px}}
.det summary>.grow,.acc>summary>.grow{flex:1;min-width:0}
.card>.al{border-top:0}
.card>.al summary{min-height:40px}
.btn.sm{white-space:nowrap}
.goal .name{font-weight:600}
.goal .meta{font-size:12.5px;color:var(--muted)}
.gw table{font-size:12.5px;width:100%;min-width:0}
.gw th,.gw td{padding:6px 5px}
.gw td:first-child{white-space:normal;overflow-wrap:anywhere}
#komt,#segA{scroll-margin-top:84px}
.row .tchev{color:var(--muted);display:grid;place-items:center}
.row .tchev svg{width:16px;height:16px}
.row .n small{white-space:normal}
/* toegang & beheer: who is viewing (Claude-account), rights per onderdeel, admin view for the owner */
.tabs .row{grid-template-columns:repeat(var(--ntabs,4),1fr)}
body.gated .tabs{display:none}
.gate{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.gate h2{font-size:22px}
.who{display:flex;align-items:center;gap:10px}
.who img{width:34px;height:34px;border-radius:50%;flex:none;background:var(--surface-2)}
.who .grow{flex:1;min-width:0}
.prevbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:600}
.menu{display:flex;flex-direction:column}
.menu .row{min-height:52px}
.bh-row{display:grid;grid-template-columns:minmax(0,1fr) 54px 72px;align-items:center;gap:6px;min-height:50px;border-top:1px solid var(--line);padding:4px 0}
.bh-row:first-child{border-top:0}
.bh-row .n{font-weight:600;font-size:14px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.bh-row .n small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.bh-head{display:grid;grid-template-columns:minmax(0,1fr) 54px 72px;gap:6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;padding:2px 0 6px}
.bh-head span{text-align:center}
.bh-cell{display:grid;place-items:center}
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.sw input:disabled{cursor:default}
.sw input:disabled+i{opacity:.4}
.na{font-size:12px;color:var(--muted)}
.ro-note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px}
/* v3 app design: one typeface, flat white cards on a cool grey ground, large page title, translucent tab bar with a centre action (Kan dit?). Money colours: blue = vaste lasten, orange = losse uitgaven, aqua = sparen; status colours only for good/warn/bad. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#EBF0ED; --ink:#0E1A16; --muted:#5A6863; --line:#E2E8E5;
  --accent:#0E6B57; --accent-ink:#FFFFFF; --accent-soft:#DCEFE7;
  --good:#1A7F4B; --warn:#A85A00; --bad:#C2311E; --good-soft:#E2F2E9; --warn-soft:#FBEBD3; --bad-soft:#FBE3DF; --info-soft:#E6EEF8; --info:#2A62B0;
  --sum:#29312E; --sum-ink:#FFFFFF; --sum-muted:#AEBBB6; --sum-line:rgba(255,255,255,.14); --sum-2:rgba(255,255,255,.08);
  --v1:#2a78d6; --v2:#eb6834; --v3:#1baf7a; --v0:#C9D2CE;
  --font-display:"Figtree","Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-body:"Figtree","Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(14,26,22,.05),0 8px 24px rgba(14,26,22,.05);
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0F0D; --surface:#141B19; --surface-2:#1C2522; --ink:#E9F0ED; --muted:#94A49E; --line:#25302C;
  --accent:#4FC2A2; --accent-ink:#06231B; --accent-soft:#16352C;
  --good:#5BD08F; --warn:#F2A93B; --bad:#FF7A6B; --good-soft:#173528; --warn-soft:#3A2A10; --bad-soft:#3D1A16; --info-soft:#17263A; --info:#86B6EF;
  --sum:#2A3330; --sum-ink:#F1F5F3; --sum-muted:#A9B7B2; --sum-line:rgba(255,255,255,.12); --sum-2:rgba(255,255,255,.07);
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v0:#3A4642;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0F0D; --surface:#141B19; --surface-2:#1C2522; --ink:#E9F0ED; --muted:#94A49E; --line:#25302C;
  --accent:#4FC2A2; --accent-ink:#06231B; --accent-soft:#16352C;
  --good:#5BD08F; --warn:#F2A93B; --bad:#FF7A6B; --good-soft:#173528; --warn-soft:#3A2A10; --bad-soft:#3D1A16; --info-soft:#17263A; --info:#86B6EF;
  --sum:#2A3330; --sum-ink:#F1F5F3; --sum-muted:#A9B7B2; --sum-line:rgba(255,255,255,.12); --sum-2:rgba(255,255,255,.07);
  --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v0:#3A4642;
  --shadow:none; color-scheme:dark}
body{font-family:var(--font-body);letter-spacing:-.003em;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.015em}
.wrap{gap:14px;padding-block:6px 28px}
/* app bar */
header.top{background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid transparent;padding:10px 16px 10px}
header.top h1{display:flex;flex-direction:column;gap:1px;font-size:27px;font-weight:800;line-height:1.1}
header.top h1 .app{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--accent)}
header.top .per{font-size:13px;margin-top:2px}
.iconbtn{background:var(--surface);border-color:transparent;box-shadow:var(--shadow);width:40px;height:40px}
/* cards: flat, no border in light */
.card{border:0;box-shadow:var(--shadow);border-radius:var(--r)}
.acc{border:0;box-shadow:var(--shadow);border-radius:var(--r)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) .acc{border:1px solid var(--line)}}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .acc{border:1px solid var(--line)}
.card.c3{padding:16px;gap:12px}
.h3row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px}
.h3row h2{font-size:17px;font-weight:750}
.sub3{font-size:12.5px;color:var(--muted);font-weight:600}
.cnt{background:var(--surface-2)}
/* bottom tab bar with centre action */
.tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
.tab{font-size:11px;font-weight:650;gap:3px;padding:7px 2px 5px;border-radius:12px}
.tab svg{width:24px;height:24px;stroke-width:1.9}
.tab[aria-selected="true"]{background:none;color:var(--accent)}
.tab[aria-selected="true"] svg{stroke-width:2.3}
.fab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;padding:0 2px 5px;font-family:inherit}
.fab .o{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-20px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent),0 0 0 4px var(--bg)}
.fab .o svg{width:26px;height:26px}
.fab:focus-visible .o{outline:2px solid var(--accent);outline-offset:3px}
/* hero */
.hero3{background:var(--sum);color:var(--sum-ink);border-radius:22px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:6px}
.h3top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl3{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--sum-muted)}
.pill3{font-size:12px;font-weight:650;color:var(--sum-ink);background:var(--sum-2);border-radius:999px;padding:4px 10px}
.big3{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
.eq3{font-size:13.5px;color:var(--sum-muted)}
.eq3 b{color:var(--sum-ink);font-weight:650}
.vd3{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;margin-top:8px;background:var(--sum-2)}
.vd3 b{display:block;font-size:15px;font-weight:750;line-height:1.3}
.vd3 small{display:block;font-size:13px;color:var(--sum-muted);line-height:1.35;margin-top:1px}
.card .vd3{background:var(--bad-soft)}
.card .vd3 small{color:var(--muted)}
/* status icon */
.st3{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff}
.st3 svg{width:15px;height:15px}
.st3.good{background:var(--good)} .st3.warn{background:var(--warn)} .st3.bad{background:var(--bad)} .st3.info{background:var(--info)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st3{color:#0A0F0D}}
:root[data-theme="dark"] .st3{color:#0A0F0D}
.chip3{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip3.good{background:var(--good-soft);color:var(--good)} .chip3.warn{background:var(--warn-soft);color:var(--warn)} .chip3.bad{background:var(--bad-soft);color:var(--bad)}
/* flow bar */
.flowcap{font-size:13.5px;color:var(--muted)}
.flowcap b{color:var(--ink);font-weight:750}
.flowcap .pos{color:var(--good);font-weight:650} .flowcap .neg{color:var(--bad);font-weight:650}
.flowbar{display:flex;gap:2px;height:18px;border-radius:9px;overflow:hidden;background:var(--surface-2)}
.flowbar .sg{display:block;flex-basis:0;min-width:4px}
.sg.v1,.sw3.v1{background:var(--v1)}
.sg.v1.hatch,.sw3.v1.hatch{background:repeating-linear-gradient(135deg,var(--v1) 0 2.5px,color-mix(in srgb,var(--v1) 28%,var(--surface)) 2.5px 5.5px)}
.sg.v2,.sw3.v2{background:var(--v2)} .sg.v3,.sw3.v3{background:var(--v3)} .sg.v0,.sw3.v0{background:var(--v0)}
.sg.bad,.sw3.bad{background:repeating-linear-gradient(135deg,var(--bad) 0 2.5px,var(--bad-soft) 2.5px 5.5px)}
.legend3{display:flex;flex-direction:column}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr) auto 40px;gap:10px;align-items:center;min-height:44px;border-top:1px solid var(--line);padding:5px 0}
.lg:first-child{border-top:0}
.sw3{width:12px;height:12px;border-radius:4px}
.lt{min-width:0;display:flex;flex-direction:column}
.lt span{font-weight:650;font-size:14.5px}
.lt small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg b{font-weight:750;white-space:nowrap}
.lg .pc{font-size:12.5px;color:var(--muted);text-align:right}
/* priority ladder */
.ladder{display:flex;flex-direction:column}
.pr3{border-top:1px solid var(--line)}
.pr3:first-child{border-top:0}
.pr3>summary{display:flex;align-items:center;gap:12px;padding:11px 0;list-style:none;cursor:pointer}
.pr3>summary::-webkit-details-marker{display:none}
.pr3>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.pr3 .nr{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface-2);color:var(--ink)}
.pr3 .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pt span{font-weight:700;font-size:15px}
.pt b{font-weight:750;white-space:nowrap}
.pt b small,.row .a small{font-weight:550;color:var(--muted);font-size:12.5px}
.pbar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.pbar.warn i{background:var(--warn)}.pbar.bad i{background:var(--bad)}
.ps{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.ps span:first-child{min-width:0}
.pr3 .chev{color:var(--muted);display:grid;place-items:center;transition:transform .2s}
.pr3 .chev svg{width:18px;height:18px}
.pr3[open]>summary .chev{transform:rotate(180deg)}
.pbody{padding:0 0 10px 40px;display:flex;flex-direction:column;gap:6px}
/* te doen */
.todo{display:flex;flex-direction:column}
.td{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:var(--ink);font:inherit}
.todo>.td:first-child{border-top:0;padding-top:4px}
button.td{cursor:pointer}
button.td:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.td .grow{flex:1;min-width:0}
.td b{display:block;font-size:14.5px;font-weight:700;line-height:1.3}
.td small{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}
.td .tchev{color:var(--muted);align-self:center}
.td .tchev svg{width:16px;height:16px}
/* bills */
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat3>div{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:8px 10px;font-size:12.5px;color:var(--muted);min-width:0}
.stat3 .st3{width:20px;height:20px}
.stat3 .st3 svg{width:12px;height:12px}
.stat3 b{color:var(--ink);font-size:15px;font-weight:800;margin-right:3px}
.rows.tl .row.risk .n small{color:var(--bad);font-weight:650}
.wtxt{color:var(--warn)!important;font-weight:600}
.row .a small{display:inline}
/* next month waterfall */
.wfall{display:flex;flex-direction:column;background:var(--surface-2);border-radius:14px;padding:6px 12px}
.wf{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;color:var(--muted)}
.wf b{color:var(--ink);font-weight:650;white-space:nowrap}
.wf b.neg{color:var(--bad)}
.wf.tot{border-top:1px solid var(--line);margin-top:2px;padding-top:9px;color:var(--ink);font-weight:700}
.wf.tot b{font-weight:800;font-size:16px}
.row.al3{gap:10px}
.row.al3 .a{text-align:right}
.btn.ghost{background:var(--surface-2);border-color:transparent;align-self:flex-start}
@media (max-width:360px){.big3{font-size:38px}.stat3{grid-template-columns:1fr}}
.lt small{white-space:normal;overflow:visible}
.row.al3 .a{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.tab,.fab{white-space:nowrap}
.flowcap{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* adviesmotor */
.advl{display:flex;flex-direction:column}
.adv{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.advl>.adv:first-child{border-top:0;padding-top:4px}
.adv .grow{flex:1;min-width:0}
.adv b{display:block;font-size:14.5px;font-weight:700;line-height:1.3}
.adv small{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}
.adv .doe,.card .doe{font-size:13.5px;line-height:1.45;margin:6px 0 0}
.adv .opt{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.45}
.adv .opt li{margin:3px 0}
.adv .opt b{display:inline;font-size:inherit}
.adv .eff{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:13px;font-weight:600}
.adv .eff .pos{color:var(--good)} .adv .eff .neg{color:var(--bad)}
.adv .btnrow{margin-top:8px}

<script>
(function(){
"use strict";
// ---------- helpers ----------
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtEur = new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR"});
const fmtEur0 = new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const eur = n => fmtEur.format(Math.round((n||0)*100)/100);
const eur0 = n => fmtEur0.format(Math.round(n||0));
const MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const MAANDEN_L = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const DAGEN = ["zo","ma","di","wo","do","vr","za"];
const DAGEN_L = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const day0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const dim = (y,m) => new Date(y, m+1, 0).getDate();
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseIso = s => { if(!s) return null; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m? new Date(+m[1],+m[2]-1,+m[3]) : null; };
const dkort = d => d.getDate()+" "+MAANDEN[d.getMonth()];
const dlang = d => d.getDate()+" "+MAANDEN_L[d.getMonth()]+" "+d.getFullYear();
const daysBetween = (a,b) => Math.round((day0(b)-day0(a))/86400000);
const num = v => { const n = typeof v==="number"? v : parseFloat(String(v??"").replace(",",".")); return isFinite(n)? n : 0; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
const store = { get(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch(e){} } };

// ---------- state ----------
const CONFIG_DEFAULT = {loondag:25, vrijBudget:300, spaarsaldo:0, buffer:1000, eigenRekeningen:""};
const S = { config:Object.assign({}, CONFIG_DEFAULT), posten:[], inkomsten:[], extras:[], doelen:[], afschriften:[], afMeta:[], afDelen:[], uitgaven:[], gepland:[], regels:[], loaded:{}, tab: store.get("tab")||"overzicht", afschriftSel:null, advies:{}, herind:new Map(), notities:new Map() };
let db = null, sample = null, mcp = null, userCap = null;
const TODAY = day0(new Date());

// ---------- toegang (Google-account) en rechten ----------
// Wie kijkt wordt herkend aan het Google-account waarmee is ingelogd (Barry of Ilona). Andere accounts zien "Geen toegang".
// Rechten per profiel en per onderdeel: z = zien, a = aanpassen. Aanpassen kan alleen als zien aan staat.
// Let op: dit regelt wat de tool toont; de opslag zelf maakt geen onderscheid tussen Barry en Ilona (zie WERKING.md).
const SCHERMEN = [
  {k:"overzicht", t:"Overzicht", items:[
    ["ov.besteedbaar","Grijs blok \"Besteedbaar deze maand\" met het antwoord","z"],
    ["ov.advies","Slimste stap nu (advies)","z"],
    ["ov.uitgaven","Waar is het geld heen","z"],
    ["ov.letop","Te doen","z"],
    ["ov.vrij","Wie krijgt het geld","za","Aanpassen: zelf ingevoerde uitgaven bewerken"],
    ["ov.komt","Rekeningen tot loondag","z"],
    ["ov.nogte","Volgende maand","z"],
    ["ov.kandit","Kan dit? (ronde knop onderin)","za","Aanpassen: een uitgave vastleggen"]]},
  {k:"lasten", t:"Vaste lasten", items:[
    ["vl.uitgaven","Uitgaven (vaste lasten per categorie)","za","Aanpassen: toevoegen, wijzigen, verwijderen"],
    ["vl.inkomsten","Inkomsten","za"],
    ["vl.schulden","Schulden","za","Aanpassen: afbetalingen wijzigen"]]},
  {k:"plan", t:"Plan & doelen", items:[
    ["pl.beschikbaar","Grijs blok \"Beschikbaar voor plan\"","z"],
    ["pl.doelen","Doelen & terugbetalingen","za"],
    ["pl.maandplan","Maandplan","z"],
    ["pl.meevallers","Verwacht: extra inkomsten en uitgaven","za","Aanpassen: ook de knop \"+ Verwacht\" op Overzicht"],
    ["pl.advies","Advies (alle adviezen)","z"]]},
  {k:"afschrift", t:"Afschrift", items:[
    ["af.nieuw","Nieuw afschrift toevoegen","a"],
    ["af.blok","Grijs blok \"Afgeschreven\"","z"],
    ["af.indelen","In te delen","za","Aanpassen: afschrijvingen indelen"],
    ["af.soort","Per soort","za","Aanpassen: anders indelen, notities"],
    ["af.vaste","Vaste lasten op het afschrift","za","Aanpassen: \"Vaste last op €x zetten\", anders indelen"],
    ["af.genegeerd","Genegeerd","za","Aanpassen: anders indelen"],
    ["af.analyse","Analyse","z"],
    ["af.verwijderen","Afschrift verwijderen","a"]]},
  {k:"instellingen", t:"Instellingen", items:[
    ["in.loondag","Loondag","za"],["in.vrijBudget","Vrij besteedbaar per maand","za"],["in.spaarsaldo","Huidig spaarsaldo","za"],["in.buffer","Gewenste buffer","za"],
    ["in.eigenCats","Eigen categorieën vaste lasten","za","Aanpassen: ook \"+ Nieuwe categorie\" bij vaste lasten"],
    ["in.eigenVarCats","Eigen soorten losse uitgaven","za","Aanpassen: ook \"+ Nieuwe categorie\" bij losse uitgaven"],
    ["in.eigenRekeningen","Eigen rekeningen","za"]]},
];
const PROFIELEN = {barry:"Barry", ilona:"Ilona"};
const T = {profielen:{}, ilonaId:null, loaded:false};   // toegang/rechten
const WHO = {me:null, isOwner:false, profiel:null, preview:null, verzoek:null, verzoeken:[], started:false};
function rechtVan(p, k){ const r = ((T.profielen||{})[p]||{})[k]; return {z: r ? r.z!==false : true, a: r ? r.a!==false : true}; }
function actief(){ return WHO.preview || WHO.profiel; }
function itemDef(k){ for(const s of SCHERMEN) for(const it of s.items) if(it[0]===k) return it; return null; }
// Z = mag zien, A = mag aanpassen (aanpassen vereist zien, behalve bij pure acties)
function Z(k){ const p=actief(); if(!p) return false; const d=itemDef(k); if(d && d[2]==="a") return rechtVan(p,k).a; return rechtVan(p,k).z; }
function A(k){ const p=actief(); if(!p) return false; const r=rechtVan(p,k), d=itemDef(k); return d && d[2]==="z" ? false : (d && d[2]==="a" ? r.a : r.z && r.a); }
function schermZichtbaar(sk){ const s=SCHERMEN.find(x=>x.k===sk); return !!s && s.items.some(it=>Z(it[0])); }
function zichtbareTabs(){ return ["overzicht","lasten","plan","afschrift"].filter(schermZichtbaar); }
function stripNewCat(root, kind){ // "+ Nieuwe categorie…" alleen als eigen categorieën aangepast mogen worden
  root.querySelectorAll("select[data-newcat]").forEach(sel => { const k = sel.dataset.newcat==="los" ? "in.eigenVarCats" : "in.eigenCats"; if(!A(k)) sel.querySelectorAll('option[value="__new__"]').forEach(o=>o.remove()); });
}
// Saving rights: every change bumps a counter; one write runs at a time and always sends the latest local state.
// Incoming snapshots never overwrite local changes that are not yet confirmed, and snapshots older than our own last
// write (they can arrive late) are ignored. Without this, a late snapshot turned switches back on.
const RS = {gen:0, saved:0, busy:false, timer:null, lastStamp:""};
function rechtenDirty(){ return RS.gen !== RS.saved || RS.busy || !!RS.timer; }
function rechtenStatus(t){ S.bhStatus = t; const st=$("#bhStatus"); if(st) st.textContent = t; }
function rechtenOpslaan(){
  RS.gen++; rechtenStatus("Opslaan…");
  clearTimeout(RS.timer);
  RS.timer = setTimeout(rechtenSchrijf, 450);
}
async function rechtenSchrijf(){
  RS.timer = null;
  if(RS.busy) return;                       // the running write reschedules itself when it is done
  if(RS.gen === RS.saved) return;
  RS.busy = true;
  const gen = RS.gen, stamp = new Date().toISOString();
  try{
    await db.doc("toegang/rechten").set({profielen:JSON.parse(JSON.stringify(T.profielen||{})), ilonaId:T.ilonaId||null, bijgewerkt:stamp});
    RS.saved = gen; RS.lastStamp = stamp;
  }catch(e){
    rechtenStatus("Opslaan lukte niet");
    toast((e.code==="invalid_argument" || e.code==="not_granted") ? "Alleen de eigenaar (Barry) kan rechten wijzigen." : "Opslaan lukte niet ("+(e.code||e.message)+").");
    RS.busy = false; RS.saved = RS.gen; return;   // stop retrying; the next snapshot shows what is really stored
  }
  RS.busy = false;
  if(RS.gen !== RS.saved){ rechtenSchrijf(); return; }  // changes made while writing: send them now
  rechtenStatus("Opgeslagen");
}

const BASE_CATS = ["Wonen","Energie & water","Kinderopvang","Onderwijs & school","Verzekeringen & zorg","Gezondheid & medicijnen","Telecom & abonnementen","Streaming & apps","Sport & hobby's","Vervoer","Boodschappen","Huishouden & schoonmaak","Huisdieren","Kinderen & zakgeld","Persoonlijke verzorging","Contributies & goede doelen","Afbetalingen & schulden","Belastingen & gemeente","Sparen","Overig"];
let CATS = BASE_CATS.slice();
const CAT_HINTS = [
  ["Wonen",["huur","hypotheek","vve","woning"]],
  ["Energie & water",["eneco","vattenfall","essent","greenchoice","energie","vitens","evides","waternet","brabant water","pwn","dunea","stroom","gas"]],
  ["Kinderopvang",["kinderopvang","kdv","bso","gastouder","opvang","creche","peuter"]],
  ["Verzekeringen & zorg",["zorgverzekering","verzekering","dela","monuta","inboedel","rechtsbijstand","aansprakelijk","cz","vgz","zilveren kruis","menzis","ohra","centraal beheer","interpolis","univé","unive","tandarts"]],
  ["Telecom & abonnementen",["vodafone","kpn","odido","t-mobile","ziggo","tele2","simyo","ben ","lebara","netflix","spotify","disney","videoland","hbo","max","prime","youtube","apple","icloud","google one","sport","gym","basic-fit","krant","abonnement"]],
  ["Vervoer",["lease","auto","benzine","ov","ns ","anwb","wegenbelasting","parkeer"]],
  ["Boodschappen",["boodschappen","supermarkt","albert heijn","jumbo","lidl","aldi"]],
  ["Afbetalingen & schulden",["afbetaling","lening","duo","studieschuld","krediet","aflos","terugbetal","schuld"]],
  ["Belastingen & gemeente",["belasting","gemeente","waterschap","cjib","bsgr","hhnk","gbt"]],
  ["Sparen",["sparen","spaar","beleggen","pensioen"]],
];
function suggestCategory(naam){
  const t = " "+String(naam||"").toLowerCase()+" ";
  // more specific signals first: debts before the thing they pay off
  if(/afbetal|lening|studieschuld|duo|aflos/.test(t)) return "Afbetalingen & schulden";
  for(const [c,kws] of CAT_HINTS) if(kws.some(k=>t.includes(k))) return c;
  return null;
}
const BASE_VAR_CATS = ["Horeca & bezorging","Uitjes & vrije tijd","Vakantie","Winkels & online","Elektronica","Kleding & verzorging","Kinderen","School & clubjes","Cadeaus","Zorg","Sport & hobby's","Huisdieren","Vervoer","Huis & tuin","Onderhoud & reparaties","Goede doelen","Overig"];
let VAR_CATS = BASE_VAR_CATS.slice();
const splitCats = v => String(v||"").split(",").map(x=>x.trim()).filter(Boolean);
function applyCats(){
  const uniq = (base, extra) => { const out = base.slice(0,-1); extra.forEach(c=>{ if(!out.concat("Overig").some(x=>x.toLowerCase()===c.toLowerCase())) out.push(c); }); out.push("Overig"); return out; };
  CATS = uniq(BASE_CATS, splitCats(S.config.eigenCats));
  VAR_CATS = uniq(BASE_VAR_CATS, splitCats(S.config.eigenVarCats));
}
const NEWCAT = '<option value="__new__">+ Nieuwe categorie…</option>';

// ---------- periods ----------
function periodStartFor(d){
  const L = Math.max(1, Math.min(28, Math.round(num(S.config.loondag)||25)));
  const y=d.getFullYear(), m=d.getMonth();
  return d.getDate() >= L ? new Date(y,m,L) : new Date(y,m-1,L);
}
function periodN(n){ // n=0 current
  const s0 = periodStartFor(TODAY);
  const s = new Date(s0.getFullYear(), s0.getMonth()+n, s0.getDate());
  const e = addDays(new Date(s.getFullYear(), s.getMonth()+1, s.getDate()), -1);
  return {start:s, end:e, n};
}
function perName(p){ return MAANDEN[p.start.getMonth()]+"–"+MAANDEN[p.end.getMonth()]; }
function occurrences(item, start, end){
  const out=[]; const eind = parseIso(item.einddatum); const begin = parseIso(item.startdatum);
  if(item.freq==="week"){
    const wd = item.weekdag==null?4:+item.weekdag;
    for(let d=new Date(start); d<=end; d=addDays(d,1)) if(d.getDay()===wd) out.push(new Date(d));
  } else {
    const dag = Math.max(1, Math.round(num(item.dag)||1));
    let y=start.getFullYear(), m=start.getMonth();
    for(let i=0;i<600;i++){
      const d = new Date(y, m, Math.min(dag, dim(y,m)));
      if(d>end) break;
      if(d>=start) out.push(d);
      m++; if(m>11){m=0;y++;}
    }
  }
  return out.filter(d => (!eind || d<=eind) && (!begin || d>=begin) && !(item.id && VERV.has(item.id+"_"+iso(d))));
}
function periodCalc(p){
  const ink=[], uit=[];
  S.inkomsten.forEach(it => occurrences(it,p.start,p.end).forEach(d => ink.push({d, it, bedrag:num(it.bedrag)})));
  S.posten.forEach(it => occurrences(it,p.start,p.end).forEach(d => uit.push({d, it, bedrag:num(it.bedrag)})));
  const I = ink.reduce((a,x)=>a+x.bedrag,0), V = uit.reduce((a,x)=>a+x.bedrag,0);
  const sparen = uit.filter(x=>x.it.categorie==="Sparen").reduce((a,x)=>a+x.bedrag,0);
  return {p, ink, uit, I, V, sparen, marge:I-V};
}

// ---------- planner ----------
// Each month: first pay deadline items at the pace they need, then leftover goes by priority (equal split within a priority).
// Geplande uitgaven (collectie gepland): een uitgave op een datum. bron "plan": vooraf gereserveerd uit het geld voor
// plan & doelen, verdeeld over `delen` loonperiodes die eindigen in de periode van de datum (gaat vóór de doelen).
// bron "vrij": telt in de periode van de datum mee als uitgegeven van het vrije budget.
function periodIndex(d){ if(!d) return null; const p0=periodN(0); if(d<p0.start) return -1; for(let n=0;n<36;n++){ const p=periodN(n); if(d>=p.start && d<=p.end) return n; } return 99; }
function geplandItems(extra){
  return S.gepland.concat(extra||[]).map(g => { const d=parseIso(g.datum); return {g, d, n:periodIndex(d), k:Math.max(1,Math.round(num(g.delen))||1), bedrag:num(g.bedrag), bron:g.bron==="vrij"?"vrij":"plan"}; });
}
// ---------- inkomsten deze periode: zoals ze op het afschrift binnenkwamen ----------
// A planned income counts as it arrived once the afschrift covers its date: by keyword, or else the unrecognised
// bijschrijving within 5 days that is closest in size (50–200% of the planned amount). Covered but still not there
// 5 days after its date: not received. Not covered yet: as planned. Other bijschrijvingen (no own transfers) count as extra.
// Expected meevallers of this period (status verwacht) are already in the plan (extraIn). An unrecognised bijschrijving of about
// the same amount (within 5%, at least €1) counts as that meevaller: `meer` (for the plan) leaves it out, `kas` keeps it.
let INK = {key:null, val:null};
function inkomenNu(){
  const p = periodN(0), af = currentAfschrift();
  const key = [S.afschriften, S.inkomsten, S.posten, S.regels, S.herind, S.config, S.extras, TODAY.getTime()];
  if(INK.key && INK.key.length===key.length && INK.key.every((v,i)=>v===key[i])) return INK.val;
  const cur = periodCalc(p);
  const van = af ? parseIso(af.van) : null, tot = af ? parseIso(af.tot) : null;
  const matched = new Map(), los = [];
  if(af) (af.rows||[]).forEach(r => { const d = parseIso(r[0]); if(!d || d<p.start || d>p.end || !(r[2]>0)) return; const c = classify(r); if(c.type==="negeer") return;
    if(c.type==="inkomst" && c.it) matched.set(c.it.id, (matched.get(c.it.id)||0) + r[2]); else los.push({r, d, b:r[2], it:null}); });
  // pair planned incomes without a keyword match with unrecognised bijschrijvingen, closest in size first
  const open = van ? cur.ink.filter(x => !matched.has(x.it.id) && x.d>=van && x.d<=tot) : [];
  const paren = [];
  open.forEach(x => los.forEach(l => { const q = l.b / Math.max(0.01, x.bedrag); if(Math.abs(daysBetween(x.d, l.d))<=5 && q>=0.5 && q<=2) paren.push({x, l, s:Math.abs(Math.log(q))}); }));
  paren.sort((a,b)=>a.s-b.s);
  const gekoppeld = new Map();
  paren.forEach(pr => { if(gekoppeld.has(pr.x) || pr.l.it) return; pr.l.it = pr.x.it; gekoppeld.set(pr.x, pr.l); });
  const gehad = new Set();
  const ink = cur.ink.map(x => {
    if(matched.has(x.it.id)){ const eerste = !gehad.has(x.it.id); gehad.add(x.it.id); return {d:x.d, it:x.it, gepland:x.bedrag, bedrag: eerste ? matched.get(x.it.id) : 0, st:"binnen"}; }
    const l = gekoppeld.get(x);
    if(l) return {d:x.d, it:x.it, gepland:x.bedrag, bedrag:l.b, st:"gevonden", rij:l.r};
    if(van && x.d>=van && addDays(x.d,5)<=tot) return {d:x.d, it:x.it, gepland:x.bedrag, bedrag:0, st:"niet binnen"};
    return {d:x.d, it:x.it, gepland:x.bedrag, bedrag:x.bedrag, st: x.d<=TODAY ? "gepland" : "verwacht"};
  });
  const extraRows = los.filter(l=>!l.it).map(l=>l.r).sort((a,b)=>b[2]-a[2]);
  const extra = extraRows.reduce((s,r)=>s+r[2],0);
  const I = ink.reduce((s,x)=>s+x.bedrag,0) + extra;
  const vrije = los.filter(l=>!l.it), mvBinnen = [];
  S.extras.filter(x=>x.richting==="in" && x.status==="verwacht").forEach(v => { const dl = parseIso(v.deadline), b = num(v.bedrag); if(!dl || dl>p.end || !(b>0)) return;
    const l = vrije.filter(l=>!l.mv && Math.abs(l.b-b) <= Math.max(1, b*0.05)).sort((x,y)=>Math.abs(x.b-b)-Math.abs(y.b-b))[0];
    if(l){ l.mv = v; mvBinnen.push({v, rij:l.r, b:l.b}); } });

function buildPlan(extraSpend0, extraGepland){
  const items = [];
  S.extras.filter(x=>x.richting!=="in" && x.status!=="betaald").forEach(x => items.push({id:x.id, kind:"extra", naam:x.naam, totaal:num(x.bedrag), rest:Math.max(0,num(x.bedrag)-num(x.betaald)), deadline:parseIso(x.deadline), prio:+x.prio||3, vast:num(x.maandbedrag), src:x}));
  S.doelen.forEach(x => items.push({id:x.id, kind:"doel", naam:x.naam, totaal:num(x.bedrag), rest:Math.max(0,num(x.bedrag)-num(x.gespaard)), deadline:parseIso(x.datum), prio:+x.prio||3, vast:num(x.maandbedrag), src:x}));
  const vrij = num(S.config.vrijBudget);
  const meer0 = inkomenNu().meer;   // income this period as it arrived, minus what was planned
  const months = []; let carry = 0;   // a shortfall is carried to the next period(s) and comes off first
  for(let n=0;n<36;n++){
    const pc = periodCalc(periodN(n));
    let extraIn = 0;
    S.extras.filter(x=>x.richting==="in" && x.status==="verwacht").forEach(x => {
      const dl = parseIso(x.deadline); const p = pc.p;
      if(dl ? (dl>=p.start && dl<=p.end) || (n===0 && dl<p.start) : n===1) extraIn += num(x.bedrag);
    });
    const raw = pc.marge + pc.sparen - vrij + extraIn - (n===0 ? (extraSpend0||0) : 0) + (n===0 ? meer0 : 0) - carry;
    const tekortIn = carry, beschikbaar = Math.max(0, raw);
    carry = Math.max(0, -raw);
    months.push({p:pc.p, beschikbaar, extraIn, marge:pc.marge, sparen:pc.sparen, alloc:{}, reserve:0, uitbetaal:0, basis:beschikbaar, meer:n===0?meer0:0, tekortIn, tekortUit:carry});
  }
  // reserve planned expenses (bron plan) first: equal parts over their window; parts before this period count as already saved
  const gepl = geplandItems(extraGepland).filter(x=>x.bron==="plan" && x.n!==null && x.n>=0 && x.n<36);
  gepl.forEach(x => { x.alloc = new Array(months.length).fill(0); x.tekort = 0; x.deel = x.bedrag/x.k; });
  months.forEach((mo,n) => {
    gepl.filter(x => n<=x.n && n>x.n-x.k).sort((a,b)=>a.n-b.n).forEach(x => {
      const r = Math.min(x.deel, mo.beschikbaar); mo.beschikbaar -= r; mo.reserve += r; x.alloc[n] = r; x.tekort += x.deel - r;
    });
    gepl.filter(x => x.n===n).forEach(x => { mo.uitbetaal += x.bedrag; });
  });
  items.forEach(it => { it.alloc = new Array(months.length).fill(0); it.done=null; });
  months.forEach((mo, n) => {
    let avail = mo.beschikbaar;
    const open = items.filter(it => it.rest > 0.005);
    // 1) pace: deadline items need rest/periods-left, fixed-amount items get their monthly amount;
    //    terugbetalingen before spaardoelen, then by priority, then deadline
    const kr = it => it.kind==="extra" ? 0 : 1;
    open.filter(it=>it.deadline || it.vast>0).sort((a,b)=>(kr(a)-kr(b)) || (a.prio-b.prio) || ((a.deadline||new Date(9999,0))-(b.deadline||new Date(9999,0)))).forEach(it => {
      let needed;
      if(it.deadline){
        let left = 0; for(let k=n;k<months.length;k++){ left++; if(months[k].p.end >= it.deadline) break; }
        needed = it.deadline < mo.p.start ? it.rest : it.rest/Math.max(1,left);
        if(it.vast>0) needed = Math.max(needed, it.vast);
      } else needed = it.vast;
      const give = Math.min(needed, it.rest, avail);
      it.rest -= give; it.alloc[n]+=give; avail -= give;
    });
    // 2) leftover: terugbetalingen before spaardoelen, then by priority (equal split within the same priority)
    const groepen = [...new Set(open.map(it=>kr(it)*100+it.prio))].sort((a,b)=>a-b);
    for(const gk of groepen){
      if(avail<=0.005) break;
      let grp = open.filter(it=>kr(it)*100+it.prio===gk && it.rest>0.005);
      while(grp.length && avail>0.005){
        const share = avail/grp.length; let used=0;
        grp.forEach(it => { const g=Math.min(share, it.rest); it.rest-=g; it.alloc[n]+=g; used+=g; });
        avail -= used; grp = grp.filter(it=>it.rest>0.005);
        if(used<0.005) break;
      }
    }
    mo.over = avail;
    items.forEach(it => { if(it.done===null && it.rest<=0.005 && (it.alloc[n]>0 || n===0)) it.done = n; });
  });
  items.forEach(it => {
    it.klaar = it.done===null ? null : months[it.done].p;
    it.klaarDatum = it.klaar ? it.klaar.end : null;
    if(!it.deadline) it.status = it.klaar ? "ok" : "nooit";
    else if(!it.klaar) it.status = "laat";
    else it.status = it.klaar.start <= it.deadline ? "ok" : "laat";
    it.dezeMaand = it.alloc[0];
  });
  return {items, months, gepl};
}

function splitCsvLine(line, delim){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ out.push(cur); cur=""; }
    else cur+=c;
  }
  out.push(cur); return out;
}
function parseBankCsv(text){
  text = text.replace(/^﻿/,"");
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  if(lines.length<2) throw new Error("Het bestand bevat geen regels.");
  const first = lines[0];
  const delim = (first.split(";").length > first.split(",").length) ? ";" : ",";
  const head = splitCsvLine(first, delim).map(h=>h.trim().toLowerCase());
  const col = (...names) => head.findIndex(h => names.some(n => h.includes(n)));
  const iD = col("datum","date"), iN = col("naam","omschrijving","description"), iB = col("bedrag","amount"),
        iAB = col("af bij","af/bij","debit/credit"), iM = col("mededeling","omschrijving-1","notifications"), iT = col("tegenrekening","counterparty");
  if(iD<0 || iB<0) throw new Error("Dit lijkt geen ING-export: ik vind geen kolommen 'Datum' en 'Bedrag (EUR)'.");
  const rows=[];
  for(const line of lines.slice(1)){
    const c = splitCsvLine(line, delim);
    const rawD = (c[iD]||"").trim(); let d=null;
    let m = /^(\d{4})(\d{2})(\d{2})$/.exec(rawD) || /^(\d{4})-(\d{2})-(\d{2})/.exec(rawD);
    if(m) d = new Date(+m[1],+m[2]-1,+m[3]);
    else if((m=/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/.exec(rawD))) d = new Date(+m[3],+m[2]-1,+m[1]);
    if(!d) continue;
    let rawB = (c[iB]||"").trim().replace(/\s/g,"");
    if(/,\d{1,2}$/.test(rawB)) rawB = rawB.replace(/\./g,"").replace(",",".");
    let b = parseFloat(rawB); if(!isFinite(b)) continue;
    if(iAB>=0){ const ab=(c[iAB]||"").trim().toLowerCase(); if(ab==="af"||ab==="debit") b=-Math.abs(b); else if(ab==="bij"||ab==="credit") b=Math.abs(b); }
    const naam = (iN>=0? c[iN] : "").trim().slice(0,70);
    const med = (iM>=0? c[iM] : "").trim().replace(/\s+/g," ").slice(0,90);
    rows.push([iso(d), naam, Math.round(b*100)/100, med, iT>=0 ? (c[iT]||"").trim().slice(-4) : ""]);
  }
  if(!rows.length) throw new Error("Geen transacties gevonden in dit bestand.");
  rows.sort((a,b)=>a[0]<b[0]?-1:1);
  return rows.slice(-1500);
}
function keywordsOf(it){
  return String(it.zoekwoorden||"").toLowerCase().split(",").map(s=>s.trim()).filter(Boolean);
}
function closest(list, amount){ // several items share a keyword (e.g. two Vodafone lines): pick the one whose amount fits best
  if(!list.length) return null; return list.slice().sort((a,b)=>Math.abs(num(a.bedrag)-amount)-Math.abs(num(b.bedrag)-amount))[0];
}
// ---------- eigen rekeningen ----------
// Overboekingen tussen de gezamenlijke rekening en de eigen rekeningen (in te stellen bij Budgetinstellingen) tellen niet mee,
// behalve als ze niet binnen 3 dagen worden teruggestort. De terugstorting is altijd lager dan de storting, dus er wordt
// gekoppeld op datum: een storting (af of bij) krijgt als terugstorting elke tegengestelde boeking van dezelfde persoon
// binnen 3 dagen erna, zolang die niet hoger is dan wat er van de storting nog openstaat.
// Elke uniek bekende boeking krijgt een status: "teruggestort", "terug" (de terugstorting zelf), "wacht" (de 3 dagen vallen
// nog niet helemaal binnen de geüploade afschriften) of "niet terug" (telt mee).
const EIGEN_DAGEN = 3;
function eigenNamen(){ return splitCats(S.config.eigenRekeningen).map(normKey).filter(Boolean); }
function eigenPersoon(row, namen){ const n = " "+normKey(row[1])+" "; return (namen||eigenNamen()).find(k => n.includes(" "+k+" ")) || null; }
let EIGEN = {src:null, key:null, map:new Map()};
function eigenStatus(){
  const namen = eigenNamen(), key = namen.join("|");
  if(EIGEN.src===S.afschriften && EIGEN.key===key) return EIGEN.map;
  const map = new Map();
  if(namen.length){
    const seen = new Map(); let dekking = null;
    S.afschriften.forEach(a => {
      const t = parseIso(a.tot); if(t && (!dekking || t>dekking)) dekking = t;
      (a.rows||[]).forEach(r => { const p = eigenPersoon(r, namen), d = parseIso(r[0]); if(!p || !d || !r[2]) return; const sig = rowSig(r); if(!seen.has(sig)) seen.set(sig, {r, sig, p, d, b:r[2]}); });
    });
    // oudste eerst; op dezelfde dag eerst het hoogste bedrag, want dat is de storting en niet de terugstorting
    const list = [...seen.values()].sort((x,y) => (x.d-y.d) || (Math.abs(y.b)-Math.abs(x.b)));
    const open = [];
    list.forEach(x => {
      const cands = open.filter(o => o.p===x.p && (o.b<0)!==(x.b<0) && daysBetween(o.d, x.d) <= EIGEN_DAGEN && Math.abs(x.b) <= o.rest + 0.005);
      const o = cands.find(c => c.r[4] && c.r[4]===x.r[4]) || cands[0];
      if(o){ o.rest -= Math.abs(x.b); o.terug.push(x); map.set(x.sig, {status:"terug", van:o}); return; }
      x.rest = Math.abs(x.b); x.terug = []; open.push(x);
    });
    open.forEach(o => map.set(o.sig, o.terug.length ? {status:"teruggestort", terug:o.terug}
      : {status: dekking && daysBetween(o.d, dekking) >= EIGEN_DAGEN ? "niet terug" : "wacht"}));
  }
  EIGEN = {src:S.afschriften, key, map};
  return map;
}
function eigenNoot(e){
  if(!e) return "";
  if(e.status==="terug") return "terugstorting van "+eur(Math.abs(e.van.b))+" ("+dkort(e.van.d)+")";
  if(e.status==="teruggestort") return eur(e.terug.reduce((s,x)=>s+Math.abs(x.b),0))+" teruggestort ("+[...new Set(e.terug.map(x=>dkort(x.d)))].join(", ")+")";
  if(e.status==="wacht") return "wacht op terugstorting";
  return "niet binnen "+EIGEN_DAGEN+" dagen teruggestort, telt mee";
}
function classify(row){
  const [d, naam, b, med] = row;
  const txt = (" "+naam+" "+med+" ").toLowerCase();
  const txtN = " "+normKey(naam)+" "+normKey(med)+" ";
  // keywords saved via "Indelen" are normalised (punctuation/digits → spaces), so also match against the normalised text
  const hit = k => { if(!k) return false; if(txt.includes(k)) return true; const kn = normKey(k); return !!kn && txtN.includes(kn); };
  // a choice made for this one afschrijving ("Anders indelen") wins over every automatic rule
  const ov = b<0 && S.herind ? S.herind.get(rowSig(row)) : null;
  if(ov){
    if(ov.soort==="negeer") return {type:"negeer", cat:"Eigen overboekingen", ov};
    if(ov.soort==="post"){ const it=S.posten.find(p=>p.id===ov.postId); if(it) return it.categorie==="Boodschappen" ? {type:"boodschappen", it, cat:"Boodschappen", ov} : {type:"post", it, cat:it.categorie||"Overig", ov}; }
    if(ov.soort==="var" && ov.categorie) return {type: ov.categorie==="Boodschappen"?"boodschappen":"var", cat:ov.categorie, ov};
  }
  // eigen rekeningen: teruggestorte overboekingen (beide kanten) niet meetellen, wel als ze na 3 dagen niet terug zijn
  const eg = eigenStatus().get(rowSig(row));
  if(eg){
    if(eg.status!=="niet terug") return {type:"negeer", cat:"Eigen rekeningen", eigen:eg};
    return b>0 ? {type:"bij", cat:"Van eigen rekening", eigen:eg} : {type:"var", cat:"Naar eigen rekening", eigen:eg};
  }
  if(b>0){
    const it = closest(S.inkomsten.filter(i=>keywordsOf(i).some(hit)), b); if(it) return {type:"inkomst", it, cat:"Inkomsten"};
    return {type:"bij", cat:"Overige bijschrijvingen"};
  }
  const pm = closest(S.posten.filter(p=>p.categorie!=="Boodschappen" && keywordsOf(p).some(hit)), -b); if(pm) return {type:"post", it:pm, cat:pm.categorie||"Overig"};
  for(const it of S.posten){ if(it.categorie==="Boodschappen" && keywordsOf(it).some(hit)) return {type:"boodschappen", it, cat:"Boodschappen"}; }
  for(const r of S.regels){ const k=String(r.zoekwoord||"").toLowerCase().trim(); if(hit(k)){
    if(r.categorie==="Negeren") return {type:"negeer", cat:"Eigen overboekingen"};
    return {type: r.categorie==="Boodschappen"?"boodschappen":"var", cat:r.categorie, regel:r}; } }
  if(b<0){ const lr = leerVoorspel(row); if(lr) return {type: lr.cat==="Boodschappen"?"boodschappen":"var", cat:lr.cat, geleerd:lr}; }
  for(const [cat, kws] of AUTO_CATS){ if(kws.some(k=>txt.includes(k))) return {type: cat==="Boodschappen"?"boodschappen":"var", cat, auto:true}; }
  return {type:"var", cat:"Nog in te delen", inbox:true};
}
function analyseAfschrift(a){
  const rows = a.rows||[];
  const res = {inTot:0, uitTot:0, cats:{}, posten:new Map(), boodschappen:0, variabel:0, varRows:[], van:parseIso(a.van), tot:parseIso(a.tot)};
  res.inbox = []; res.negeer = []; res.catRows = {};
  rows.forEach(r => {
    const c = classify(r); const b=r[2];
    if(c.type==="negeer"){ res.negeer.push(r); return; }
    if(b<0 && c.inbox) res.inbox.push(r);
    if(b>0) res.inTot+=b; else res.uitTot+=-b;
    if(b<0){
      res.cats[c.cat]=(res.cats[c.cat]||0)+(-b);
      (res.catRows[c.cat] ||= []).push(r);
      if(c.type==="post"){ const e=res.posten.get(c.it.id)||{it:c.it,som:0,n:0,rows:[]}; e.som+=-b; e.n++; e.rows.push(r); res.posten.set(c.it.id,e); }
      else if(c.type==="boodschappen") res.boodschappen+=-b;
      else { res.variabel+=-b; res.varRows.push(r); }
    }
  });
  res.varRows.sort((x,y)=>x[2]-y[2]);
  // expected fixed costs in this window that were not found
  res.gemist = [];
  if(res.van && res.tot){
    S.posten.forEach(it => {
      if(it.categorie==="Boodschappen" || !keywordsOf(it).length) return;
      const occ = occurrences(it, res.van, res.tot);
      if(occ.length && !res.posten.has(it.id) && !occ.every(d=>{ const v=verwOf(it.id,d); return v && (v.status==="anders"||v.status==="gestopt"); })) res.gemist.push({it, d:occ[0]});
    });
    const weken = Math.max(1, (daysBetween(res.van,res.tot)+1)/7);
    const wk = S.posten.filter(p=>p.categorie==="Boodschappen").reduce((s,p)=>s+num(p.bedrag)*(p.freq==="week"?1:12/52),0);
    res.boodschappenBudget = wk*weken; res.weken=weken;
  }
  return res;
}

function normKey(s){
  return String(s||"").toLowerCase().replace(/[0-9*#:\/\\.,'"()&+_-]+/g," ").replace(/\s+/g," ").trim();
}
// stable id for one afschrijving: date, amount and a hash of name + omschrijving (survives re-uploading the same CSV)
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++) h=(((h<<5)+h)+s.charCodeAt(i))>>>0; return h.toString(36); }
function rowSig(r){ return "r"+String(r[0]).replace(/-/g,"")+"_"+Math.round(Math.abs(r[2])*100)+(r[2]<0?"a":"b")+"_"+hashStr(String(r[1]||"")+"|"+String(r[3]||"")); }
function findRow(sig){ for(const a of S.afschriften) for(const r of (a.rows||[])) if(rowSig(r)===sig) return {r, af:a}; return null; }
// one tappable afschrijving line (opens "Anders indelen")
function rowBtn(r, extra){ return `<button type="button" class="drow" data-herindeel="${esc(rowSig(r))}"><span>${dkort(parseIso(r[0]))} · ${esc(r[1]||"Onbekend")}${extra?` <span class="muted">${extra}</span>`:""}</span><b>${eur(-r[2])}</b></button>`; }
function keyFromRow(r){
  return normKey(r[1]||r[3]||"").split(" ").slice(0,3).join(" ").slice(0,28).trim();
}
function inboxGroups(an){
  // one entry per afschrijving: payments to the same party can have different purposes, so they are never merged
  return an.inbox.map(r => ({key: keyFromRow(r) || "onbekend", naam: r[1]||"Onbekend", rows:[r], som: -r[2]}))
    .sort((a,b)=> b.som-a.som);
}
// how many times a vaste last counts as planned on this afschrift: its due dates inside the window, plus payments that were
// actually made in the window for a due date just outside it (banks shift collection days around weekends and paydays)
function geplandN(it, an){
  const n = occurrences(it, an.van, an.tot).length;
  const e = an.posten && an.posten.get(it.id);
  if(!e || e.n<=n) return n;
  return Math.max(n, Math.min(e.n, occurrences(it, addDays(an.van,-10), addDays(an.tot,10)).length));
}
function geplandVsWerkelijk(an){
  const rows = {};
  const add = (c, k, v) => { rows[c] ||= {gepland:0, werkelijk:0}; rows[c][k]+=v; };
  S.posten.forEach(it => { if(it.categorie==="Boodschappen") return; const n=geplandN(it, an); if(n) add(it.categorie||"Overig","gepland",n*num(it.bedrag)); });
  an.posten.forEach(e => add(e.it.categorie||"Overig","werkelijk",e.som));
  add("Boodschappen","gepland",an.boodschappenBudget||0); add("Boodschappen","werkelijk",an.boodschappen);
  const dagen = daysBetween(an.van, an.tot)+1;
  add("Vrij besteedbaar","gepland", num(S.config.vrijBudget)*dagen/(365/12));
  add("Vrij besteedbaar","werkelijk", an.variabel);
  const list = Object.entries(rows).map(([c,v])=>({c, ...v, diff:v.werkelijk-v.gepland})).sort((a,b)=>b.gepland-a.gepland);
  return {list, gepland:list.reduce((s,x)=>s+x.gepland,0), werkelijk:list.reduce((s,x)=>s+x.werkelijk,0), dagen};
}

  });
  // statement signals for current period

    if(an.inbox.length) A.push({lvl:"warn", t:an.inbox.length+" afschrijving"+(an.inbox.length>1?"en":"")+" nog in te delen", s:"Op het afschrift staan uitgaven die ik niet kan koppelen. Deel ze in bij Afschrift, dan reken ik ze goed mee."});
    if(an.boodschappenBudget && an.boodschappen > an.boodschappenBudget*1.1) A.push({lvl:"warn", t:"Boodschappen "+eur0(an.boodschappen-an.boodschappenBudget)+" boven budget", s:eur0(an.boodschappen)+" uitgegeven tegen "+eur0(an.boodschappenBudget)+" gepland in deze periode."});
  }

}
function currentAfschrift(){
  const p = periodN(0);
  return S.afschriften.filter(a=>{ const v=parseIso(a.van), t=parseIso(a.tot); return v && t && t>=p.start && v<=p.end; }).sort((a,b)=>a.tot<b.tot?1:-1)[0] || null;
}

// ---------- spending this period ----------
function matchesRow(u, af){
  if(!af) return false;
  const d=parseIso(u.datum), v=parseIso(af.van), t=parseIso(af.tot);
  if(!d || d<v || d>t) return false;
  return (af.rows||[]).some(r => Math.abs(-r[2]-num(u.bedrag))<0.011 && Math.abs(daysBetween(parseIso(r[0]),d))<=5);
}
// vrij besteedbaar deze periode: marge + vast sparen − wat naar doelen gaat − wat gereserveerd wordt voor geplande
// uitgaven + geplande uitgaven (bron plan) die in deze periode vallen (dat geld is ervoor opzij gezet)
function opzijNu(plan){ return plan.items.reduce((s,it)=>s+it.dezeMaand,0) + plan.months[0].reserve; }
// Call with the plan without extra spending. Uses the income as it arrived. A shortfall (income below vaste lasten + vrij budget)
// counts as tekort, not as a smaller vrij budget, so overspending is measured against the budget and the shortfall is not counted twice.
function vrijNu(plan, cur){ const m = plan.months[0]; return cur.marge + inkomenNu().kas + cur.sparen - opzijNu(plan) + m.uitbetaal + (m.tekortUit||0); }
function spending(p){
  const af = currentAfschrift();
  const an = af ? analyseAfschrift(af) : null;
  const viaAf = an ? an.variabel + Math.max(0, an.boodschappen - (an.boodschappenBudget||0)) : 0;
  const hand = S.uitgaven.filter(u=>{ const d=parseIso(u.datum); return d && d>=p.start && d<=p.end; })
    .map(u=>Object.assign({}, u, {gedekt: matchesRow(u, af)})).sort((a,b)=>a.datum<b.datum?1:-1);
  const handOpen = hand.filter(u=>!u.gedekt).reduce((s,u)=>s+num(u.bedrag),0);
  // geplande uitgaven in deze periode tellen als uitgegeven tot ze op het afschrift staan (zelfde bedrag, ±5 dagen).
  // Bij bron "plan" komt het gereserveerde bedrag er via vrijNu weer bij, dus het vrije bedrag blijft gelijk.
  const gvrij = S.gepland.filter(g=>{ const d=parseIso(g.datum); return d && d>=p.start && d<=p.end; })
    .map(g=>Object.assign({}, g, {gedekt: g.status==="betaald" || (!!af && (af.rows||[]).some(r=>{ const d=parseIso(r[0]); return d>=p.start && d<=p.end && Math.abs(-r[2]-num(g.bedrag))<0.011; }))}));
  const gvrijOpen = gvrij.filter(g=>!g.gedekt).reduce((s,g)=>s+num(g.bedrag),0);
  return {af, an, viaAf, hand, handOpen, gvrij, gvrijOpen, totaal: viaAf + handOpen + gvrijOpen};
}
// per soort: werkelijk vs. plan (vaste lasten, boodschappen) of vs. vorige afschrift (losse uitgaven), met de posten erin
function detailPerSoort(sp){
  const cats = {};
  const get = c => cats[c] ||= {c, som:0, rows:[]};
  if(sp.af){
    (sp.af.rows||[]).forEach(r => { if(r[2]>=0) return; const k=classify(r); if(k.type==="negeer") return;
      const g=get(k.cat); g.som+=-r[2]; g.rows.push({d:r[0], naam:r[1]||"Onbekend", b:-r[2], meta:r[3]||"", r, k}); });
  }
  sp.hand.filter(u=>!u.gedekt).forEach(u => { const g=get(u.categorie||"Overig"); g.som+=num(u.bedrag); g.rows.push({d:u.datum, naam:u.naam, b:num(u.bedrag), meta:"zelf ingevoerd", uid:u.id}); });
  const gepland = {};
  let prev = null, factor = 1;
  if(sp.an && sp.an.van && sp.an.tot){
    S.posten.forEach(it => { if(it.categorie==="Boodschappen") return; const n=geplandN(it, sp.an); if(n) gepland[it.categorie||"Overig"]=(gepland[it.categorie||"Overig"]||0)+n*num(it.bedrag); });
    if(sp.an.boodschappenBudget) gepland["Boodschappen"] = sp.an.boodschappenBudget;
    const pa = S.afschriften.filter(a=>a.id!==sp.af.id && a.tot && a.tot < sp.af.van).sort((a,b)=>a.tot<b.tot?1:-1)[0];
    if(pa){ prev = analyseAfschrift(pa); const dn=daysBetween(sp.an.van,sp.an.tot)+1, dp=daysBetween(prev.van,prev.tot)+1; factor = dp>0 ? dn/dp : 1; }
  }
  Object.keys(gepland).forEach(c=>get(c));
  const list = Object.values(cats).map(g => {
    let ref=null, refT="";
    if(gepland[g.c]!=null){ ref=gepland[g.c]; refT="gepland"; }
    else if(prev && prev.cats[g.c]!=null){ ref=prev.cats[g.c]*factor; refT="vorige periode"; }
    else if(prev){ ref=0; refT="vorige periode"; }
    // per afschrijving: was this one expected, and for the right amount? (only where a plan exists: vaste lasten)
    g.rows.forEach(x => {
      x.flag = null;
      if(refT!=="gepland" || g.c==="Boodschappen") return;
      if(x.k && x.k.type==="post" && x.k.it){ const exp=num(x.k.it.bedrag); if(x.b-exp>0.5){ x.flag="hoger"; x.exp=exp; x.extra=x.b-exp; } }
      else x.flag="onverwacht";
    });
    const rank = x => x.flag==="hoger"?0 : x.flag==="onverwacht"?1 : 2;
    g.rows.sort((a,b)=> rank(a)-rank(b) || b.b-a.b);
    g.nHoger = g.rows.filter(x=>x.flag==="hoger").length; g.nOnv = g.rows.filter(x=>x.flag==="onverwacht").length;
    return Object.assign(g, {ref, refT, diff: ref==null? null : g.som-ref});
  });
  list.sort((a,b)=> (b.diff??-1e9)-(a.diff??-1e9) || b.som-a.som);
  return {list, prev, heeftAf: !!sp.af};
}

  { const fab=$("#fab"), mag=Z("ov.kandit"); if(fab) fab.hidden=!mag; $(".tabs .row").style.setProperty("--ntabs", Math.max(1,tabs.length+(mag?1:0))); }

const isSparenPost = it => !!it && it.categorie==="Sparen";
// what an item needs in period n to stay on schedule (same pace rule as the planner)
function tempoNodig(it, rest, n, months){
  if(!(rest>0.005) || !months[n]) return 0;
  let need = 0;
  if(it.deadline){
    let left = 0; for(let k=n;k<months.length;k++){ left++; if(months[k].p.end >= it.deadline) break; }
    need = it.deadline < months[n].p.start ? rest : rest/Math.max(1,left);
    if(it.vast>0) need = Math.max(need, it.vast);
  } else need = it.vast||0;
  return Math.min(need, rest);
}
// per item: open amount, what it needs and gets this period (n=0) and next period (n=1), in the planner's order
function planRegels(plan){
  const kr = it => it.kind==="extra" ? 0 : 1, far = new Date(9999,0);
  return plan.items.map(it => {
    const rest0 = it.kind==="doel" ? Math.max(0, num(it.src.bedrag)-num(it.src.gespaard)) : Math.max(0, num(it.src.bedrag)-num(it.src.betaald));

function geldstroom(plan, cur){

  const V = vast.reduce((s,x)=>s+x.bedrag,0), Vb = vast.filter(x=>x.d<=TODAY).reduce((s,x)=>s+x.bedrag,0);

  let pos = inn.ink.filter(x=>x.d<=TODAY).reduce((s,x)=>s+x.bedrag,0) + inn.extra - cur.uit.filter(x=>x.d<=TODAY).reduce((s,x)=>s+x.bedrag,0) - U;

  if(an) an.varRows.forEach(r => { const c = classify(r).cat; soorten[c] = (soorten[c]||0) - r[2]; });

      <div class="rows">${betaald.map(x=>`<div class="row"><span class="d">${dkort(x.d)}</span><span class="n">${esc(x.it.naam)}${gemist.has(x.it.id)?`<small class="wtxt">niet op het afschrift gevonden</small>`:""}</span><span class="a">${eur(x.bedrag)}</span></div>`).join("")}</div></details>
  </section>`;

  // ---- next month ----
  const r1 = (l, v, cls) => `<div class="wf"><span>${l}</span><b class="${cls||""}">${v}</b></div>`;
  const tekort1 = m1.tekortUit||0;
  const volgCard = `<section class="card c3"><div class="h3row"><h2>Volgende maand</h2><span class="sub3">${dkort(m1.p.start)} – ${dkort(m1.p.end)}</span></div>
    <div class="wfall">
      ${r1("Inkomsten (ingesteld)", eur0(pc1.I))}
      ${r1("Vaste lasten", "− "+eur0(V1))}
      ${r1("Vrij besteedbaar", "− "+eur0(vrijCfg))}
      ${m1.extraIn>0.5 ? r1("Verwachte meevallers", "+ "+eur0(m1.extraIn)) : ""}
      ${m1.tekortIn>0.5 ? r1("Tekort van deze maand", "− "+eur0(m1.tekortIn), "neg") : ""}
      ${m1.reserve>0.5 ? r1("Gereserveerd voor geplande uitgaven", "− "+eur0(m1.reserve)) : ""}
      <div class="wf tot"><span>Voor terugbetalingen en doelen</span><b>${eur0(m1.beschikbaar)}</b></div>
    </div>
    ${tekort1>0.5 ? `<div class="vd3 bad">${v3status("bad")}<div><b>Ook volgende maand ${eur0(tekort1)} tekort</b><small>Dat schuift door naar de maand erna.</small></div></div>` : ""}
    <div class="rows">${regels.filter(r=>r.nodig1>0.5 || r.krijgt1>0.5).map(r=>{ const kort = r.nodig1 - r.krijgt1; const cls = kort<0.5 ? "good" : r.krijgt1<0.5 ? "bad" : "warn";
      return `<div class="row al3"><span class="n">${esc(r.it.naam)}<small>${r.it.kind==="extra"?"terugbetaling":"spaardoel"}${r.it.deadline?" · vóór "+dkort(r.it.deadline):""}</small></span><span class="a"><span>${eur0(r.krijgt1)}${r.nodig1>0.5?` <small>van ${eur0(r.nodig1)}</small>`:""}</span>${v3chip(cls, kort<0.5?(r.nodig1>0.5?"Op tijd":"Extra"):r.krijgt1<0.5?"Niets":eur0(kort)+" te weinig")}</span></div>`; }).join("") || `<p class="hint">Geen open terugbetalingen of doelen.</p>`}</div>
    <p class="hint">Gerekend met de ingestelde inkomsten. Eerst terugbetalingen, dan spaardoelen, en ervan uitgaande dat wat deze maand opzij gaat ook echt opzij gezet wordt.</p>
    ${A("pl.meevallers") ? `<button type="button" class="btn sm ghost" data-verwacht>+ Verwacht: extra inkomsten of uitgave</button>` : ""}
  </section>`;

  return `${Z("ov.besteedbaar") ? hero : ""}

  ${Z("ov.advies") ? slimsteKaart() : ""}
  ${Z("ov.letop") ? todoCard : ""}

}
