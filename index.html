  TL.rows = [...app.querySelectorAll(".tl-day[data-tli]")].map(el => {
    const datum = el.querySelector(".tl-date b") || el;
    const pts = [...el.querySelectorAll("[data-tlp]")].map(e => { const a = e.querySelector(".tl-a") || e; return {el:e, top:tlOnder(a), v:TL.evVals[+e.dataset.tlp]}; });
    const top = tlOnder(datum), bals = el.querySelectorAll(".tl-bal");
    return {el, top, i:+el.dataset.tli, pts, endTop: pts.length && bals.length ? tlOnder(bals[bals.length-1]) : top};
  });
  const end = $("#tlEnd"), last = TL.rows[TL.rows.length-1];
  // ruimte onder de lijst alleen als het nodig is om ook het eind van de laatste dag boven de balk te krijgen
  if(end && last){ end.style.height = "0px"; const max = document.documentElement.scrollHeight - window.innerHeight, nodig = last.endTop - tlLijn() + 4; end.style.height = Math.max(0, Math.ceil(nodig - max))+"px"; }
  tlScroll();
}
function tlScroll(){
  const head = $("#tlHead"); if(!head || !TL.rows.length) return;
  const lijn = window.scrollY + tlLijn();
  let lo = -1; for(let a=0,b=TL.rows.length-1; a<=b;){ const m=(a+b)>>1; if(TL.rows[m].top<=lijn){ lo=m; a=m+1; } else b=m-1; }
  // binnen een dag: na elke boeking die de leeslijn passeert de stand daarna; voorbij de laatste boeking de stand aan het eind van de dag
  let v = null, pt = -1, label = "";
  if(lo>=0){
    const row = TL.rows[lo], i = row.i;
    if(lijn >= row.endTop){ v = TL.vals[i]; label = lo===0 ? "Eind van vandaag" : "Eind van de dag"; }
    else { v = i>0 ? Object.assign({}, TL.vals[i-1], {q:TL.vals[i].qb}) : TL.nu; label = "Begin van de dag";
      row.pts.forEach((p,k) => { if(p.top <= lijn){ v = p.v; pt = k; label = "Na "+p.v.naam; } }); }
    v = Object.assign({}, v, {d:TL.vals[i].d});
  }
  const key = lo+":"+pt+":"+(v&&label);
  if(key===TL.shown) return;
  TL.shown = key;
  app.querySelectorAll(".tl-day.on,.tl-ev.on").forEach(e=>e.classList.remove("on"));
  if(lo>=0){ TL.rows[lo].el.classList.add("on"); if(pt>=0) TL.rows[lo].pts[pt].el.classList.add("on"); }
  const d = $("#tlD"), tag = $("#tlTag"), cur = $("#tlCur");
  if(d) d.textContent = v ? label+" · "+dkort(v.d) : "Nu · "+dkort(TODAY);
  if(tag){ const ld = v ? daysBetween(TODAY, v.d) : 0; tag.textContent = v ? (ld===0 ? "vandaag" : `over ${ld} ${ld===1?"dag":"dagen"}`) : tag.dataset.nu; }
  if(cur){ const x = v ? TL.X(TL.rows[lo].i) : 0; cur.setAttribute("x1", x.toFixed(1)); cur.setAttribute("x2", x.toFixed(1)); }
  tlTween(v ? v.s : TL.nu.s, v ? v.q : TL.nu.q);
}
function tlTween(s, q){
  const elS = $("#tlS"), elQ = $("#tlQ"), van = TL.cur || {s, q};
  cancelAnimationFrame(TL.anim);
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const t0 = performance.now(), dur = reduce ? 0 : 220;
  const stap = now => { const f = dur ? Math.min(1, (now-t0)/dur) : 1, e = 1-Math.pow(1-f,3);
    const vs = van.s + (s-van.s)*e, vq = van.q + (q-van.q)*e;
    if(elS){ elS.textContent = eur(vs); elS.classList.toggle("neg", vs<-0.5); }
    if(elQ){ elQ.textContent = eur(vq); elQ.classList.toggle("neg", vq<-0.5); }
    TL.cur = {s:vs, q:vq};
    if(f<1) TL.anim = requestAnimationFrame(stap); };
  if(!dur) return stap(t0);   // zonder animatie meteen de eindstand
  TL.anim = requestAnimationFrame(stap);
}
function bindTijdlijn(){
  TL.shown = null; TL.cur = null;
  const sp = $("#tlSpark");
  if(sp) sp.onclick = e => { const r = sp.getBoundingClientRect(), i = Math.round((e.clientX - r.left)/r.width*(TL.n-1));
    const row = TL.rows.find(x=>x.i===Math.max(0,Math.min(TL.n-1,i))); if(!row) return;
    // de hele dag komt net boven de balk te staan: de balk toont dan de stand aan het eind van die dag (= het punt in de grafiek)
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({top: Math.max(0, row.endTop - tlLijn() + 2), behavior: reduce ? "auto" : "smooth"}); };
  requestAnimationFrame(tlMeet);
}
window.addEventListener("scroll", ()=>{ if(S.tab==="tijdlijn") tlScroll(); }, {passive:true});
window.addEventListener("resize", ()=>{ if(S.tab==="tijdlijn") tlMeet(); });

// ================== Eén potje: de rekening (15 okt) ==================
// Alles rekent vanaf wat er echt op de rekening staat. Wordt het krap, dan is de volgorde:
//   1 rekeningen (vaste lasten, afbetalingen, creditcard)  →  2 terugbetalingen  →  3 vrij besteden  →
//   4 sparen (geplande aankopen van plan-geld, automatisch sparen, spaardoelen).
// Elke betaling uit het plan is een boeking op een datum (de betaaldag van dat doel). Op die dag gaat hij alleen af als hij
// past zonder dat iets met meer voorrang (ook later, tot het einde van de volgende loonperiode) niet meer betaald kan worden.
// Past hij niet of maar deels, dan staat er een geel blok. Wat niet betaald wordt, blijft openstaan en schuift in het plan door.

// ---------- betaaldag ----------
function standaardBetaaldag(){ const inks = S.inkomsten.slice().sort((a,b)=>num(b.bedrag)-num(a.bedrag)); return inks.length ? Math.max(1, Math.min(31, Math.round(num(inks[0].dag))||1)) : Math.max(1, Math.min(28, Math.round(num(S.config.loondag))||25)); }
function betaaldag(src){ const d = Math.round(num(src && src.dag)); return d>=1 && d<=31 ? d : standaardBetaaldag(); }
// de datum in loonperiode p waarop deze betaling hoort; valt de deadline eerder in die periode, dan de deadline
function betaalDatum(src, p, deadline){
  const d = occurrences({freq:"maand", dag:betaaldag(src)}, p.start, p.end)[0] || p.start;
  return deadline && deadline>=p.start && deadline<d ? deadline : d;
}

// ---------- afvinken: planbetaling/<sleutel> ----------
const pbKey = (kind, id, p) => (kind==="doel"?"d":"x")+"_"+id+"_"+iso(p.start).replace(/-/g,"");
function pbRecord(kind, id, p){ return (S.planbet||[]).find(r=>r.id===pbKey(kind,id,p)) || null; }
function planItemsAll(){ return S.extras.filter(x=>x.richting!=="in").map(x=>({kind:"extra", src:x})).concat(S.doelen.map(x=>({kind:"doel", src:x}))); }

// ---------- betalingen uit het plan op het afschrift ----------
// Een afschrijving hoort bij een terugbetaling of spaardoel als jullie hem zo hebben ingedeeld (Anders indelen) of als een
// zoekwoord van dat doel in de naam of omschrijving staat. Zulke afschrijvingen tellen niet als losse uitgave.
function planMatch(row, hit){
  const b = row[2]; if(!(b<0)) return null;
  const its = planItemsAll().filter(x => keywordsOf(x.src).some(hit));
  if(!its.length) return null;
  // een vaste last met hetzelfde bedrag en een passend zoekwoord gaat voor (bijv. automatisch sparen)
  const pm = closest(S.posten.filter(p=>keywordsOf(p).some(hit)), -b); if(pm && Math.abs(num(pm.bedrag)+b)<0.011) return null;
  return its[0];
}
let PG = {key:null, val:null};
function planGevonden(){
  const key = [S.afschriften, S.extras, S.doelen, S.herind, S.posten, S.regels, S.config];
  if(PG.key && PG.key.every((v,i)=>v===key[i])) return PG.val;
  const m = new Map(), seen = new Set();
  S.afschriften.forEach(a => (a.rows||[]).forEach(r => {
    if(!(r[2]<0)) return; const sig = rowSig(r); if(seen.has(sig)) return; seen.add(sig);
    const c = classify(r); if(!c.plan) return; const d = parseIso(r[0]); if(!d) return;
    const k = pbKey(c.plan.kind, c.plan.src.id, {start:periodStartFor(d)});
    const e = m.get(k) || m.set(k, {som:0, rows:[]}).get(k); e.som += -r[2]; e.rows.push(r);
  }));
  PG = {key, val:m}; return m;
}
// per doel of terugbetaling: wat er in periode p al is gebeurd (afgevinkt, of gevonden op het afschrift)
function besluiten(p){
  const m = new Map(), pg = planGevonden();
  planItemsAll().forEach(({kind, src}) => {
    const rec = pbRecord(kind, src.id, p), f = pg.get(pbKey(kind, src.id, p));
    if(rec) m.set(src.id, {x:num(rec.betaald), status:rec.status, rec, found:f||null, kind});
    else if(f && f.som>0.005) m.set(src.id, {x:Math.round(f.som*100)/100, status:"afschrift", found:f, kind});
  });
  return m;
}

// ---------- planner: 36 loonperiodes vooruit, in de volgorde van het potje ----------
// Per periode: inkomsten − rekeningen (+ verwachte meevallers − tekort van de vorige periode) =
//   1 terugbetalingen op tempo  →  2 vrij budget  →  3 automatisch sparen, reserveringen voor geplande aankopen, spaardoelen
//   op tempo  →  4 wat overblijft: eerst terugbetalingen, dan spaardoelen (op prioriteit).
// pin0/pin1: bedragen die voor deze of volgende periode al vaststaan (afgevinkt, op het afschrift, of door de geldlijn bepaald);
// vast0/vast1: die periode krijgt alleen de vastgestelde bedragen.
function planBasis(){
  const p0 = periodN(0), items = [];
  const add = (kind, x) => {
    const rec = pbRecord(kind, x.id, p0), R0 = rec ? num(rec.betaald) : 0;
    const tot = num(x.bedrag), al = kind==="doel" ? num(x.gespaard) : num(x.betaald);
    items.push({id:x.id, kind, naam:x.naam, totaal:tot, rest:Math.max(0, tot-al+R0), restNu:Math.max(0, tot-al), deadline:parseIso(kind==="doel"?x.datum:x.deadline), prio:+x.prio||3, vast:num(x.maandbedrag), src:x});
  };
  S.extras.filter(x=>x.richting!=="in" && (x.status!=="betaald" || pbRecord("extra",x.id,p0))).forEach(x=>add("extra",x));
  S.doelen.forEach(x=>add("doel",x));
  return items;
}
const ordePlan = (a,b) => ((a.kind==="extra"?0:1)-(b.kind==="extra"?0:1)) || (a.prio-b.prio) || ((a.deadline||new Date(9999,0))-(b.deadline||new Date(9999,0)));
function gewoneMaand(plan){ return plan.months.slice(2).find(m=>m.tekortIn<0.5) || plan.months[2] || plan.months[plan.months.length-1]; }
function buildPlan(opts){
  opts = opts || {};
  const pins = [opts.pin0||null, opts.pin1||null], vast = [!!opts.vast0, !!opts.vast1], res = [opts.res0||null, opts.res1||null];
  const items = planBasis();
  const vrijCfg = Math.max(0, num(S.config.vrijBudget));
  const inn = inkomenNu();
  const gAll = geplandItems(opts.extraGepland);
  const months = []; let carry = 0;
  // deze periode is al (deels) uitgegeven: wat boven het vrije budget ging, was er niet meer voor het plan
  const over0 = Math.max(0, vrijUitgegeven(spending(periodN(0))).U - vrijCfg);
  for(let n=0;n<36;n++){
    const pc = periodCalc(periodN(n)), p = pc.p;
    let extraIn = 0;
    S.extras.filter(x=>x.richting==="in" && x.status==="verwacht").forEach(x => { const dl = parseIso(x.deadline); if(dl ? (dl>=p.start && dl<=p.end) || (n===0 && dl<p.start) : n===1) extraIn += num(x.bedrag); });
    const I = pc.I + (n===0 ? inn.meer : 0), SP = pc.sparen, Vrek = pc.V - SP;
    const geplVrij = gAll.filter(x=>x.bron==="vrij" && x.n===n && x.g.status!=="betaald").reduce((s,x)=>s+x.bedrag,0);
    if(n===1 && vast[0]) carry = 0;                                    // volgt deze periode de geldlijn, dan rekent die ook het echte tekort door
    if(n===2 && opts.kas2!=null) carry = Math.max(0, -opts.kas2);   // na twee periodes geldlijn: echt tekort, niet het maand-tekort
    const raw = I - Vrek + extraIn - carry - (n===0 ? over0 : 0);
    months.push({p, n, I, Vrek, SP, extraIn, marge:I-Vrek, tekortIn:carry, overUit: n===0 ? over0 : 0, basis:Math.max(0,raw), avail:Math.max(0,raw), vrijCfg:Math.max(vrijCfg, geplVrij),
      terug:0, vrij:0, spp:0, reserve:0, doel:0, over:0, uitbetaal:0, sparenGeld:0});
    carry = Math.max(0, -raw); months[n].tekortUit = carry;
  }
  const gepl = gAll.filter(x=>x.bron==="plan" && x.n!==null && x.n>=0 && x.n<36);
  // aankopen van plan-geld: reserveren in de periodes vóór de aankoop. Volgen deze en volgende periode de geldlijn (vast),
  // dan begint het reserveren pas in periode 2; een aankoop in deze of volgende periode zit al in de geldlijn.
  const vanaf = vast[0] && vast[1] ? 2 : vast[0] ? 1 : 0;
  gepl.forEach(x => { x.alloc = new Array(36).fill(0); x.tekort = 0; x.van = Math.max(vanaf, x.n-x.k+1); x.deel = x.n>=vanaf ? x.bedrag/(x.n-x.van+1) : 0; });
  items.forEach(it => { it.alloc = new Array(36).fill(0); it.done = null; });
  const pace = (it, n, mo) => {
    if(it.deadline){ let left = 0; for(let k=n;k<months.length;k++){ left++; if(months[k].p.end >= it.deadline) break; }
      let need = it.deadline < mo.p.start ? it.rest : it.rest/Math.max(1,left); if(it.vast>0) need = Math.max(need, it.vast); return Math.min(need, it.rest); }
    return Math.min(it.vast||0, it.rest);
  };
  const geef = (it, n, mo, x) => { x = Math.max(0, Math.min(x, it.rest, mo.avail)); it.rest -= x; it.alloc[n] += x; mo.avail -= x; return x; };
  months.forEach((mo, n) => {
    const pin = pins[n] || null, alleenVast = n<2 && vast[n];
    if(pin) items.forEach(it => { if(!pin.has(it.id)) return; const x = Math.max(0, Math.min(pin.get(it.id), it.rest)); it.rest -= x; it.alloc[n] += x;
      const r = res[n] && res[n].has(it.id) ? Math.max(x, res[n].get(it.id)) : x; mo.avail = Math.max(0, mo.avail-r); if(it.kind==="extra") mo.terug += x; else mo.doel += x; });
    if(alleenVast) mo.avail = 0;   // geen papieren geld: wat er deze en volgende periode kan, staat in de pins (uit de geldlijn)
    const open = items.filter(it => it.rest>0.005 && !(pin && pin.has(it.id)) && !alleenVast);
    open.filter(it=>it.kind==="extra" && (it.deadline||it.vast>0)).sort(ordePlan).forEach(it => { mo.terug += geef(it, n, mo, pace(it, n, mo)); });
    mo.vrij = Math.min(mo.vrijCfg, mo.avail); mo.avail -= mo.vrij;
    mo.spp = Math.min(mo.SP, mo.avail); mo.avail -= mo.spp;
    mo.sparenGeld = mo.avail;
    gepl.filter(x => x.n>=vanaf && n>=x.van && n<=x.n).sort((a,b)=>a.n-b.n).forEach(x => { const r = Math.min(x.deel, mo.avail); mo.avail -= r; mo.reserve += r; x.alloc[n] = r; x.tekort += x.deel - r; });
    gepl.filter(x => x.n===n).forEach(x => { mo.uitbetaal += x.bedrag; });
    open.filter(it=>it.kind==="doel" && (it.deadline||it.vast>0)).sort(ordePlan).forEach(it => { mo.doel += geef(it, n, mo, pace(it, n, mo)); });
    if(!alleenVast){
      const groepen = [...new Set(open.map(it=>(it.kind==="extra"?0:1)*100+it.prio))].sort((a,b)=>a-b);
      for(const gk of groepen){
        if(mo.avail<=0.005) break;
        let grp = open.filter(it=>(it.kind==="extra"?0:1)*100+it.prio===gk && it.rest>0.005);
        while(grp.length && mo.avail>0.005){
          const share = mo.avail/grp.length; let used = 0;
          grp.forEach(it => { const g = Math.min(share, it.rest); it.rest -= g; it.alloc[n] += g; used += g; if(it.kind==="extra") mo.terug += g; else mo.doel += g; });
          mo.avail -= used; grp = grp.filter(it=>it.rest>0.005);
          if(used<0.005) break;
        }
      }
    }
    mo.over = alleenVast ? 0 : mo.avail;   // deze en volgende periode: de geldlijn bepaalt wat er echt is, geen papieren rest
    mo.beschikbaar = mo.terug + mo.doel + mo.reserve + mo.over;
    items.forEach(it => { if(it.done===null && it.rest<=0.005 && (it.alloc[n]>0 || n===0)) it.done = n; });
  });
  items.forEach(it => {
    it.klaar = it.done===null ? null : months[it.done].p;
    it.klaarDatum = it.klaar ? it.klaar.end : null;
    if(!it.deadline) it.status = it.klaar ? "ok" : "nooit";
    else if(!it.klaar) it.status = "laat";
    else it.status = it.klaar.start <= it.deadline ? "ok" : "laat";
    it.dezeMaand = it.alloc[0];
  });
  return {items, months, gepl};
}

// ---------- uitgegeven van het vrije budget deze periode ----------
// losse uitgaven op het afschrift + zelf ingevoerde uitgaven die (nog) niet op het afschrift staan + geplande uitgaven van het
// vrije budget met een datum t/m vandaag die nog niet betaald zijn. Een afschrijving die precies een geplande aankoop van
// plan-geld is, telt niet als losse uitgave.
function vrijUitgegeven(sp){
  const p = periodN(0);
  let planRijen = 0;
  if(sp.an){ const gebruikt = new Set();
    S.gepland.filter(g => g.bron!=="vrij" && (()=>{ const d=parseIso(g.datum); return d && d>=p.start && d<=p.end; })()).forEach(g => {
      const r = sp.an.varRows.find(r => !gebruikt.has(r) && Math.abs(-r[2]-num(g.bedrag))<0.011); if(r){ gebruikt.add(r); planRijen += -r[2]; } }); }
  const viaAf = Math.max(0, sp.viaAf - planRijen);
  const geplVoorbij = sp.gvrij.filter(g => g.bron==="vrij" && !g.gedekt && parseIso(g.datum)<=TODAY).reduce((s,g)=>s+num(g.bedrag),0);
  return {U: viaAf + sp.handOpen + geplVoorbij, viaAf, hand:sp.handOpen, geplVoorbij};
}

// ---------- de geldlijn: dag voor dag van vandaag t/m het einde van de volgende loonperiode ----------
// o.W0 / o.W1: per doel of terugbetaling wat het plan deze en volgende periode wil betalen (Map id → bedrag);
// o.items: de items van het plan; o.extra: {bedrag, lvl, naam} voor "Kan dit?" (een uitgave vandaag).
function geldlijn(o){
  o = o || {};
  const p0 = periodN(0), p1 = periodN(1), eind = p1.end, N = daysBetween(TODAY, eind)+1;
  const ix = d => daysBetween(TODAY, d);
  const inn = inkomenNu(), cur = periodCalc(p0), pc1 = periodCalc(p1), sd = standNu(p0);
  const sp = o.sp || spending(p0), vu = vrijUitgegeven(sp);
  const vrijCfg = Math.max(0, num(S.config.vrijBudget));
  const itemById = new Map((o.items||[]).map(it=>[it.id, it]));
  const E = [];
  const push = e => { e.i = ix(e.d); if(e.i<0 || e.i>=N) return null; E.push(e); return e; };
  // 0 inkomsten
  inn.ink.filter(x=>x.d>TODAY && x.bedrag>0).forEach(x=>push({d:x.d, lvl:0, soort:"in", naam:x.it.naam, amt:x.bedrag, sub:"inkomsten · verwacht", edit:"inkomsten:"+x.it.id, perm:"vl.inkomsten"}));
  pc1.ink.forEach(x=>push({d:x.d, lvl:0, soort:"in", naam:x.it.naam, amt:x.bedrag, sub:"inkomsten · zoals ingesteld", edit:"inkomsten:"+x.it.id, perm:"vl.inkomsten"}));
  const binnen = new Set(inn.mvBinnen.map(x=>x.v.id));
  S.extras.filter(x=>x.richting==="in" && x.status==="verwacht" && !binnen.has(x.id)).forEach(x => { const dl = parseIso(x.deadline), b = num(x.bedrag);
    if(dl && dl>TODAY && dl<=eind && b>0) push({d:dl, lvl:0, soort:"mee", naam:x.naam, amt:b, sub:"verwachte meevaller", edit:"extras:"+x.id, perm:"pl.meevallers"}); });
  // 1 rekeningen
  const laatste = (it, d) => { const e = parseIso(it.einddatum); return !!e && occurrences(it, addDays(d,1), e).length===0; };
  const rek = x => { const schuld = isSchuldPost(x.it), last = laatste(x.it, x.d);
    push({d:x.d, lvl:1, soort: schuld?"schuld":"vast", naam:x.it.naam, wens:x.bedrag, it:x.it, sub:(schuld?"afbetaling":(x.it.categorie||"vaste last"))+(last?" · laatste termijn":""), edit:"posten:"+x.it.id, perm:"vl.uitgaven"}); };
  cur.uit.filter(x=>x.d>TODAY && !isSparenPost(x.it)).forEach(rek);
  pc1.uit.filter(x=>!isSparenPost(x.it)).forEach(rek);
  let ccNa = null;
  if(sd && (sd.ccPeriode || sd.ccNaLoondag)){
    if(sd.ccD<=eind) push({d:sd.ccD, lvl:1, soort:"cc", naam:"Creditcard", wens:sd.cc, sub:"ingevuld bij het saldo", saldo:true});
    else ccNa = {d:sd.ccD, cc:sd.cc};
  }
  // "Kan dit?": een uitgave vandaag, met de voorrang die bij de vraag hoort
  if(o.extra) push({d:TODAY, lvl:o.extra.lvl, soort:"kandit", naam:o.extra.naam||"Deze uitgave", wens:o.extra.bedrag});
  // 2 terugbetalingen en 4 spaardoelen, op hun betaaldag
  [[p0,0,o.W0],[p1,1,o.W1]].forEach(([p,n,W]) => (W||new Map()).forEach((w,id) => {
    const it = itemById.get(id); if(!it || !(w>0.005)) return;
    const oorspr = betaalDatum(it.src, p, it.deadline); const laat = oorspr<TODAY;
    push({d: laat ? TODAY : oorspr, lvl: it.kind==="extra" ? 2 : 4, soort: it.kind==="extra" ? "terug" : "doel", naam:it.naam, wens:Math.round(w*100)/100, prio:it.prio,
      plan:{it, n, p, oorspr, laat, key:pbKey(it.kind, it.id, p)}, edit:(it.kind==="doel"?"doelen:":"extras:")+it.id, perm:"pl.doelen"});
  }));
  // geplande uitgaven na vandaag: van het vrije budget (3) of van plan-geld (4)
  const gedekt = new Set(sp.gvrij.filter(x=>x.gedekt).map(x=>x.id)), nuMk = [];
  S.gepland.forEach(g => { const d = parseIso(g.datum), b = num(g.bedrag); if(!d || g.status==="betaald" || gedekt.has(g.id) || !(b>0)) return;
    if(d<=TODAY){ if(d>=p0.start) nuMk.push({d, naam:g.naam, bedrag:b, soort:"gepl", mark:true, edit:"gepland:"+g.id, perm:"pl.meevallers", sub:`gepland op ${dkort(d)}, nog niet als betaald gemarkeerd. Staat hij op de rekening, zet hem dan op Betaald.`}); return; }
    push({d, lvl: g.bron==="vrij" ? 3 : 4, soort:"gepl", naam:g.naam, wens:b, bron:g.bron, gid:g.id, sub: g.bron==="vrij" ? "geplande uitgave · vrij budget" : "geplande aankoop · plan-geld", edit:"gepland:"+g.id, perm:"pl.meevallers"}); });
  // 4 automatisch sparen (vaste lasten in categorie Sparen)
  cur.uit.filter(x=>x.d>TODAY && isSparenPost(x.it)).concat(pc1.uit.filter(x=>isSparenPost(x.it))).forEach(x =>
    push({d:x.d, lvl:4, soort:"sparen", naam:x.it.naam, wens:x.bedrag, it:x.it, sub:"automatisch sparen", edit:"posten:"+x.it.id, perm:"vl.uitgaven"}));
  // 3 vrij besteden: wat er van het budget over is, gelijk verdeeld over de dagen
  const geplVrij0 = E.filter(e=>e.soort==="gepl" && e.bron==="vrij" && e.d<=p0.end).reduce((s,e)=>s+e.wens,0);
  const geplVrij1 = E.filter(e=>e.soort==="gepl" && e.bron==="vrij" && e.d>=p1.start).reduce((s,e)=>s+e.wens,0);
  const extraVrij = o.extra && o.extra.lvl===3 ? o.extra.bedrag : 0;
  const rest0 = Math.max(0, vrijCfg - vu.U - geplVrij0 - extraVrij), rest1 = Math.max(0, vrijCfg - geplVrij1);
  const i0end = ix(p0.end), dagen0 = i0end+1, dagen1 = N - dagen0;
  for(let i=0;i<N;i++){ const in0 = i<=i0end, w = in0 ? rest0/Math.max(1,dagen0) : rest1/Math.max(1,dagen1); if(w>0.004) push({d:addDays(TODAY,i), lvl:3, soort:"vrij", naam:"Vrij besteden", wens:w, stil:true}); }
  // startstand
  let start;
  if(sd) start = sd.start;
  else {
    const besl = o.dec0 || new Map(); let planAl = 0; besl.forEach(v=>{ planAl += v.x; });
    const geplAl = S.gepland.filter(g => { const d=parseIso(g.datum); return d && d>=p0.start && d<=TODAY && !(g.bron==="vrij" && gedekt.has(g.id)); }).reduce((s,g)=>s+num(g.bedrag),0);
    start = inn.ink.filter(x=>x.d<=TODAY).reduce((s,x)=>s+x.bedrag,0) + inn.extra - cur.uit.filter(x=>x.d<=TODAY).reduce((s,x)=>s+x.bedrag,0) - vu.U + vu.geplVoorbij - planAl - geplAl;
  }
  // inkomsten en rekeningen vast; daarna per voorrang wat er nog past
  const B = new Array(N).fill(0); let run = start; const delta = new Array(N).fill(0);
  E.filter(e=>e.lvl<=1).forEach(e => { e.x = e.lvl===0 ? e.amt : e.wens; delta[e.i] += e.lvl===0 ? e.amt : -e.wens; });
  for(let k=0;k<N;k++){ run += delta[k]; B[k] = run; }
  const minVanaf = t => { let m = Infinity; for(let k=t;k<N;k++) if(B[k]<m) m = B[k]; return m===Infinity ? 0 : m; };
  const capBills = Math.max(0, minVanaf(0)), tekortRek = Math.max(0, -minVanaf(0));
  // laagste stand als alleen inkomsten en rekeningen meetellen; tekort per periode (samen = tekortRek)
  const laagIn = (a, b) => { let v = Infinity, i = a; for(let k=a;k<=b && k<N;k++) if(B[k]<v){ v = B[k]; i = k; } return v===Infinity ? {v:start, i:a, d:addDays(TODAY,a)} : {v, i, d:addDays(TODAY,i)}; };
  const i0e = ix(p0.end), laagRek = laagIn(0, N-1), laagRek0 = laagIn(0, i0e), laagRek1 = laagIn(i0e+1, N-1);
  const tekort0 = Math.max(0, -laagRek0.v), tekort1 = i0e+1<N ? Math.max(0, -laagRek1.v - tekort0) : 0;
  const zet = e => { const cap = Math.max(0, Math.floor(minVanaf(e.i)*100+1e-6)/100); e.x = Math.round(Math.min(e.wens, cap)*100)/100;
    if(e.x>0) for(let k=e.i;k<N;k++) B[k] -= e.x; e.status = e.x >= e.wens-0.005 ? "ok" : e.x>0.005 ? "deels" : "niet"; };
  const L = l => E.filter(e=>e.lvl===l);
  L(1.5).forEach(zet);
  L(2).sort((a,b)=>(a.prio-b.prio)||(a.i-b.i)).forEach(zet);
  const capTerug = Math.max(0, minVanaf(0));
  L(2.5).forEach(zet);
  L(3).sort((a,b)=>(a.i-b.i)||((a.soort==="kandit"?0:a.soort==="gepl"?1:2)-(b.soort==="kandit"?0:b.soort==="gepl"?1:2))).forEach(zet);
  const p4 = e => e.soort==="gepl" ? 0 : e.soort==="sparen" ? 1 : 10+(e.prio||3);
  L(4).sort((a,b)=>(p4(a)-p4(b))||(a.i-b.i)).forEach(zet);
  // dag voor dag, met de stand na elke boeking; vrij besteden telt aan het eind van de dag
  const ordeDag = e => e.lvl===0 ? 0 : e.lvl===1 ? 1 : e.soort==="kandit" ? 2 : e.lvl===2 ? 3 : e.lvl===3 && !e.stil ? 4 : e.lvl===4 ? 5 : 6;
  E.sort((a,b)=>(a.i-b.i)||(ordeDag(a)-ordeDag(b))||((b.amt||0)-(a.amt||0)));
  const days = []; let s = start, k = 0, laag = {v:start, i:0}, onder = null;
  for(let i=0;i<N;i++){
    const ev = []; let vrijX = 0, vrijW = 0;
    while(k<E.length && E[k].i===i){ const e = E[k++]; const amt = e.lvl===0 ? e.amt : -e.x; s += amt; e.na = s;
      if(e.lvl===1 && s < -0.5) e.risico = Math.min(e.wens, -s);
      if(e.stil){ vrijX += e.x; vrijW += e.wens; } else ev.push(e); }
    if(s < laag.v-0.005) laag = {v:s, i};
    if(!onder && s < -0.5) onder = {i, v:s};
    days.push({i, d:addDays(TODAY,i), ev, s, vrijX, vrijW, p: i<=i0end ? 0 : 1, loondag: i===i0end+1});
  }
  // vrij te besteden vanaf een dag t/m het einde van die periode
  for(let i=N-1;i>=0;i--){ const nxt = days[i+1]; days[i].vrijVanaf = days[i].vrijX + (nxt && nxt.p===days[i].p ? nxt.vrijVanaf : 0); }
  // totalen per periode (deze periode: vanaf vandaag)
  const per = [0,1].map(n => {
    const ev = E.filter(e => n===0 ? e.i<=i0end : e.i>i0end);
    const som = (f, k) => ev.filter(f).reduce((t,e)=>t+(e[k]||0),0);
    const plan = ev.filter(e=>e.plan);
    return {
      inkomsten: som(e=>e.lvl===0, "amt"),
      rek: {wens: som(e=>e.lvl===1, "wens"), risico: ev.filter(e=>e.risico>0.5), tekort: n===0 ? tekort0 : tekort1, laag: n===0 ? laagRek0 : laagRek1},
      terug: {wens: som(e=>e.lvl===2, "wens"), x: som(e=>e.lvl===2, "x"), ev: ev.filter(e=>e.lvl===2)},
      vrij: {budget: n===0 ? rest0 : rest1, x: som(e=>e.stil, "x"), wens: som(e=>e.stil, "wens"), vanaf: (days.find(d=>d.p===n && d.vrijX>0.005)||{}).d || null,
        gepl: ev.filter(e=>e.lvl===3 && e.soort==="gepl")},
      sparen: {wens: som(e=>e.lvl===4, "wens"), x: som(e=>e.lvl===4, "x"), ev: ev.filter(e=>e.lvl===4)},
      plan, problemen: plan.concat(ev.filter(e=>(e.soort==="sparen"||e.soort==="gepl") && e.lvl>=3)).filter(e=>e.status!=="ok"),
      eind: days[n===0 ? i0end : N-1].s
    };
  });
  return {start, sd, schatting:!sd, p0, p1, eind, N, E, days, per, nuMk, ccNa, capBills, capTerug, tekortRek, laagRek, laag, onder,
    vrijCfg, U:vu.U, vu, rest0, rest1, dagen0, dagen1, firstRisk: E.find(e=>e.risico>0.5) || null};
}

// ---------- alles in één keer: plan + geldlijn, zodat ze elkaar volgen ----------
// 1. Plan met wat al vaststaat → wat elk doel deze en volgende periode wil. 2. Geldlijn: wat er echt kan.
// 3. Plan opnieuw met wat er deze periode echt gaat → wat volgende periode nodig is. 4. Geldlijn opnieuw.
// 5. Plan met beide periodes vast → wanneer elk doel rond is. Staat de rekening aan het eind van de volgende periode in de min
//    (volgens de geldlijn), dan gaat dat eerst van de periode daarna af (kas2); een plus blijft als buffer staan.
function bereken(extraGl){
  const p0 = periodN(0), p1 = periodN(1), sp = spending(p0);
  const dec0 = besluiten(p0), dec1 = besluiten(p1);
  const vastMap = m => new Map([...m].map(([id,v])=>[id, v.x]));
  // bij "nee" of "deels" blijft het geplande bedrag van die betaling buiten de herverdeling: het staat (nog) op de rekening
  // en de geldlijn rekent ermee; zo schuift een "nee" het geld niet door naar andere betalingen waarvan de dag al voorbij is
  const resMap = m => new Map([...m].map(([id,v])=>[id, Math.max(v.x, v.rec ? num(v.rec.gepland) : 0)]));
  const res0 = resMap(dec0), res1 = resMap(dec1);
  const wil = (plan, n, dec) => { const m = new Map(); plan.items.forEach(it => { if(dec.has(it.id)) return; const a = it.alloc[n]||0; if(a>0.005) m.set(it.id, a); }); return m; };
  const planA = buildPlan({pin0:vastMap(dec0), pin1:vastMap(dec1), res0, res1});
  const W0 = wil(planA, 0, dec0);
  const glA = geldlijn({W0, W1:wil(planA,1,dec1), items:planA.items, sp, dec0});
  const act = (gl, n, dec) => { const m = vastMap(dec); gl.E.filter(e=>e.plan && e.plan.n===n).forEach(e=>m.set(e.plan.it.id, (m.get(e.plan.it.id)||0)+e.x)); return m; };
  const planB = buildPlan({pin0:act(glA,0,dec0), vast0:true, pin1:vastMap(dec1), res0, res1});
  const W1 = wil(planB, 1, dec1);
  const gl = geldlijn({W0, W1, items:planA.items, sp, dec0});
  const opts = {pin0:act(gl,0,dec0), vast0:true, pin1:act(gl,1,dec1), vast1:true, kas2:gl.per[1].eind, res0, res1};
  const plan = buildPlan(opts);
  Object.assign(plan, {sp, gl, dec0, dec1, W0, W1, itemsA:planA.items, opts});
  return plan;
}
// "Kan dit?": dezelfde geldlijn met één uitgave vandaag erbij
function geldlijnMet(plan, extra){ return geldlijn({W0:plan.W0, W1:plan.W1, items:plan.itemsA, sp:plan.sp, dec0:plan.dec0, extra}); }

// ---------- teksten bij een betaling uit het plan ----------
function wieTekst(e){ return e.plan ? e.plan.it.naam : e.naam; }
function betalingUitleg(e){
  const w = eur(e.wens), x = eur(e.x), laat = !!(e.plan && e.plan.laat), vb = laat ? "Nog niet gedaan? " : "", nu = laat ? "nu " : "";
  // staat er op die dag wel geld, dan is het nodig voor wat later nog afgaat: zeg dat erbij, anders lijkt het tegenstrijdig
  const voor = e.na!=null ? e.na + (e.x||0) : null;
  const later = voor!=null && voor > (e.x||0) + 0.5 ? ` Er staat dan ${eur0(voor)} op de rekening, maar dat is nodig voor ${e.soort==="terug" ? "rekeningen" : "rekeningen, terugbetalingen en vrij besteden"} die later nog komen.` : "";
  if(e.soort==="terug") return (e.status==="niet" ? `${vb}Het past ${nu}niet: €0 van ${w}.` : `${vb}Er past ${nu}${x} van ${w}.`)+later+(e.status==="niet" ? " Laat de ontvanger weten dat het later wordt." : " Laat de ontvanger weten dat de rest later komt.");
  if(e.soort==="doel") return (e.status==="niet" ? `${vb}Maak ${nu}niets over naar de spaarrekening.` : `${vb}Maak ${nu}${x} over in plaats van ${w}.`)+(later || ` ${e.status==="niet" ? "De "+w : "De rest"} is nodig voor rekeningen, terugbetalingen of vrij besteden.`);
  if(e.soort==="sparen") return (e.status==="niet" ? `Zet de automatische overboeking van ${w} deze keer stop: het geld is nodig.` : `Er is maar ${x} ruimte. Zet de automatische overboeking van ${w} deze keer lager of stop hem.`)+later;
  if(e.soort==="gepl") return (e.status==="niet" ? `Deze aankoop past nu niet (${w}). Schuif hem op.` : `Hiervoor is maar ${x} van ${w}. Schuif de aankoop op of maak hem goedkoper.`)+later;
  return "";
}
function betalingTitel(e){
  if(e.soort==="terug") return `${e.naam}: ${e.status==="niet"?"terugbetalen lukt niet":"maar deels terugbetalen"}`;
  if(e.soort==="doel") return `${e.naam}: ${e.status==="niet"?"niet sparen":"minder sparen"}`;
  if(e.soort==="sparen") return `${e.naam}: ${e.status==="niet"?"deze keer niet":"minder"}`;
  if(e.soort==="gepl") return `${e.naam} past niet`;
  return e.naam;
}
// knoppen bij een betaling uit het plan: Overgemaakt? (als de betaaldag voorbij is) en de gele uitleg als hij niet (helemaal) lukt
function pbInfo(e){ const p = e.plan; return {key:p.key, kind:p.it.kind, id:p.it.id, naam:p.it.naam, wens:e.wens, x:e.x, periode:iso(p.p.start), datum:iso(p.oorspr)}; }
function pbKnoppen(e, metGeel){
  if(!e.plan) return metGeel && e.status && e.status!=="ok" ? `<div class="geel">${v3status("warn")}<div><b>${esc(betalingTitel(e))}</b><small>${betalingUitleg(e)}</small></div></div>` : "";
  S.pbInfo = S.pbInfo || new Map(); S.pbInfo.set(e.plan.key, pbInfo(e));
  const mag = A("pl.doelen"), k = esc(e.plan.key);
  let h = "";
  if(e.plan.laat) h += `<div class="geel vraag">${v3status("warn")}<div><b>Moest op ${dkort(e.plan.oorspr)}: overgemaakt?</b><small>${e.status==="ok" ? `${eur(e.wens)} ${e.soort==="terug"?"aan "+esc(e.naam):"naar de spaarrekening voor "+esc(e.naam)}. Zolang jullie dit niet invullen, houdt de tool het geld apart.` : betalingUitleg(e)}</small>${mag ? `<div class="pbrow"><button type="button" class="btn sm" data-pb="ja:${k}">Ja, ${eur(e.wens)}</button><button type="button" class="btn sm" data-pb="deels:${k}">Deels</button><button type="button" class="btn sm" data-pb="nee:${k}">Nee</button></div>` : ""}</div></div>`;
  else if(metGeel && e.status!=="ok") h += `<div class="geel">${v3status("warn")}<div><b>${esc(betalingTitel(e))}</b><small>${betalingUitleg(e)}</small>${mag ? `<div class="pbrow"><button type="button" class="btn sm" data-pb="open:${k}">Afvinken</button></div>` : ""}</div></div>`;
  return h;
}

// ---------- het oordeel bovenaan Overzicht ----------
const uniek = a => [...new Set(a)];
function oordeel(gl){
  const t0 = gl.per[0], t1 = gl.per[1], eindD = dkort(gl.eind);
  if(gl.tekortRek>0.5){ const lr = gl.laagRek, niks = !gl.E.some(e=>e.lvl>=2 && e.soort!=="kandit" && e.x>0.005);
    return {cls:"bad", t:`Rekeningen komen ${eur0(gl.tekortRek)} tekort`, s:`${gl.start<-0.5 ? `De rekening staat nu al rood. ` : ""}Op ${dkort(lr.d)} staat hij op het laagst: ${eur(lr.v)}. ${niks ? `Tot ${eindD} gaat er daarom niets naar terugbetalingen, vrij besteden of sparen.` : `Tot dan gaat er niets naar terugbetalingen, vrij besteden of sparen.`}`}; }
  const terug = t0.terug.ev.concat(t1.terug.ev).filter(e=>e.status!=="ok");
  if(terug.length) return {cls:"warn", t:"Terugbetalen lukt niet helemaal", s: terug.slice(0,3).map(e=>`${esc(e.naam)}: ${eur0(e.x)} van ${eur0(e.wens)} op ${dkort(e.d)}`).join(". ")+". De rekeningen gaan voor."};
  if(t0.vrij.x < t0.vrij.budget-0.5) return {cls:"warn", t:"Minder vrij te besteden", s:`Van het budget is ${eur0(t0.vrij.budget)} over, maar er past ${eur0(t0.vrij.x)}. De rest is nodig voor rekeningen en terugbetalingen.`};
  const spaar = t0.sparen.ev.concat(t1.sparen.ev).filter(e=>e.status!=="ok");
  if(spaar.length) return {cls:"warn", t:"Sparen lukt niet helemaal", s: spaar.slice(0,3).map(e=>`${esc(e.naam)}: ${eur0(e.x)} van ${eur0(e.wens)}`).join(". ")+`. Tot ${eindD} gaan rekeningen, terugbetalingen en vrij besteden voor.`};
  if(gl.vrijCfg>0.5 && gl.U > gl.vrijCfg+0.5) return {cls:"warn", t:"Vrij budget is op", s:`${eur0(gl.U)} uitgegeven van ${eur0(gl.vrijCfg)}. Rekeningen, terugbetalingen en sparen passen nog tot ${eindD}; wat je nu nog uitgeeft, gaat van het sparen af.`};
  return {cls:"good", t:"Alles past", s:`Rekeningen, terugbetalingen, vrij besteden en sparen tot ${eindD}.`};
}

// ---------- Te doen: wat jullie nu moeten doen, met een datum voor de Tijdlijn ----------
function teDoen(plan, cur){
  const gl = plan.gl, p0 = gl.p0, loondag = addDays(p0.end,1), inn = inkomenNu(), todo = [], genoemd = new Set();
  const dagenTot = daysBetween(TODAY, loondag);
  if(gl.tekortRek>0.5){ const lr = gl.laagRek, rood = gl.start<-0.5, o = gl.onder;
    todo.push({cls:"bad", d: rood || !o ? TODAY : o.d || addDays(TODAY, o.i), t:`Er is ${eur0(gl.tekortRek)} extra nodig voor de rekeningen`, s:`${rood ? `De rekening staat nu al rood (${eur(gl.start)}). ` : o ? `Vanaf ${dkort(addDays(TODAY, o.i))} staat de rekening rood. ` : ""}Op het laagste punt, ${dkort(lr.d)}, is het ${eur(lr.v)} (gerekend tot ${dkort(gl.eind)}). Spaarsaldo: ${eur0(num(S.config.spaarsaldo))}.`}); }
  // betalingen uit het plan: overgemaakt? en wat niet (helemaal) lukt, deze en volgende periode
  gl.E.filter(e => e.plan || ((e.soort==="sparen"||e.soort==="gepl") && e.lvl>=3)).forEach(e => {
    if(e.plan){ S.pbInfo = S.pbInfo || new Map(); S.pbInfo.set(e.plan.key, pbInfo(e)); }
    if(e.plan && e.plan.laat){ genoemd.add(e.naam); todo.push({cls:"warn", geel:true, ev:true, d:TODAY, betaling:e.plan.key, t:`${e.naam}: overgemaakt?`, s:`Moest op ${dkort(e.plan.oorspr)}: ${eur(e.wens)} ${e.soort==="terug"?"terugbetalen":"naar de spaarrekening"}.${e.status!=="ok" ? " "+betalingUitleg(e) : " Zolang jullie dit niet invullen, houdt de tool het geld apart."}`, html: A("pl.doelen") ? pbRij(e.plan.key, e.wens) : ""}); return; }
    if(e.status==="ok") return;
    genoemd.add(e.naam);
    todo.push({cls:"warn", geel:true, ev:true, d:e.d, betaling: e.plan ? e.plan.key : null, t:`${dkort(e.d)} · ${betalingTitel(e)}`, s:betalingUitleg(e), edit: e.edit && Z(e.perm) ? e.edit : "", perm:e.perm});
  });
  // op het afschrift gevonden, nog niet afgevinkt
  [[p0, plan.dec0]].forEach(([p, dec]) => dec.forEach((v, id) => { if(v.status!=="afschrift") return;
    const it = planItemsAll().find(x=>x.src.id===id); if(!it) return;
    const key = pbKey(it.kind, id, p); S.pbInfo = S.pbInfo || new Map(); S.pbInfo.set(key, {key, kind:it.kind, id, naam:it.src.naam, wens:v.x, x:v.x, periode:iso(p.start), datum:iso(parseIso(v.found.rows[0][0]))});
    genoemd.add(it.src.naam);
    todo.push({cls:"info", d:TODAY, betaling:key, gevonden:true, t:`${it.src.naam}: ${eur(v.x)} gevonden op het afschrift`, s:`${v.found.rows.map(r=>dkort(parseIso(r[0]))+" "+esc(String(r[1]).split(" ").slice(0,3).join(" "))+" "+eur(-r[2])).join(", ")}. Het telt al mee; met Bijwerken staat het ook bij ${it.kind==="doel"?"al gespaard":"al afgelost"}.`, html: A("pl.doelen") ? `<div class="pbrow"><button type="button" class="btn sm" data-pb="bevestig:${esc(key)}">Bijwerken</button></div>` : ""}); }));
  // vrij besteden tot loondag
  const v = gl.per[0].vrij;

    <div class="legend3">${legend.map(([c,l,v,s])=>`<div class="lg"><i class="sw3 ${c}"></i><div class="lt"><span>${l}</span>${s?`<small>${s}</small>`:""}</div><b>${eur0(v)}</b><span class="pc">${pct(v)}</span></div>`).join("")}</div>

}

// ---------- afvinken van een betaling uit het plan ----------
async function zetBetaling(info, status, bedrag){
  if(!db) return toast("Opslaan kan niet: geen verbinding met de opslag.");
  if(!A("pl.doelen")) return toast("Afvinken staat voor jou uit.");
  const coll = info.kind==="doel" ? "doelen" : "extras", veld = info.kind==="doel" ? "gespaard" : "betaald";
  const item = S[coll].find(x=>x.id===info.id); if(!item) return toast("Dit doel bestaat niet meer.");
  const oud = (S.planbet||[]).find(r=>r.id===info.key), oudX = oud ? num(oud.betaald) : 0;
  const x = status==="nee" ? 0 : Math.max(0, Math.round(num(bedrag)*100)/100);
  const nieuw = Math.max(0, Math.round((num(item[veld]) - oudX + x)*100)/100);
  const upd = {[veld]:nieuw, bijgewerkt:new Date().toISOString()};
  if(info.kind==="extra") upd.status = nieuw >= num(item.bedrag)-0.005 ? "betaald" : "open";
  try{
    await db.doc("planbetaling/"+info.key).set({id:info.key, kind:info.kind, itemId:info.id, naam:info.naam, periode:info.periode, datum:info.datum, gepland:Math.round(num(info.wens)*100)/100, betaald:x, status, door:PROFIELEN[WHO.profiel]||"", bijgewerkt:new Date().toISOString()});
    await db.doc(coll+"/"+info.id).update(upd);
    toast(status==="nee" ? `${info.naam}: overgeslagen` : `${info.naam}: ${eur(x)} afgevinkt`);
    const d = $("#sheet"); if(d && d.open) d.close();
  }catch(e){ toast(e.code==="not_granted" ? "Je hebt alleen leesrechten." : "Afvinken lukte niet."); }
}
async function wisBetaling(info){
  const oud = (S.planbet||[]).find(r=>r.id===info.key); if(!oud) return;
  const coll = info.kind==="doel" ? "doelen" : "extras", veld = info.kind==="doel" ? "gespaard" : "betaald";
  const item = S[coll].find(x=>x.id===info.id);
  try{
    await db.doc("planbetaling/"+info.key).delete();
    if(item){ const nieuw = Math.max(0, Math.round((num(item[veld]) - num(oud.betaald))*100)/100); const upd = {[veld]:nieuw, bijgewerkt:new Date().toISOString()}; if(info.kind==="extra") upd.status = nieuw >= num(item.bedrag)-0.005 ? "betaald" : "open"; await db.doc(coll+"/"+info.id).update(upd); }

  }catch(e){ toast(e.code==="not_granted" ? "Je hebt alleen leesrechten." : "Ongedaan maken lukte niet."); }
}
function openBetaling(actie, key){

    ${rec ? `<div class="alert"><span class="dot"></span><div><b>Afgevinkt: ${rec.status==="nee" ? "niet overgemaakt" : eur(num(rec.betaald))+" overgemaakt"}</b><span class="small">${rec.door?"door "+esc(rec.door):""}</span></div></div>` : ""}
    <div class="field"><label for="pbBedrag">Hoeveel is er overgemaakt? (€)</label><input id="pbBedrag" class="bigin" inputmode="decimal" autocomplete="off" value="${esc(String(rec ? num(rec.betaald) : info.wens).replace(".",","))}"></div>
    <div class="btnrow"><button type="button" class="btn primary" id="pbBewaar">Bewaar</button><button type="button" class="btn" id="pbNee">Niet overgemaakt</button>${rec ? `<button type="button" class="btn danger" id="pbWeg">Ongedaan maken</button>` : ""}</div>
    <p class="hint">${info.kind==="doel" ? "Het bedrag komt bij \"al gespaard\"" : "Het bedrag komt bij \"al afgelost\""} van ${esc(info.naam)}. Wat niet is overgemaakt, blijft openstaan en schuift in het plan door.</p>`, d => {
      $("#pbBewaar").onclick = () => { const v = parseBedrag($("#pbBedrag").value); if(isNaN(v)) return toast("Vul een bedrag in (bijv. 150 of 150,00)."); zetBetaling(info, v>=info.wens-0.005 ? "ja" : v>0.005 ? "deels" : "nee", v); };

// ---------- "Kan dit?" op de geldlijn ----------
function runCheck(){
  const bedrag = num($("#chkBedrag").value), naam = $("#chkNaam").value.trim(), cat = $("#chkCat").value;
  S.chk = {bedrag:$("#chkBedrag").value, naam, cat};
  if(bedrag<=0){ S.chkHtml = `<div class="alert"><span class="dot"></span><div><b>Vul een bedrag in</b></div></div>`; $("#chkOut").innerHTML=S.chkHtml; return; }
  const plan = bereken(), gl = plan.gl, v = gl.per[0].vrij, loondag = addDays(gl.p0.end,1);
  const dagen = Math.max(1, daysBetween(TODAY, loondag));
  const nuVrij = Math.min(v.x, gl.capTerug);   // wat je nu kunt uitgeven zonder rekeningen of terugbetalingen te raken, binnen het vrije budget
  let lvl, titel, uitleg;
  const verschil = (gl2, f) => gl.E.filter(f).map(e => { const e2 = gl2.E.find(x=>x.lvl===e.lvl && x.soort===e.soort && x.naam===e.naam && x.i===e.i); return {e, x2: e2 ? e2.x : 0}; }).filter(z => z.e.x - z.x2 > 0.5);
  if(bedrag <= nuVrij + 0.005){
    const rest = v.x - bedrag; lvl = rest/dagen < 10 ? "warn" : "good";
    titel = lvl==="good" ? "Ja, dat past" : "Past, maar dan wordt het krap";
    uitleg = `Daarna nog ${eur(rest)} vrij te besteden tot ${dkort(loondag)}, ${eur(rest/dagen)} per dag. Rekeningen, terugbetalingen en sparen blijven zoals ze zijn.`;
  } else if(bedrag <= gl.capTerug + 0.005){
    const gl2 = geldlijnMet(plan, {bedrag, lvl:2.5, naam: naam||cat});
    const minder = verschil(gl2, e=>e.lvl===4);
    lvl = "warn";
    titel = minder.length ? "Kan, maar dan gaat er minder naar sparen" : "Kan, maar dan is het vrije budget op";
    uitleg = (v.x>0.5 ? `Er is nog ${eur(v.x)} vrij te besteden; dit is ${eur(bedrag - v.x)} meer. ` : `Er is geen vrij budget meer over. `) + (minder.length ? `Dat gaat af van: ${minder.slice(0,4).map(z=>`${z.e.naam} op ${dkort(z.e.d)} (${eur0(z.x2)} in plaats van ${eur0(z.e.x)})`).join(", ")}.` : `De rekeningen en terugbetalingen blijven gedekt.`);
  } else if(bedrag <= gl.capBills + 0.005){
    const gl2 = geldlijnMet(plan, {bedrag, lvl:1.5, naam: naam||cat});
    const minder = verschil(gl2, e=>e.lvl===2);
    lvl = "bad"; titel = "Kan, maar dan lukt een terugbetaling niet";
    uitleg = `De rekeningen blijven gedekt, maar ${minder.length ? minder.slice(0,3).map(z=>`${z.e.naam} krijgt op ${dkort(z.e.d)} ${eur0(z.x2)} in plaats van ${eur0(z.e.x)}`).join(", ") : "er gaat minder naar terugbetalingen"}. Ook sparen en vrij besteden schieten erbij in.`;
  } else {
    lvl = "bad"; titel = "Nee, dat past niet";
    uitleg = gl.tekortRek>0.5 ? `De rekeningen tot ${dkort(gl.eind)} zijn nu al niet gedekt (${eur0(gl.tekortRek)} tekort). Dit kan alleen uit het spaargeld (${eur0(num(S.config.spaarsaldo))}).` : `Dan kunnen rekeningen tot ${dkort(gl.eind)} niet meer betaald worden: ${eur0(bedrag - gl.capBills)} tekort. Dit kan alleen uit het spaargeld (${eur0(num(S.config.spaarsaldo))}).`;
  }
  const vs = lvl==="good" ? [] : voorstellenKanDit(bedrag, naam || cat, cat, plan);
  S.chkVoorstel = vs;
  const vsHtml = vs.length ? `<div class="card tight" style="margin-top:10px;gap:8px"><h3>Wanneer kan het wel?</h3>${vs.map((x,i)=>`<div class="alert good"><span class="dot"></span><div><b>${esc(x.titel)}</b><span class="small">${esc(x.uitleg)}</span>
      ${A("ov.kandit") ? `<div class="btnrow" style="margin-top:8px"><button class="btn sm primary" data-voorstel="${i}">${esc(x.knop)}</button></div>` : ""}</div></div>`).join("")}
    ${vs.uitleg?`<p class="hint">${esc(vs.uitleg)}</p>`:""}<p class="hint">Doorvoeren zet het als geplande aankoop van plan-geld bij Plan &amp; doelen → Verwacht. Op de tijdlijn gaat hij dan op zijn datum af (bij sparen), als het past.</p></div>`
    : (lvl==="good" ? "" : `<p class="hint" style="margin-top:8px">Ik vond binnen een jaar geen periode waarin dit past zonder dat een doel zijn datum mist.</p>`);
  S.chkHtml = `<div class="alert ${lvl}"><span class="dot"></span><div><b>${esc(titel)}</b><span class="small">${esc(uitleg)}</span>
    ${A("ov.kandit") ? `<div class="btnrow" style="margin-top:8px"><button class="btn ${lvl==="bad"?"":"primary"}" id="chkSave">${lvl==="bad"?"Toch nu uitgeven en vastleggen":"Uitgegeven, leg vast"}</button></div>` : ""}</div></div>${vsHtml}`;
  $("#chkOut").innerHTML = S.chkHtml;
  bindVoorstellen();
  if(!$("#chkSave")) return;
  $("#chkSave").onclick = async () => {
    if(!db) return toast("Opslaan kan niet: geen verbinding met de opslag.");
    const id = uid();
    try{ await db.doc("uitgaven/"+id).set({id, datum:iso(TODAY), naam: naam || cat, bedrag, categorie:cat, bijgewerkt:new Date().toISOString()});
      S.chk=null; S.chkHtml=""; toast("Vastgelegd en meegerekend"); }
    catch(e){ toast(e.code==="not_granted"?"Je hebt alleen leesrechten.":"Vastleggen lukte niet."); }
  };
}

// ---------- Plan & doelen ----------
function betaalStatus(plan, it, n){
  const p = n===0 ? plan.gl.p0 : plan.gl.p1, dec = (n===0 ? plan.dec0 : plan.dec1).get(it.id), key = pbKey(it.kind, it.id, p);
  S.pbInfo = S.pbInfo || new Map();
  if(dec){
    if(!S.pbInfo.has(key)) S.pbInfo.set(key, {key, kind:it.kind, id:it.id, naam:it.naam, wens: dec.rec ? num(dec.rec.gepland) || dec.x : dec.x, x:dec.x, periode:iso(p.start), datum: dec.rec && dec.rec.datum ? dec.rec.datum : iso(betaalDatum(it.src, p, it.deadline))});
    return dec.status==="nee" ? {t:"niet overgemaakt", cls:"warn", key} : dec.status==="afschrift" ? {t:`${eur0(dec.x)} gevonden op afschrift`, cls:"good", key} : {t:`${eur0(dec.x)} overgemaakt`, cls:"good", key};
  }
  const e = plan.gl.E.find(x=>x.plan && x.plan.it.id===it.id && x.plan.n===n);
  if(!e) return null;
  S.pbInfo.set(e.plan.key, pbInfo(e));
  if(e.plan.laat) return {t:`${eur0(e.wens)} op ${dkort(e.plan.oorspr)} · overgemaakt?`, cls:"warn", e, key:e.plan.key};
  return {t: e.status==="ok" ? `${eur0(e.x)} op ${dkort(e.d)}` : e.status==="niet" ? `${eur0(e.wens)} op ${dkort(e.d)} lukt niet` : `${eur0(e.x)} van ${eur0(e.wens)} op ${dkort(e.d)}`, cls: e.status==="ok" ? "good" : e.status==="niet" ? "bad" : "warn", e, key:e.plan.key};
}

      return `<div class="goalw"><button type="button" class="goal" data-edit="${it.kind==="doel"?"doelen":"extras"}:${esc(it.id)}">
